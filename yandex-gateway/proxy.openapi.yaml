# RPChess API-only Yandex Cloud Gateway (staging, not yet acceptance tested).
# Forwarding includes authenticated POST/PUT; Yandex stores no player data.
# Game files, game hosting and state remain on GitHub Pages/VK/Cloudflare.
# Replace the entire existing API Gateway specification with this document.
openapi: "3.0.0"
info:
  title: RPChess Yandex API-only gateway candidate
  version: "1.0.0"
paths:
  /ping:
    get:
      summary: Check direct reachability of Yandex API Gateway
      operationId: pingYandex
      responses:
        "200":
          description: Yandex gateway is reachable
          content:
            application/json:
              schema:
                type: object
      x-yc-apigateway-integration:
        type: dummy
        http_code: 200
        http_headers:
          Content-Type: application/json
        content:
          application/json: '{"ok":true,"via":"yandex-api-gateway"}'
  /probe/profile:
    get:
      summary: Check outbound Yandex-to-Cloudflare profile Worker HTTPS
      operationId: probeProfileWorker
      responses:
        "200":
          description: Upstream Worker health JSON
          content:
            application/json:
              schema:
                type: object
      x-yc-apigateway-integration:
        type: http
        url: https://rpchess-profile-preview.mobigametim.workers.dev/health
        method: GET
        timeouts:
          connect: 3
          read: 10
  /probe/tournament:
    get:
      summary: Check outbound Yandex-to-Cloudflare tournament Worker HTTPS
      operationId: probeTournamentWorker
      responses:
        "200":
          description: Upstream Worker health JSON
          content:
            application/json:
              schema:
                type: object
      x-yc-apigateway-integration:
        type: http
        url: https://rpchess-tournament-profile-preview.mobigametim.workers.dev/health
        method: GET
        timeouts:
          connect: 3
          read: 10

  # Full traffic remains on the existing trusted Cloudflare Workers.
  # HTTP integration passes request bodies and the original HTTP method;
  # credentials, Origin and query must be preserved explicitly.
  # No wildcard CORS policy at Yandex: OPTIONS is proxied, and the Workers
  # restrict Access-Control-Allow-Origin to the real RPChess origins.
  /profile/{profilePath+}:
    x-yc-apigateway-any-method:
      summary: RPChess profile API through Yandex (no local profile storage)
      operationId: proxyProfile
      parameters:
        - name: profilePath
          in: path
          required: false
          schema:
            type: string
      x-yc-apigateway-integration:
        type: http
        url: https://rpchess-profile-preview.mobigametim.workers.dev/{profilePath}
        headers:
          '*': '*'
          Host: rpchess-profile-preview.mobigametim.workers.dev
        query:
          '*': '*'
        omitEmptyHeaders: true
        omitEmptyQueryParameters: true
        timeouts:
          connect: 3
          read: 12
  /tournament/{tournamentPath+}:
    x-yc-apigateway-any-method:
      summary: RPChess tournament API through Yandex (same global lobby)
      operationId: proxyTournament
      parameters:
        - name: tournamentPath
          in: path
          required: false
          schema:
            type: string
      x-yc-apigateway-integration:
        type: http
        url: https://rpchess-tournament-profile-preview.mobigametim.workers.dev/{tournamentPath}
        headers:
          '*': '*'
          Host: rpchess-tournament-profile-preview.mobigametim.workers.dev
        query:
          '*': '*'
        omitEmptyHeaders: true
        omitEmptyQueryParameters: true
        timeouts:
          connect: 3
          read: 12
