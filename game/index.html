<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050a12">
  <meta name="description" content="RPChess — фэнтезийный шахматный roguelite">
  <title>RPChess</title>
  <link rel="stylesheet" href="css/reboot-foundation.css?v=20260826-reboot-2">
</head>
<body>
  <div id="app">
    <main class="reboot-menu-screen" data-reboot-foundation aria-label="Главное меню RPChess">
      <div class="reboot-menu-screen__layout">
        <section class="reboot-menu-screen__main">
          <div class="reboot-eyebrow">FANTASY TACTICAL CHESS ROGUELITE</div>
          <img class="reboot-wordmark" src="generated_assets/title_wordmark.png" alt="RPChess">
          <div class="reboot-menu-actions" aria-label="Главное меню">
            <button class="reboot-button reboot-button--primary" type="button" data-new-game>Новая игра</button>
            <button class="reboot-button" type="button" disabled aria-disabled="true">Продолжить</button>
            <div class="reboot-menu-secondary">
              <button class="reboot-button" type="button" data-settings>Настройки</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="reboot-modal" data-foundation-modal hidden>
    <section class="reboot-modal__panel" role="dialog" aria-modal="true" aria-labelledby="foundation-title">
      <header class="reboot-modal__header">
        <div>
          <div class="reboot-eyebrow">НОВАЯ ИГРА</div>
          <h2 id="foundation-title">Классические шахматы</h2>
        </div>
        <button class="reboot-close" type="button" data-close-modal aria-label="Закрыть">×</button>
      </header>
      <p>Режим пока недоступен в этой сборке.</p>
    </section>
  </div>

  <div class="reboot-modal" data-settings-modal hidden>
    <section class="reboot-modal__panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="reboot-modal__header">
        <div>
          <div class="reboot-eyebrow">RPCHESS</div>
          <h2 id="settings-title">Настройки</h2>
        </div>
        <button class="reboot-close" type="button" data-close-modal aria-label="Закрыть">×</button>
      </header>
      <div class="reboot-settings-grid">
        <label class="reboot-setting"><span>Музыка</span><input type="range" min="0" max="100" step="1" data-music-volume></label>
        <label class="reboot-setting"><span>Звуки</span><input type="range" min="0" max="100" step="1" data-sfx-volume></label>
        <label class="reboot-setting reboot-setting--toggle"><span>Уменьшить анимации</span><input type="checkbox" data-reduced-motion></label>
      </div>
    </section>
  </div>

  <script type="module" src="js/reboot-foundation.mjs?v=20260826-reboot-2"></script>
</body>
</html>
