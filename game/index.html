<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050a12">
  <meta name="description" content="RPChess — фэнтезийный шахматный roguelite">
  <title>RPChess</title>
  <link rel="stylesheet" href="css/reboot-foundation.css?v=20260826-reboot-3">
  <link rel="stylesheet" href="css/classic-chess.css?v=20260827-ai-2">
  <link rel="stylesheet" href="css/chess-ai-polish.css?v=20260827-ai-3">
</head>
<body>
  <div id="app">
    <main class="reboot-menu-screen" data-reboot-foundation aria-label="Главное меню RPChess">
      <div class="reboot-menu-screen__layout">
        <section class="reboot-menu-screen__main">
          <div class="reboot-eyebrow">FANTASY TACTICAL CHESS ROGUELITE</div>
          <img class="reboot-wordmark" src="generated_assets/title_wordmark.png" alt="RPChess">
          <div class="reboot-menu-actions" aria-label="Главное меню">
            <button class="reboot-button reboot-button--primary" type="button" data-new-game>Новая игра</button>
            <button class="reboot-button" type="button" disabled aria-disabled="true">Продолжить</button>
            <div class="reboot-menu-secondary">
              <button class="reboot-button" type="button" data-settings>Настройки</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <main class="classic-screen" data-classic-screen aria-label="Классические шахматы" hidden>
      <div class="classic-shell">
        <header class="classic-topbar">
          <img class="classic-logo" src="generated_assets/title_wordmark.png" alt="RPChess">
          <div class="classic-toolbar">
            <button class="classic-mini-button" type="button" data-classic-new>Новая партия</button>
            <button class="classic-mini-button" type="button" data-settings>Настройки</button>
            <button class="classic-mini-button" type="button" data-classic-menu>Главное меню</button>
          </div>
        </header>

        <aside class="classic-panel classic-party-panel" aria-label="Партия">
          <h2>Партия</h2>
          <p class="classic-opponent" data-game-mode>Локальная партия</p>
          <div class="classic-material" aria-label="Взятые фигуры и перевес по материалу">
            <div class="classic-material-row">
              <span class="classic-material-side">Белые</span>
              <div class="classic-captured-list" data-captured-by-white aria-label="Фигуры, взятые белыми"></div>
              <strong class="classic-material-advantage" data-material-white></strong>
            </div>
            <div class="classic-material-row">
              <span class="classic-material-side">Чёрные</span>
              <div class="classic-captured-list" data-captured-by-black aria-label="Фигуры, взятые чёрными"></div>
              <strong class="classic-material-advantage" data-material-black></strong>
            </div>
          </div>
          <p class="classic-side-state" data-classic-summary><strong>Белые</strong> начинают партию.</p>
          <div class="classic-result" data-game-result hidden>
            <h3 class="classic-result__title" data-result-title></h3>
            <p class="classic-result__text" data-result-text></p>
          </div>
        </aside>

        <section class="classic-main">
          <div class="classic-statusbar" aria-live="polite">
            <div class="classic-turn" data-classic-turn>Ход белых</div>
            <div class="classic-state" data-classic-state>Партия началась</div>
          </div>

          <div class="classic-board-wrap" data-board-wrap>
            <div class="classic-board" data-chess-board role="grid" aria-label="Шахматная доска 8 на 8"></div>
            <div class="classic-thinking" data-ai-thinking hidden aria-live="polite">Компьютер думает…</div>
          </div>
        </section>

        <aside class="classic-panel classic-panel--moves" aria-label="Ходы партии">
          <h3>Ходы</h3>
          <div class="classic-moves" data-move-history aria-live="polite">
            <div class="classic-empty">Ходов пока нет</div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <div class="reboot-modal" data-game-setup-modal hidden>
    <section class="reboot-modal__panel classic-commander-panel classic-setup-panel" role="dialog" aria-modal="true" aria-labelledby="game-setup-title">
      <header class="reboot-modal__header">
        <div>
          <div class="reboot-eyebrow">НОВАЯ ПАРТИЯ</div>
          <h2 id="game-setup-title">Выберите соперника</h2>
        </div>
        <button class="reboot-close" type="button" data-close-modal aria-label="Закрыть">×</button>
      </header>

      <div class="classic-setup-grid">
        <label class="classic-setup-field">
          <span>Режим</span>
          <select data-game-mode-select>
            <option value="ai" selected>Против компьютера</option>
            <option value="local">Локальная партия</option>
          </select>
        </label>

        <label class="classic-setup-field" data-ai-elo-field>
          <span>Сила соперника</span>
          <select data-ai-elo>
            <option value="400">Новичок I · ≈400 Elo</option>
            <option value="600">Новичок II · ≈600 Elo</option>
            <option value="800" selected>Любитель · ≈800 Elo</option>
            <option value="1000">Любитель+ · ≈1000 Elo</option>
            <option value="1200">Клубный новичок · ≈1200 Elo</option>
            <option value="1400">Клубный · ≈1400 Elo</option>
            <option value="1600">Сильный клубный · ≈1600 Elo</option>
            <option value="1800">Эксперт · ≈1800 Elo</option>
            <option value="2000">Мастерский · ≈2000 Elo</option>
            <option value="2200">Мастер+ · ≈2200 Elo</option>
            <option value="2400">Очень сильный · ≈2400 Elo</option>
            <option value="2600">Гроссмейстер · ≈2600 Elo</option>
          </select>
        </label>

        <label class="classic-setup-field" data-player-color-field>
          <span>Ваш цвет</span>
          <select data-player-color>
            <option value="w" selected>Белые</option>
            <option value="b">Чёрные</option>
            <option value="random">Случайно</option>
          </select>
        </label>
      </div>

      <div class="classic-setup-footer">
        <div class="classic-engine-credit" data-engine-credit>Stockfish 18 lite · GPLv3 · <a href="vendor/stockfish/COPYING.txt" target="_blank" rel="noopener">лицензия</a> · <a href="vendor/stockfish/SOURCE.txt" target="_blank" rel="noopener">исходный код</a></div>
        <button class="reboot-button reboot-button--primary" type="button" data-start-game>Начать партию</button>
      </div>
    </section>
  </div>

  <div class="reboot-modal" data-promotion-modal data-modal-static hidden>
    <section class="reboot-modal__panel classic-commander-panel" role="dialog" aria-modal="true" aria-labelledby="promotion-title">
      <header class="reboot-modal__header">
        <div>
          <div class="reboot-eyebrow">ПРЕВРАЩЕНИЕ</div>
          <h2 id="promotion-title">Выберите фигуру</h2>
        </div>
      </header>
      <div class="classic-promotion-grid" data-promotion-options></div>
    </section>
  </div>

  <div class="reboot-modal" data-settings-modal hidden>
    <section class="reboot-modal__panel classic-commander-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="reboot-modal__header">
        <div>
          <div class="reboot-eyebrow">RPCHESS</div>
          <h2 id="settings-title">Настройки</h2>
        </div>
        <button class="reboot-close" type="button" data-close-modal aria-label="Закрыть">×</button>
      </header>
      <div class="reboot-settings-grid">
        <label class="reboot-setting"><span>Музыка</span><input type="range" min="0" max="100" step="1" data-music-volume></label>
        <label class="reboot-setting"><span>Звуки</span><input type="range" min="0" max="100" step="1" data-sfx-volume></label>
        <label class="reboot-setting reboot-setting--toggle"><span>Уменьшить анимации</span><input type="checkbox" data-reduced-motion></label>
      </div>
    </section>
  </div>

  <script type="module" src="js/reboot-foundation.mjs?v=20260826-reboot-3"></script>
  <script type="module" src="js/classic-chess-app.mjs?v=20260827-ai-2"></script>
</body>
</html>
