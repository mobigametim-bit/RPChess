name = "rpchess"
compatibility_date = "2026-08-04"

[build]
command = "npm run build && npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2 @sparticuz/chromium@140.0.0 && node scripts/browser-launch-probe.cjs"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
