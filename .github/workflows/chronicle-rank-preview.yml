name: Chronicle rank retry — isolated QA build and synthetic rank demo
on:
  push:
    branches: [fix/chronicle-rank-sync-retry-20261117]
    paths:
      - 'game/**'
      - 'tests/**'
      - 'chronicle-rank-preview/**'
      - '.github/workflows/chronicle-rank-preview.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpchess-chronicle-rank-qa-preview
  cancel-in-progress: true

jobs:
  qa:
    if: github.repository == 'mobigametim-bit/RPChess' && github.ref == 'refs/heads/fix/chronicle-rank-sync-retry-20261117'
    name: Verify and publish isolated Chronicle QA
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install dependencies and SHA-verified Stockfish 18
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm pack stockfish@18.0.0 --silent --pack-destination /tmp
          mkdir -p /tmp/rpchess-stockfish-package /tmp/rpchess-stockfish-verified
          tar -xzf /tmp/stockfish-18.0.0.tgz -C /tmp/rpchess-stockfish-package
          package=/tmp/rpchess-stockfish-package/package
          for name in stockfish-18-lite-single.js stockfish-18-lite-single.wasm; do
            source=$(find "$package" -type f -name "$name" -print -quit)
            test -n "$source"
            cp "$source" "/tmp/rpchess-stockfish-verified/$name"
          done
          license=$(find "$package" -type f -iname 'Copying.txt' -print -quit)
          test -n "$license"
          cp "$license" /tmp/rpchess-stockfish-verified/COPYING.txt
      - name: Canonical Node checks and production-equivalent build
        env:
          RPCHESS_STOCKFISH_ASSET_DIR: /tmp/rpchess-stockfish-verified
        run: npm run gate:local
      - name: Install pinned Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install chromium
      - name: Regression — Chronicle and authenticated profile browser paths
        env:
          RPCHESS_BROWSER_TEST: chronicle-localization-browser.cjs
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
      - name: Add synthetic test-only Chronicle demo to isolated dist
        run: |
          set -euo pipefail
          cp chronicle-rank-preview/demo.js dist/chronicle-qa-demo.js
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const file='dist/index.html';
          let html=fs.readFileSync(file,'utf8');
          assert(html.includes('<head>')&&!html.includes('chronicle-qa-demo.js'));
          html=html.replace('<head>','<head>\n<script src="chronicle-qa-demo.js"></script>');
          fs.writeFileSync(file,html);
          assert(html.includes('chronicle-qa-demo.js'));
          console.log('Isolated QA-only demo injection complete; source game/ untouched');
          NODE
      - name: Deploy standalone Chronicle QA game (no profile/D1 Worker deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config chronicle-rank-preview/wrangler.toml
      - name: Verify isolated build assets on Cloudflare
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const root='https://rpchess-chronicle-rank-qa-preview.mobigametim.workers.dev';
          (async()=>{
            for(let attempt=0;attempt<12;attempt++){
              try{
                for(const [file,token] of [
                  ['/','chronicle-qa-demo.js'],
                  ['/chronicle-qa-demo.js','RPChessChronicleQADemo'],
                  ['/js/profile-client.mjs','flushLatestChronicleForRanking'],
                  ['/js/player-identity-chronicle.mjs','chronicleRankRetry'],
                  ['/js/leaderboard-client.mjs','profileSyncStatus']]){
                    const response=await fetch(root+file,{cache:'no-store'});
                    assert.equal(response.status,200,file);
                    assert((await response.text()).includes(token),file+' is not accepted PR #215 QA build');
                }
                console.log('Isolated Chronicle QA build: LIVE '+root);
                return;
              }catch(error){
                if(attempt===11)throw error;
                await new Promise(done=>setTimeout(done,3000));
              }
            }
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Verify no-real-D1 demo, retry and fake #1 in Chromium
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const root='https://rpchess-chronicle-rank-qa-preview.mobigametim.workers.dev/';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:1240,height:800}});
              let realProfileRequests=0;
              page.on('request',req=>{
                if(req.url().startsWith('https://rpchess-profile-preview.mobigametim.workers.dev'))
                  realProfileRequests++;
              });
              page.on('pageerror',e=>console.error('QA PAGE ERROR',String(e)));
              await page.goto(root+'?chronicle_qa=1&rpchess_profile=1&rpchess_api_route=direct',
                {waitUntil:'domcontentloaded',timeout:45000});
              await page.locator('[data-chronicle-qa-notice]').waitFor({timeout:45000});
              const retry=page.locator('[data-chronicle-rank-retry]');
              await retry.waitFor({state:'visible',timeout:45000});
              const initial=await page.evaluate(async()=>{
                const {currentLeaderboard}=await import('./js/leaderboard-client.mjs');
                return {
                  profileStatus:globalThis.RPChessProfileStatus?.status,
                  profileReason:String(globalThis.RPChessProfileStatus?.reason||'').slice(0,130),
                  board:currentLeaderboard(),
                  ownText:document.querySelector('.chronicle-leaderboard-self')?.textContent,
                  bestText:document.querySelector('.chronicle-v2-personal-score')?.textContent,
                  mock:globalThis.RPChessChronicleQADemo
                };
              });
              console.log('CHRONICLE QA DIAGNOSTIC',JSON.stringify(initial));
              await page.waitForFunction(()=>
                !!document.querySelector('.chronicle-leaderboard-self')?.textContent?.includes('Не опубликован'),
                null,{timeout:20000});
              assert.equal((await page.locator('.chronicle-v2-personal-score').textContent()).trim(),'373');
              await retry.click({timeout:20000,force:true});
              await page.waitForTimeout(500);
              const afterRetry=await page.evaluate(async()=>{
                const {currentLeaderboard}=await import('./js/leaderboard-client.mjs');
                return {
                  board:currentLeaderboard(),
                  ownText:document.querySelector('.chronicle-leaderboard-self')?.textContent,
                  mock:globalThis.RPChessChronicleQADemo
                };
              });
              console.log('CHRONICLE QA AFTER RETRY',JSON.stringify(afterRetry));
              await page.waitForFunction(()=>
                !!document.querySelector('.chronicle-leaderboard-self strong')?.textContent?.includes('#1'),
                null,{timeout:20000});
              const state=await page.evaluate(()=>globalThis.RPChessChronicleQADemo);
              assert(state.attemptedRetry&&state.refreshRequests>=1,'QA must exercise the real retry button');
              assert.equal(realProfileRequests,0,'Synthetic demo must never call real D1 Profile API');
              console.log('CHRONICLE QA PASS: best 373, unpublished -> fake #1 on retry; no real D1 HTTP calls');
            }finally{await browser.close();}
          })().catch(err=>{console.error(err.stack||err);process.exitCode=1});
          NODE
      - name: Archive QA debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-rank-qa-screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
