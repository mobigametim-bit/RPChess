name: Focused Tournament compact header UI review

on:
  push:
    branches: [fix/tournament-compact-header-phone-tablet-20261107]
    paths:
      - 'game/js/tournament-app.mjs'
      - 'game/css/tournament-v4.css'
      - 'game/index.html'
      - 'tests/tournament-v4-browser.cjs'
      - '.github/workflows/tournament-header-scoped-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tournament-compact-header-review
  cancel-in-progress: true

jobs:
  portrait-and-tablet:
    if: github.repository == 'mobigametim-bit/RPChess' && github.ref == 'refs/heads/fix/tournament-compact-header-phone-tablet-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reuse optimized asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Build playable static game (NO unrelated test suites)
        run: |
          npm ci --no-audit --no-fund
          node --check game/js/tournament-app.mjs
          npm run puzzles:materialize
          npm run build:materialized
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install chromium
      - name: Only Tournament v4 viewport and toolbar regression
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: tournament-v4-browser.cjs
        run: npm run test:browser
      - name: Preserve phone and tablet screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-compact-header-six-viewports
          path: test-results/tournament-v4
          if-no-files-found: warn
          retention-days: 14
      - name: Deploy isolated STATIC preview (no gameplay Workers/DO/D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          grep -qx 'name = "rpchess-tournament-v4-preview"' tournament-v4-preview/wrangler.toml
          npx wrangler deploy --config tournament-v4-preview/wrangler.toml
      - name: Confirm preview has corrected single-header markup
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const base='https://rpchess-tournament-v4-preview.mobigametim.workers.dev';
            const js=await fetch(base+'/js/tournament-app.mjs',{cache:'no-store'});
            assert.equal(js.status,200);
            const body=await js.text();
            assert(body.includes("'</nav></header>'"),'new match header code missing');
            const css=await fetch(base+'/css/tournament-v4.css',{cache:'no-store'});
            assert.equal(css.status,200);
            assert((await css.text()).includes('A single control group belongs to the Tournament title row'));
            console.log('ISOLATED STATIC REVIEW READY:',base+'/?rpchess_profile=0');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
