name: RPChess Landscape Review

on:
  push:
    branches:
      - feature/landscape-ui-redesign

permissions:
  contents: read

jobs:
  responsive-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run deterministic/build gate
        run: npm run gate:local
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run landscape responsive contract
        env:
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser
      - name: Capture current landscape UI matrix
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='scripts/capture-landscape-review.cjs';
          let s=fs.readFileSync(p,'utf8');
          const oldBootstrap="  await page.locator('[data-reboot-foundation]:not([hidden])').waitFor();";
          const portraitAwareBootstrap="  if (await page.evaluate(() => innerHeight > innerWidth && innerWidth <= 1180)) await page.locator('[data-orientation-lock]').waitFor({ state:'visible' }); else await page.locator('[data-reboot-foundation]:not([hidden])').waitFor();";
          if(!s.includes(oldBootstrap)) throw new Error('capture bootstrap marker not found');
          s=s.replace(oldBootstrap,portraitAwareBootstrap);
          const duplicateRunReset="async function freshRun(page) {\n  await freshMenu(page);\n  await startNewRun(page, { playerName:'Тестовый Хранитель' });\n}";
          const singleRunReset="async function freshRun(page) {\n  await startNewRun(page, { playerName:'Тестовый Хранитель' });\n}";
          if(!s.includes(duplicateRunReset)) throw new Error('capture freshRun marker not found');
          fs.writeFileSync(p,s.replace(duplicateRunReset,singleRunReset));
          NODE
          node scripts/capture-landscape-review.cjs
      - name: Upload landscape review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: landscape-review-${{ github.sha }}
          path: artifacts/landscape-review
          if-no-files-found: error
          retention-days: 14
