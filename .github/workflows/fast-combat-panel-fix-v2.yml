name: Fast combat panel fix verification v2

on:
  push:
    branches:
      - fix/combat-panel-vk-pages-fast-2026-09-11

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/combat-panel-vk-pages-fast-2026-09-11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply root owner fix and extend existing viewport regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game/css/chess-ai-polish.css'); s=p.read_text(encoding='utf-8')
          old="    width:calc(100% - 18px)!important;\n    max-width:calc(100% - 18px)!important;"
          new="    width:min(\n      calc(100vw - 100dvh - 4px),\n      max(220px, calc(48vw - 48dvh - 2px))\n    )!important;\n    max-width:none!important;"
          assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('game/css/combat-side-colors.css'); s=p.read_text(encoding='utf-8')
          marker='\n/* Shared compact-combat spacing: preserve the fixed board and turn unused left-rail width into air. */\n'
          assert marker in s; p.write_text(s.split(marker,1)[0].rstrip()+'\n',encoding='utf-8')

          p=Path('tests/responsive-viewport-browser.cjs'); s=p.read_text(encoding='utf-8')
          old="""      return {\n        movesInsideParty:Boolean(party&&moves&&moves.parentElement===party),\n        movesInShell:Boolean(shell&&moves&&moves.parentElement===shell),\n        gap:p&&b?b.left-p.right:0\n      };"""
          new="""      const m=moves?.getBoundingClientRect();\n      return {\n        movesInsideParty:Boolean(party&&moves&&moves.parentElement===party),\n        movesInShell:Boolean(shell&&moves&&moves.parentElement===shell),\n        partyWidth:p?.width||0,\n        movesWidth:m?.width||0,\n        gap:p&&b?b.left-p.right:0\n      };"""
          assert s.count(old)==1; s=s.replace(old,new,1)
          old="""    assert.strictEqual(combatPanel.movesInsideParty, false, `${label}: run combat Journal must not be reparented into the Party panel`);\n    assert.strictEqual(combatPanel.movesInShell, true, `${label}: run combat Journal must remain in its stable classic-shell owner slot`);\n    assert(combatPanel.gap >= 4, `${label}: combat information panel must not touch the board`);"""
          new="""    const expectedCombatPanelWidth = Math.min(width - height - 4, Math.max(220, .48 * width - .48 * height - 2));\n    assert.strictEqual(combatPanel.movesInsideParty, false, `${label}: run combat Journal must not be reparented into the Party panel`);\n    assert.strictEqual(combatPanel.movesInShell, true, `${label}: run combat Journal must remain in its stable classic-shell owner slot`);\n    assert(Math.abs(combatPanel.partyWidth - expectedCombatPanelWidth) <= 2, `${label}: Skirmish Party frame width ${combatPanel.partyWidth}px must match ${expectedCombatPanelWidth}px`);\n    assert(Math.abs(combatPanel.movesWidth - expectedCombatPanelWidth) <= 2, `${label}: Skirmish Journal frame width ${combatPanel.movesWidth}px must match ${expectedCombatPanelWidth}px`);\n    assert(combatPanel.gap >= 4, `${label}: combat information panel must not touch the board`);"""
          assert s.count(old)==1; s=s.replace(old,new,1)
          old="""    await page.locator('[data-battle-start]').click();\n    await page.locator('[data-classic-screen]:not([hidden])').waitFor();\n    await page.evaluate(() => globalThis.RPChessBattle.finishBattle({ over:true, type:'stalemate', winner:null }));"""
          new="""    await page.locator('[data-battle-start]').click();\n    await page.locator('[data-classic-screen]:not([hidden])').waitFor();\n    const battleCombatPanel = await page.evaluate(() => {\n      const party=document.querySelector('.classic-party-panel')?.getBoundingClientRect();\n      const moves=document.querySelector('.classic-panel--moves')?.getBoundingClientRect();\n      const board=document.querySelector('[data-chess-board]')?.getBoundingClientRect();\n      return { partyWidth:party?.width||0, movesWidth:moves?.width||0, gap:party&&board?board.left-party.right:0 };\n    });\n    assert(Math.abs(battleCombatPanel.partyWidth - expectedCombatPanelWidth) <= 2, `${label}: Battle Party frame width ${battleCombatPanel.partyWidth}px must match ${expectedCombatPanelWidth}px`);\n    assert(Math.abs(battleCombatPanel.movesWidth - expectedCombatPanelWidth) <= 2, `${label}: Battle Journal frame width ${battleCombatPanel.movesWidth}px must match ${expectedCombatPanelWidth}px`);\n    assert(battleCombatPanel.gap >= 4, `${label}: Battle information panel must not touch the board`);\n    await page.evaluate(() => globalThis.RPChessBattle.finishBattle({ over:true, type:'stalemate', winner:null }));"""
          assert s.count(old)==1; p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - run: npm ci --no-audit --no-fund
      - name: Focused regressions and canonical build
        run: npm run test:ui && npm run test:skirmish && npm run test:battle && npm run build

      - name: Replace one allowlisted browser test with ephemeral width proof
        shell: bash
        run: |
          cp tests/combat-side-colors-browser.cjs /tmp/combat-side-colors-browser.cjs
          cat > tests/combat-side-colors-browser.cjs <<'NODE'
          const assert=require('assert');
          const {chromium}=require('playwright');
          const {startNewRun}=require('./browser-test-helpers.cjs');
          const url=process.env.RPCHESS_ACCEPTANCE_URL||'http://127.0.0.1:4173';
          async function geom(page){return page.evaluate(()=>{const p=document.querySelector('.classic-party-panel')?.getBoundingClientRect(),m=document.querySelector('.classic-panel--moves')?.getBoundingClientRect(),b=document.querySelector('[data-chess-board]')?.getBoundingClientRect();return{p:p?.width||0,m:m?.width||0,g:p&&b?b.left-p.right:0}})}
          async function check(browser,w,h){const page=await browser.newPage({viewport:{width:w,height:h}});try{await page.goto(url,{waitUntil:'networkidle'});await page.evaluate(()=>localStorage.clear());await page.reload({waitUntil:'networkidle'});await startNewRun(page,{playerName:'Width Gate'});const expected=Math.min(w-h-4,Math.max(220,.48*w-.48*h-2));await page.evaluate(()=>dispatchEvent(new CustomEvent('rpchess:skirmish-open')));await page.locator('[data-skirmish-screen]:not([hidden])').waitFor();await page.locator('[data-skirmish-start]').click();await page.locator('[data-classic-screen]:not([hidden])').waitFor();let x=await geom(page);assert(Math.abs(x.p-expected)<=2,`Skirmish ${w}x${h}: ${x.p} != ${expected}`);assert(Math.abs(x.m-expected)<=2);assert(x.g>=4);await page.evaluate(()=>globalThis.RPChessSkirmish.finishBattle({over:true,type:'stalemate',winner:null}));await page.locator('[data-skirmish-aftermath]:not([hidden])').waitFor();await page.evaluate(()=>dispatchEvent(new CustomEvent('rpchess:battle-open')));await page.locator('[data-battle-screen]:not([hidden])').waitFor();await page.locator('[data-battle-start]').click();await page.locator('[data-classic-screen]:not([hidden])').waitFor();x=await geom(page);assert(Math.abs(x.p-expected)<=2,`Battle ${w}x${h}: ${x.p} != ${expected}`);assert(Math.abs(x.m-expected)<=2);assert(x.g>=4);console.log(`${w}x${h}: expected ${expected.toFixed(1)}, Battle ${x.p.toFixed(1)}/${x.m.toFixed(1)}, gap ${x.g.toFixed(1)} PASS`)}finally{await page.close()}}
          (async()=>{const b=await chromium.launch({headless:true});try{for(const d of [[1897,789],[1366,768],[844,390]])await check(b,...d)}finally{await b.close()}})().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Prove actual frame width in Chromium
        env:
          RPCHESS_BROWSER_TEST: combat-side-colors-browser.cjs
        run: npm run test:browser

      - name: Commit only permanent changes
        shell: bash
        run: |
          cp /tmp/combat-side-colors-browser.cjs tests/combat-side-colors-browser.cjs
          rm -f .github/workflows/fast-combat-panel-fix.yml .github/workflows/fast-combat-panel-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/css/chess-ai-polish.css game/css/combat-side-colors.css tests/responsive-viewport-browser.cjs tests/combat-side-colors-browser.cjs .github/workflows/fast-combat-panel-fix.yml .github/workflows/fast-combat-panel-fix-v2.yml
          git commit -m "fix: enforce narrow Battle and Skirmish combat frames [skip ci]"
          git push origin HEAD:fix/combat-panel-vk-pages-fast-2026-09-11
