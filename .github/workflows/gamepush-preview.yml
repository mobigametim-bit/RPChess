name: Deploy isolated GamePush SDK preview

on:
  push:
    branches:
      - feature/gamepush-sdk-foundation-20261104
      - feature/gamepush-vk-ads-validation-20261105
    paths:
      - .github/workflows/gamepush-preview.yml
      - gamepush-preview/**
      - game/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
  # PR events on main created queued/skipped preview runs for unrelated work.
  # Feature branch pushes are the only automatic GamePush preview trigger.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamepush-sdk-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.repository == 'mobigametim-bit/RPChess' && (github.ref == 'refs/heads/feature/gamepush-sdk-foundation-20261104' || github.ref == 'refs/heads/feature/gamepush-vk-ads-validation-20261105')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Build and verify game
        run: |
          npm ci --no-audit --no-fund
          npm run gate:local
      - name: Browser runtime prerequisite
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Verify accepted gameplay scenes with Chromium
        env:
          RPCHESS_BROWSER_TEST: portrait-key-scenes-browser.cjs
        run: npm run test:browser
      - name: Require existing Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
      - name: Publish dedicated static preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config gamepush-preview/wrangler.toml
      - name: Check live isolated preview and opt-in launch
        run: |
          set -euo pipefail
          base='https://rpchess-gamepush-preview.mobigametim.workers.dev'
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 "$base/" -o /tmp/gamepush-preview-index.html &&
               grep -q 'data-game-loading' /tmp/gamepush-preview-index.html &&
               curl --fail --silent --show-error --max-time 20 "$base/js/gamepush-sdk.mjs" -o /tmp/gamepush-preview-sdk.mjs &&
               grep -q 'const PROJECT_ID = 31247' /tmp/gamepush-preview-sdk.mjs; then
              echo "Preview is serving RPChess and GamePush SDK: $base/"
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::Isolated GamePush preview did not serve expected content"
              exit 1
            fi
            sleep 5
          done
          RPCHESS_GAMEPUSH_PREVIEW="$base" node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage();
              // Seed an old-style save before page boot. The new GamePush
              // namespace must neither read, delete, nor modify it.
              await page.addInitScript(()=>{
                localStorage.setItem('rpchess.reboot.v1.run','legacy-keep-intact');
                localStorage.setItem('rpchess.reboot.v1.settings',JSON.stringify({language:'en',simplePieces:true}));
              });
              const issues=[];
              page.on('pageerror',error=>issues.push('runtime: '+error.message.slice(0,240)));
              page.on('requestfailed',request=>{
                const host=new URL(request.url()).hostname;
                if(/gamepush|eponesh/.test(host)) issues.push('cdn: '+host+' '+request.failure()?.errorText);
              });
              await page.goto(process.env.RPCHESS_GAMEPUSH_PREVIEW+'/?rpchess_gamepush=1',{waitUntil:'domcontentloaded',timeout:40000});
              await page.locator('[data-new-game]').waitFor({state:'visible',timeout:35000});
              await page.waitForFunction(()=>globalThis.RPChessPlatform?.gamepush?.enabled===true,null,{timeout:20000});
              const statusEvents=await page.evaluate(()=>{
                window.__gpTrialEvents=[];
                addEventListener('rpchess:gamepush-status',event=>{
                  window.__gpTrialEvents.push({status:event.detail?.status,reason:String(event.detail?.reason||'').slice(0,240)});
                });
                return true;
              });
              try {
                await page.waitForFunction(()=>['ready','unavailable'].includes(globalThis.RPChessPlatform?.gamepush?.status),null,{timeout:55000});
              } catch {
                console.log('GamePush SDK readiness deadline hit');
              }
              const result=await page.evaluate(()=>({
                gamepushEnabled:globalThis.RPChessPlatform.gamepush.enabled,
                projectId:globalThis.RPChessPlatform.gamepush.projectId,
                status:globalThis.RPChessPlatform.gamepush.status,
                menuVisible:!document.querySelector('[data-reboot-foundation]')?.hidden,
                reasons:window.__gpTrialEvents||[]
              }));
              const fresh=await page.evaluate(()=>{
                const store=globalThis.RPChessPlatform?.storage;
                const local=globalThis.localStorage;
                store?.setItem('rpchess.gp-smoke','ok');
                return {
                  priorSaveIntact:local.getItem('rpchess.reboot.v1.run')==='legacy-keep-intact',
                  freshSave:store?.getItem('rpchess.reboot.v1.run')===null,
                  freshSettings:store?.getItem('rpchess.reboot.v1.settings')===null,
                  scopedWrite:local.getItem('rpchess.gamepush.v2.rpchess.gp-smoke')==='ok',
                  noLegacyWrite:local.getItem('rpchess.gp-smoke')===null,
                  noLegacyCloud:store?.cloud?.available===false
                };
              });
              if(Object.values(fresh).some(v=>!v))throw Error('Fresh GamePush namespace regression: '+JSON.stringify(fresh));
              console.log('GamePush v2 fresh-start isolation:',JSON.stringify(fresh));
              console.log('GamePush trusted-origin SDK check:',JSON.stringify(result));
              if(issues.length)console.log('GamePush network/runtime diagnostics:',JSON.stringify(issues.slice(0,10)));
              if(!result.gamepushEnabled||result.projectId!==31247||!result.menuVisible)throw Error('Game/menu readiness failed');
              if(result.status!=='ready')throw Error('GamePush player did not become ready: '+result.status);
              // Combined Web/PWA profile + GamePush trial must not accidentally
              // offer rewarded VK advertisements outside a real VK host.
              await page.goto(process.env.RPCHESS_GAMEPUSH_PREVIEW+'/?rpchess_profile=1&rpchess_gamepush=1',
                {waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForFunction(()=>window.RPChessProfileStatus?.status==='ready',null,{timeout:35000});
              const combined=await page.evaluate(()=>({
                profileEnabled:window.RPChessPlatform.profileEnabled,
                gamepushEnabled:window.RPChessPlatform.gamepush.enabled,
                provider:window.RPChessPlatform.ads.backend,
                vkConfirmed:window.RPChessPlatform.ads.diagnostics.vkHostConfirmed
              }));
              if(!combined.profileEnabled||!combined.gamepushEnabled||combined.provider!=='none'||combined.vkConfirmed)
                throw Error('Standalone Web must not expose VK native/reward ads: '+JSON.stringify(combined));
            } finally {await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          echo "Validated preview: $base/?rpchess_gamepush=1" >> "$GITHUB_STEP_SUMMARY"
