name: Deploy Great Commanders leaderboard API (staging)

on:
  push:
    branches:
      - feature/great-commanders-leaderboard-20261015
    paths:
      - leaderboard-worker/**
      - .github/workflows/leaderboard-api-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpchess-leaderboard-api-preview
  cancel-in-progress: false

jobs:
  deploy:
    # PR checks never deploy implicitly. A deliberate owner commit starts staging.
    if: >-
      github.repository == 'mobigametim-bit/RPChess' &&
      (
        (github.event_name == 'push' && github.event.head_commit.message == 'deploy: leaderboard preview') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/great-commanders-leaderboard-20261015')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Require deploy credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - name: Apply leaderboard D1 schema (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute rpchess-leaderboard --remote --file leaderboard-worker/schema.sql --config leaderboard-worker/wrangler.toml --yes
      - name: Deploy dedicated leaderboard API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config leaderboard-worker/wrangler.toml
      - name: Remaining manual step
        run: |
          echo "Deployed only rpchess-leaderboard (not the deleted static rpchess Worker)."
          echo "Add VK_APP_SECRET as an encrypted Worker secret in Cloudflare Dashboard."
          echo "Signed score submissions require the secret."
