name: VK frame-width manual acceptance preview
on:
  push:
    branches:
      - fix/combat-frame-width-build
permissions:
  contents: read
  actions: read
concurrency:
  group: vk-hosting-dev
  cancel-in-progress: false
jobs:
  deploy-requested-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the already verified VK artifact
        uses: actions/download-artifact@v4
        with:
          name: RPChess-VK-frame-fix
          path: dist-vk
          run-id: 34586758727
          github-token: ${{ github.token }}
      - name: Verify exact acceptance artifact
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const info = JSON.parse(fs.readFileSync('dist-vk/CHECKPOINT.json', 'utf8'));
          assert.strictEqual(info.source_head, '2fd10385c04b4efee59b96817a517b9beb1f2549');
          const css = fs.readFileSync('dist-vk/css/chess-ai-polish.css', 'utf8');
          assert(css.includes('width:min(calc(100% - 18px),max(220px,48%))!important;'));
          console.log('Verified exact frame-width acceptance artifact: ' + info.source_head);
          NODE
      - name: Deploy requested VK dev preview
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: dev
          CI_URLS: 'true'
        run: |
          if [ -z "$MINI_APPS_ACCESS_TOKEN" ]; then
            echo "VK Hosting deploy token is not configured."
            exit 1
          fi
          npx --yes @vkontakte/vk-miniapps-deploy@1.0.2
