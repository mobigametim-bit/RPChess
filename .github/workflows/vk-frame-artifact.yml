name: VK frame-width build artifact
on:
  push:
    branches:
      - fix/combat-frame-width-build
permissions:
  contents: read
jobs:
  build-vk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore runtime assets
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - name: Build real VK candidate
        run: npm run build:vk
      - name: Check VK packaging
        run: npm run test:vk-build
      - name: Verify frame fix in delivered CSS
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const css = fs.readFileSync('dist-vk/css/chess-ai-polish.css', 'utf8');
          assert(css.includes('width:min(calc(100% - 18px),max(220px,48%))!important;'));
          assert(fs.readFileSync('dist-vk/index.html', 'utf8').includes('chess-ai-polish.css?v=20260911-combat-frame'));
          fs.writeFileSync('dist-vk/CHECKPOINT.json', JSON.stringify({
            source_head: process.env.GITHUB_SHA,
            change: 'Narrow Battle and Skirmish Party + Journal to 48% of the left rail, readable minimum 220px; board unchanged',
            visual_acceptance: 'pending user check'
          }, null, 2) + '\n');
          console.log('Delivered combat-frame CSS and cache version: PASS');
          NODE
      - name: Upload VK build for manual acceptance
        uses: actions/upload-artifact@v4
        with:
          name: RPChess-VK-frame-fix
          path: dist-vk/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
