name: Apply VK pre-moderation platform pass

on:
  push:
    branches:
      - platform/vk-premoderation-implementation
    paths:
      - .github/workflows/vk-premoderation-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/vk-premoderation-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply platform boundary, lifecycle and storage changes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          foundation = root / 'game/js/reboot-foundation.mjs'
          s = foundation.read_text(encoding='utf-8')
          s = s.replace("import { RebootAudio } from './reboot-audio.mjs';\n", "import { RebootAudio } from './reboot-audio.mjs';\nimport { platform } from './platform.mjs';\n", 1)
          s, n = re.subn(r"function initVKHost\(\) \{.*?\n\}\n\ninitVKHost\(\);\n", "platform.init();\n", s, count=1, flags=re.S)
          assert n == 1, 'VK init block not found'
          old = """function clearLegacySavesOnce() {\n  if (localStorage.getItem(REBOOT_INIT_KEY) === '1') return;\n  const remove = [];\n  for (let index = 0; index < localStorage.length; index += 1) {\n    const key = localStorage.key(index);\n    if (key && key.startsWith('rpchess.') && !key.startsWith('rpchess.reboot.')) remove.push(key);\n  }\n  for (const key of remove) localStorage.removeItem(key);\n  localStorage.setItem(REBOOT_INIT_KEY, '1');\n}\n"""
          new = """function clearLegacySavesOnce() {\n  const target = platform.storage.sync();\n  if (!target || target.getItem(REBOOT_INIT_KEY) === '1') return;\n  const remove = [];\n  for (let index = 0; index < target.length; index += 1) {\n    const key = target.key(index);\n    if (key && key.startsWith('rpchess.') && !key.startsWith('rpchess.reboot.')) remove.push(key);\n  }\n  for (const key of remove) target.removeItem(key);\n  target.setItem(REBOOT_INIT_KEY, '1');\n}\n"""
          assert old in s, 'legacy save block not found'
          s = s.replace(old, new, 1)
          s = s.replace("JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')", "JSON.parse(platform.storage.getItem(SETTINGS_KEY) || '{}')", 1)
          s = s.replace("  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));", "  platform.storage.setItem(SETTINGS_KEY, JSON.stringify(settings));", 1)
          marker = "globalThis.RPChessRebootAudio = audio;\n"
          assert marker in s
          s = s.replace(marker, marker + "globalThis.RPChessPlatform = platform;\nconst unsubscribePlatformLifecycle = platform.lifecycle.subscribe(({ active }) => audio.setHostActive(active));\n", 1)
          old_unload = "addEventListener('beforeunload', () => audio.destroy(), { once: true });"
          assert old_unload in s
          s = s.replace(old_unload, "addEventListener('beforeunload', () => { unsubscribePlatformLifecycle(); audio.destroy(); }, { once: true });", 1)
          foundation.write_text(s, encoding='utf-8')

          audio = root / 'game/js/reboot-audio.mjs'
          s = audio.read_text(encoding='utf-8')
          s = s.replace("    this.activated = false;\n", "    this.activated = false;\n    this.hostActive = true;\n", 1)
          s = s.replace("    if (this.activated && this.settings.music > 0) this.music?.play().catch(() => {});", "    if (this.hostActive && this.activated && this.settings.music > 0) this.music?.play().catch(() => {});", 1)
          s = s.replace("    } else if (this.activated && this.music.paused) {", "    } else if (this.hostActive && this.activated && this.music.paused) {", 1)
          marker = "  tone(frequency = 520, duration = 0.045, type = 'square', gain = 0.032) {\n    if (!this.activated || this.settings.sfx <= 0) return;"
          replacement = """  setHostActive(active) {\n    this.hostActive = Boolean(active);\n    if (!this.hostActive) {\n      if (this.music && !this.music.paused) this.music.pause();\n      if (this.context?.state === 'running') this.context.suspend().catch(() => {});\n      return;\n    }\n    if (this.activated) {\n      this.ensureContext();\n      this.applySettings(this.settings);\n    }\n  }\n\n  tone(frequency = 520, duration = 0.045, type = 'square', gain = 0.032) {\n    if (!this.hostActive || !this.activated || this.settings.sfx <= 0) return;"""
          assert marker in s, 'tone block not found'
          s = s.replace(marker, replacement, 1)
          audio.write_text(s, encoding='utf-8')

          persistence = root / 'game/js/run-persistence.mjs'
          s = persistence.read_text(encoding='utf-8')
          s = s.replace("import { createStarterRoster } from './roster-data.mjs';\n", "import { createStarterRoster } from './roster-data.mjs';\nimport { platform } from './platform.mjs';\n", 1)
          old = "function resolveStorage(storage) { if (storage) return storage; if (typeof localStorage !== 'undefined') return localStorage; return null; }"
          new = "function resolveStorage(storage) { if (storage) return storage; return platform.storage.sync(); }"
          assert old in s
          s = s.replace(old, new, 1)
          persistence.write_text(s, encoding='utf-8')

          build = root / 'scripts/build.cjs'
          s = build.read_text(encoding='utf-8')
          old = "'js/reboot-foundation.mjs','js/reboot-audio.mjs','js/i18n.mjs'"
          new = "'js/reboot-foundation.mjs','js/reboot-audio.mjs','js/platform.mjs','js/i18n.mjs'"
          assert old in s
          build.write_text(s.replace(old, new, 1), encoding='utf-8')

          test = root / 'tests/reboot-foundation.cjs'
          s = test.read_text(encoding='utf-8')
          old = "audio=fs.readFileSync(path.join(game,'js/reboot-audio.mjs'),'utf8'),info="
          new = "audio=fs.readFileSync(path.join(game,'js/reboot-audio.mjs'),'utf8'),platform=fs.readFileSync(path.join(game,'js/platform.mjs'),'utf8'),persistence=fs.readFileSync(path.join(game,'js/run-persistence.mjs'),'utf8'),info="
          assert old in s
          s = s.replace(old, new, 1)
          pattern = r"assert\(js\.includes\(\"launchParams\.has\('vk_app_id'\)\"\).*?standalone Pages startup'\);"
          replacement = "assert(js.includes(\"import { platform } from './platform.mjs'\")&&js.includes('platform.init()')&&js.includes('platform.lifecycle.subscribe'),'Foundation must initialize and subscribe through the shared platform adapter');for(const token of [\"params.has('vk_app_id')\",\"handler:'VKWebAppInit'\",\"type:'vk-connect'\",'AndroidBridge?.VKWebAppInit','messageHandlers?.VKWebAppInit','pagehide','pageshow','visibilitychange'])assert(platform.includes(token),`Platform adapter missing ${token}`);assert(persistence.includes(\"import { platform } from './platform.mjs'\")&&persistence.includes('platform.storage.sync()'),'Run persistence must use the shared synchronous storage boundary');for(const token of ['setHostActive','hostActive','context.suspend()'])assert(audio.includes(token),`Audio lifecycle contract missing ${token}`);"
          s, n = re.subn(pattern, replacement, s, count=1)
          assert n == 1, 'old VK foundation assertion not found'
          s = s.replace("for(const token of [\"'js/i18n.mjs'\",\"'localization'\"])", "for(const token of [\"'js/platform.mjs'\",\"'js/i18n.mjs'\",\"'localization'\"])", 1)
          test.write_text(s, encoding='utf-8')
      - name: Focused regression
        run: |
          npm run test:foundation
          npm run test:roster
          npm run test:identity
          npm run test:power
          npm run build
      - name: Commit validated implementation
        run: |
          rm .github/workflows/vk-premoderation-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "platform: isolate VK lifecycle and storage boundary"
          git push origin HEAD:platform/vk-premoderation-implementation
