name: Generate Puzzles 2000

on:
  push:
    branches:
      - content/puzzles-2000
    paths:
      - '.github/workflows/generate-puzzles-2000.yml'
      - 'scripts/import-lichess-puzzles.cjs'
      - 'scripts/validate-puzzle-catalog.cjs'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/puzzles-2000
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure zstd is available
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Generate curated 2000-task Lichess CC0 catalog
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 \
            https://database.lichess.org/lichess_db_puzzle.csv.zst \
            | zstd -dc \
            | node scripts/import-lichess-puzzles.cjs \
                --stdin \
                --output game/js/puzzles/puzzle-catalog.mjs \
                --count 2000 \
                --seed rpchess-puzzles-v1

      - name: Lightweight catalog validation
        run: node scripts/validate-puzzle-catalog.cjs

      - name: Commit generated production catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/js/puzzles/puzzle-catalog.mjs
          if git diff --cached --quiet; then
            echo "Catalog already up to date."
            exit 0
          fi
          git commit -m "Puzzles content: generate curated 2000-task catalog"
          git push origin HEAD:content/puzzles-2000
