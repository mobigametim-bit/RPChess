name: Solo King Run End Visual

on:
  push:
    branches:
      - ci/solo-king-run-end-visual
    paths:
      - .github/workflows/solo-king-run-end-visual.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/battle-solo-king-run-end
          path: feature
          fetch-depth: 0

      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          ref: ci/solo-king-run-end-visual
          path: harness
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: feature/package-lock.json

      - name: Install dependencies
        working-directory: feature
        run: npm ci --no-audit --no-fund

      - name: Apply approved presentation changes
        working-directory: feature
        run: python ../harness/ci/solo-king-patch.py

      - name: Run focused gameplay regression
        working-directory: feature
        run: npm run test:battle

      - name: Build canonical production dist
        working-directory: feature
        run: npm run build

      - name: Install Chromium
        working-directory: feature
        run: npx playwright install --with-deps chromium

      - name: Start local production server
        working-directory: feature
        shell: bash
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/rpchess-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rpchess-server.log
          exit 1

      - name: Run exact solo-King visual gate and capture screenshots
        working-directory: feature
        run: node ../harness/ci/solo-king-visual.cjs

      - name: Commit validated source changes to feature branch
        working-directory: feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/localization/ui.mjs game/js/battle-app.mjs game/css/landscape-ui-redesign.css tests/responsive-viewport-browser.cjs
          git commit -m "ui: fit solo king Battle run end in one viewport"
          git push origin HEAD:fix/battle-solo-king-run-end

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: solo-king-run-end-screenshots
          path: feature/solo-king-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
