name: Post-Event Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-post-event-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record completed Event iteration first
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('docs/FULL_PROJECT_REVIEW_REPORT.md')
          text=p.read_text()
          source='da8e0a56e136d450bef633d52682b2274c0ee2ee'
          text=re.sub(r"(\*\*Current remediation code head:\*\* `)[^`]+(`)",rf"\g<1>{source}\2",text,count=1)
          marker='### Responsive owner checkpoint — da8e0a56'
          if marker not in text:
              lines=["",marker,"","- `e42b5ad834defe31e9cd7a5f4d34e147aaa8ccdd` removed the remaining runtime `landscape-ui-redesign.mjs` CSS injection, moved compact-combat viewport ownership into the static landscape stylesheet, and passed exact-checkout `gate:local` plus targeted `1024×768 RU` combat geometry.","- `da8e0a56e136d450bef633d52682b2274c0ee2ee` restores the accepted owner-scoped `body.events-active` Event landscape contract in static `landscape-ui-redesign.css` after that runtime-style removal.","- Existing `events.cjs` now prevents scoped Event choice rails from returning to two columns.","- Exact-checkout `gate:local`: **PASS**.","- Targeted Event Chromium (`1024×768 RU`, `844×390 RU`): **PASS**.","- Full responsive/all-Chromium validation continues after this checkpoint; no full-browser PASS is claimed here.","- `main`, Pages deployment policy and Cloudflare remain untouched.","","**Дальнейшие действия:**","1. Run the complete strengthened RU/EN/boundary responsive matrix on this implementation lineage.","2. If responsive is green, run all Chromium contracts on the same implementation; otherwise fix only the next evidence-backed owner defect.","3. Normalize `package-lock.json` reproducibly through npm and prove `npm ci` plus dependency security.","4. Finish evidence-backed asset inventory and keep ambiguous/planned assets.","5. Remove temporary audit helpers/workflows, then finalize `CURRENT_STATE.md` and historical/deployment documentation.",""]
              text+='\n'.join(lines)
          p.write_text(text)
          PY
          git config user.name "mobigametim-bit"
          git config user.email "mobigametim@gmail.com"
          git add docs/FULL_PROJECT_REVIEW_REPORT.md
          git commit -m "docs: checkpoint Event landscape owner fix"
          git push origin HEAD:audit/full-project-review-2026-09-08
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run canonical local gate
        run: npm run gate:local
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install chromium
      - name: Run full responsive contract
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser
      - name: Run all Chromium contracts
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
      - name: Record full browser PASS
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/FULL_PROJECT_REVIEW_REPORT.md')
          text=p.read_text()
          marker='### Full browser verification — da8e0a56'
          if marker not in text:
              lines=["",marker,"","- Complete strengthened responsive RU/EN/boundary contract: **PASS**.","- Complete Chromium browser contract set: **PASS** on implementation `da8e0a56e136d450bef633d52682b2274c0ee2ee`.","- Browser-verification-pending findings may now be closed only where this full gate covers their contract.","","**Дальнейшие действия:**","1. Normalize stale lock metadata through npm and rerun dependency-security plus `gate:local`.","2. Finish evidence-backed asset inventory/removal and rerun final local/browser gates if production files change.","3. Remove temporary audit helpers/workflows.","4. Update `CURRENT_STATE.md`, final audit statuses and historical/deployment docs.","5. Keep `main` frozen and Cloudflare manual-only until explicit owner direction.",""]
              text+='\n'.join(lines)
          p.write_text(text)
          PY
          git add docs/FULL_PROJECT_REVIEW_REPORT.md
          git commit -m "docs: record full Chromium verification"
          git push origin HEAD:audit/full-project-review-2026-09-08
