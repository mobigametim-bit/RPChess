name: Race Board Browser Gate

on:
  push:
    branches:
      - feature/race-board-themes

permissions:
  contents: read

jobs:
  board-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production dist
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run race board Chromium acceptance
        env:
          RPCHESS_BROWSER_TEST: race-board-themes-browser.cjs
        run: npm run test:browser
