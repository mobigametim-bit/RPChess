name: Import six named rook portraits and pieces (PR 160)

on:
  push:
    branches:
      - feature/race-chess-piece-art-20261016
    paths:
      - .github/workflows/import-named-rooks-pr160.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'mobigametim-bit/RPChess'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify supplied 18 WebP assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1h6Rlbre-NdVbMaJfkLQQgW6ydn9zumsE&export=download&confirm=t' \
            -o /tmp/named-rooks.zip
          echo 'da586b5b3895bd53f8ff6709d8d64dfb66f916003a57381d6636abb1f824ea9a  /tmp/named-rooks.zip' | sha256sum -c -
          unzip -t /tmp/named-rooks.zip
      - name: Install six named rooks in runtime paths
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/named-rooks.zip -d .
          for hero in aldric_wall batu_cliff ivar_lens cassian_coin maeve_root rat_banner; do
            portrait="game/assets/heroes/$hero/portrait_named.webp"
            test -s "$portrait"
            test "$(head -c4 "$portrait")" = 'RIFF'
            for side in white black; do
              sprite="game/assets/heroes/$hero/pieces/$side/rook.webp"
              test -s "$sprite"
              test "$(head -c4 "$sprite")" = 'RIFF'
            done
          done
      - name: Commit only verified rook art to PR160
        shell: bash
        run: |
          set -euo pipefail
          for hero in aldric_wall batu_cliff ivar_lens cassian_coin maeve_root rat_banner; do
            git add "game/assets/heroes/$hero/portrait_named.webp" \
              "game/assets/heroes/$hero/pieces/white/rook.webp" \
              "game/assets/heroes/$hero/pieces/black/rook.webp"
          done
          git diff --cached --quiet && { echo 'All assets already committed'; exit 0; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'assets: import six named rooks (18 optimized WebP)'
          git push origin HEAD:feature/race-chess-piece-art-20261016
