name: Validate RPChess VK build

on:
  pull_request:
    paths:
      - 'package.json'
      - 'game/js/reboot-audio.mjs'
      - 'game/js/reboot-foundation.mjs'
      - 'game/js/platform/**'
      - 'platforms/vk/**'
      - 'scripts/build-vk.cjs'
      - 'scripts/run-browser-tests.cjs'
      - 'scripts/run-vk-browser-tests.cjs'
      - 'tests/vk-*.cjs'
      - 'vk-hosting-config.json'
      - '.github/workflows/vk-platform.yml'
      - '.github/workflows/vk-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-vk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate VK adapter and production build
        run: npm run gate:vk

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Build VK mock variant
        run: node scripts/build-vk.cjs --mock

      - name: Run VK browser bootstrap + mobile audio unlock smoke
        env:
          RPCHESS_AUDIO_UNLOCK_RETRY: '1'
        run: npm run test:browser:vk

      - name: Build VK Bridge init-failure variant
        run: node scripts/build-vk.cjs --mock-fail

      - name: Verify VK Bridge failure fallback
        env:
          RPCHESS_BROWSER_TEST: vk-platform-browser.cjs
        run: npm run test:browser:vk
