name: Validate RPChess VK build

# One-shot marker is intentionally read from the PR body; remove the deploy job after success.
# The job is dev-only, still runs gate:vk before uploading, and exists only for the current mobile-audio verification.
on:
  pull_request:
    paths:
      - 'package.json'
      - 'game/js/reboot-audio.mjs'
      - 'game/js/reboot-foundation.mjs'
      - 'game/js/platform/**'
      - 'platforms/vk/**'
      - 'scripts/build-vk.cjs'
      - 'scripts/run-browser-tests.cjs'
      - 'scripts/run-vk-browser-tests.cjs'
      - 'tests/vk-*.cjs'
      - 'vk-hosting-config.json'
      - '.github/workflows/vk-platform.yml'
      - '.github/workflows/vk-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-vk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate VK adapter and production build
        run: npm run gate:vk

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Build VK mock variant
        run: node scripts/build-vk.cjs --mock

      - name: Run VK browser bootstrap + mobile audio unlock smoke
        env:
          RPCHESS_AUDIO_UNLOCK_RETRY: '1'
        run: npm run test:browser:vk

      - name: Build VK Bridge init-failure variant
        run: node scripts/build-vk.cjs --mock-fail

      - name: Verify VK Bridge failure fallback
        env:
          RPCHESS_BROWSER_TEST: vk-platform-browser.cjs
        run: npm run test:browser:vk

  one-shot-vk-mobile-audio-deploy:
    name: one-shot VK mobile audio fix dev deploy
    needs: validate-vk
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[VK_MOBILE_AUDIO_DEPLOY_ONESHOT]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
      MINI_APPS_ENVIRONMENT: dev
      CI_URLS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate exact VK candidate
        run: npm run gate:vk
      - name: Require VK Hosting access token
        shell: bash
        run: |
          if [ -z "$MINI_APPS_ACCESS_TOKEN" ]; then
            echo "MINI_APPS_ACCESS_TOKEN is not configured in GitHub Actions Secrets."
            exit 1
          fi
      - name: Deploy VK mobile audio fix to dev
        run: npx --yes @vkontakte/vk-miniapps-deploy@1.0.2
