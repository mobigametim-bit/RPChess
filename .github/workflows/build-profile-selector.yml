name: Build browser profile selector

on:
  push:
    branches:
      - ui/browser-profile-selector
    paths:
      - .github/workflows/build-profile-selector.yml
      - src/browser/profile-persistence.cjs
      - src/browser/iron-marches-browser-entry.cjs
      - game/js/vertical-slice-app.mjs
      - tests/browser-profile-selector.cjs
      - package.json

permissions:
  contents: write

concurrency:
  group: build-browser-profile-selector
  cancel-in-progress: true

jobs:
  test-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/browser-profile-selector
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Commit generated runtime bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/js/generated/iron-marches-runtime.bundle.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Regenerate browser runtime for profile selector'
          git push origin HEAD:ui/browser-profile-selector
