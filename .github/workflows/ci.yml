name: RPChess Reboot CI (manual diagnostic)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/race-board-themes

permissions:
  contents: read

jobs:
  verify-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Profile race board runtime candidates
        run: |
          node scripts/board-asset-runtime.cjs --root game --max-side 256
          node scripts/board-asset-runtime.cjs --root game --max-side 384
      - name: Run local source, deterministic and build gate
        run: npm run gate:local
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run full real Chromium regression
        timeout-minutes: 30
        run: npm run test:browser
