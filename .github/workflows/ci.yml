name: RPChess CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-web-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install image audit dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<12'
      - name: Verify normalized source
        run: npm run verify
      - name: Run legacy characterization tests
        run: npm test
      - name: Verify Register 02 visual audit
        run: npm run assets:audit:register02
      - name: Build web distribution
        run: npm run build
      - name: Verify distribution entry
        run: test -f dist/index.html && test -f dist/SFX/win_fanfare.mp3
