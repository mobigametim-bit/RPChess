name: RPChess targeted Event EN diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/localisation-completion
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  event-en:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build acceptance bundle
        run: npm run build
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run targeted Event Chromium regression
        timeout-minutes: 10
        run: RPCHESS_BROWSER_TEST=events-browser.cjs npm run test:browser
