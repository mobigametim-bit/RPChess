name: RPChess CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-web-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/domain-army-runtime-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild production browser runtime
        run: npm run build:browser
      - name: Commit synchronized browser runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/js/generated/iron-marches-runtime.bundle.js
          if git diff --cached --quiet; then
            echo 'Browser runtime is already synchronized.'
          else
            git commit -m 'Synchronize domain army browser runtime'
            git push origin HEAD:agent/domain-army-runtime-migration
          fi
      - name: Verify normalized source
        run: npm run verify
      - name: Run legacy characterization tests
        run: npm test
      - name: Build web distribution
        run: npm run build
      - name: Verify distribution entry
        run: test -f dist/index.html && test -f dist/SFX/win_fanfare.mp3
