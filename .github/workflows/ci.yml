name: RPChess Reboot CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/classic-chess

permissions:
  contents: read

concurrency:
  group: rpchess-reboot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-classic-chess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Reboot source contract
        run: npm run verify
      - name: Run retained Foundation and Classic Chess tests
        run: npm test
      - name: Build Classic Chess web distribution
        run: npm run build
      - name: Verify clean Classic Chess distribution boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/css/reboot-foundation.css
          test -f dist/css/classic-chess.css
          test -f dist/js/reboot-foundation.mjs
          test -f dist/js/reboot-audio.mjs
          test -f dist/js/classic-chess-engine.mjs
          test -f dist/js/classic-chess-app.mjs
          test -f dist/generated_assets/logo_main.png
          test -f dist/generated_assets/title_wordmark.png
          test -f dist/generated_assets/splash_poster.jpg
          for piece in pawn knight bishop rook queen king; do
            test -f "dist/generated_assets/unit_${piece}_player.png"
            test -f "dist/generated_assets/unit_${piece}_enemy.png"
          done
          for track in 01 02 03 04; do
            test -f "dist/music/echoes_iron_throne_${track}.mp3"
          done
          test ! -e dist/js/generated/iron-marches-runtime.bundle.js
          ! grep -q 'vertical-slice-app.mjs' dist/index.html
          ! grep -q 'iron-marches-runtime.bundle.js' dist/index.html
          ! grep -q 'explicit-run-setup.mjs' dist/index.html
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run real Chromium Foundation and Classic Chess acceptance
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/rpchess-reboot-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          export RPCHESS_ACCEPTANCE_URL=http://127.0.0.1:4173
          stdbuf -oL -eL node tests/reboot-foundation-browser.cjs
          stdbuf -oL -eL node tests/classic-chess-browser.cjs
