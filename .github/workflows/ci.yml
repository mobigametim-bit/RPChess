name: RPChess CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rpchess-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify normalized source
        run: npm run verify
      - name: Run legacy characterization tests
        run: npm test
      - name: Build web distribution
        run: npm run build
      - name: Verify distribution entry
        run: test -f dist/index.html && test -f dist/SFX/win_fanfare.mp3
