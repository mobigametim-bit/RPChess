name: RPChess CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/b9-map-generator-rebuild

permissions:
  contents: read

concurrency:
  group: rpchess-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify normalized source
        run: npm run verify
      - name: Validate production content
        run: npm run content:validate
      - name: Run complete test suite
        run: npm test
      - name: Build web distribution
        run: npm run build
      - name: Verify distribution entry
        run: test -f dist/index.html && test -f dist/SFX/win_fanfare.mp3
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run real Chromium Iron Marches acceptance
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/rpchess-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          RPCHESS_ACCEPTANCE_URL=http://127.0.0.1:4173 node tests/iron-marches-browser-acceptance.cjs
      - name: Upload browser distribution
        uses: actions/upload-artifact@v4
        with:
          name: rpchess-browser-dist
          path: dist
          if-no-files-found: error
          retention-days: 3