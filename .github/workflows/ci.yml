name: RPChess Reboot CI (final branch diagnostic)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/localisation-completion
    paths:
      - .github/workflows/ci.yml

# Temporary branch-only trigger for the final cleaned runtime gate. Restored after the run.
permissions:
  contents: read

jobs:
  verify-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run local source, deterministic and build gate
        run: npm run gate:local
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run full real Chromium regression
        timeout-minutes: 30
        run: npm run test:browser
