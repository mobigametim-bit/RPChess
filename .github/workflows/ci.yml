name: RPChess localization diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/localisation-completion
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run localization regression
        run: npm run test:localization
