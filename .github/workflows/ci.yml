name: RPChess Reboot CI (targeted Travel gate)

on:
  workflow_dispatch:
  push:
    branches:
      - ui/travel-choice-commandbar-pass

permissions:
  contents: read

jobs:
  verify-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run local source, deterministic and build gate
        run: npm run gate:local
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run targeted Travel real Chromium gate
        timeout-minutes: 15
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/rpchess-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          RPCHESS_ACCEPTANCE_URL=http://127.0.0.1:4173 node tests/travel-choice-browser.cjs
