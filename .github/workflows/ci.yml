name: RPChess background optimization probe

on:
  push:
    branches:
      - perf/background-asset-runtime-budget
  workflow_dispatch:

permissions:
  contents: read

jobs:
  background-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Probe 6-bit RGB background runtime payload
        run: node scripts/background-asset-runtime.cjs --root game --bits 6
      - name: Probe 5-bit RGB background runtime payload
        run: node scripts/background-asset-runtime.cjs --root game --bits 5
