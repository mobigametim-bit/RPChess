name: RPChess background runtime gate

on:
  push:
    branches:
      - perf/background-asset-runtime-budget
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run local source, deterministic and build gate
        run: npm run gate:local
