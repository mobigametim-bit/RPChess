name: Repair One-off Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-workflow-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix validation assertion syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/audit-validation-one-off.yml')
          t=p.read_text()
          old="assert(eventChoiceLandscapeBlocks.every(block=>!block.includes('repeat(2'))),'scoped Event landscape rails must never return to two columns');"
          new="assert(eventChoiceLandscapeBlocks.every(block=>!block.includes('repeat(2')),'scoped Event landscape rails must never return to two columns');"
          if t.count(old)!=1:
              raise SystemExit(f'expected exactly one broken assertion, got {t.count(old)}')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit repair
        run: |
          git config user.name "mobigametim-bit"
          git config user.email "mobigametim@gmail.com"
          git add .github/workflows/audit-validation-one-off.yml
          git diff --cached --check
          git commit -m "ci: fix Event validation assertion syntax"
          git push origin HEAD:audit/full-project-review-2026-09-08
