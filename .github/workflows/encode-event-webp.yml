name: Encode approved Event backgrounds WebP 1280 q55
on:
  push:
    branches:
      - feature/race-chess-piece-art-20261016
    paths:
      - .github/workflows/encode-event-webp.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encode:
    if: github.repository == 'mobigametim-bit/RPChess' && github.ref == 'refs/heads/feature/race-chess-piece-art-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for one-time asset generation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate and verify all 37 WebP backgrounds
        run: node scripts/encode-event-webp.cjs
      - name: Commit optimized WebP alongside untouched PNG master files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find game/assets/events/register-04 -name '*.webp' -print0 | xargs -0 git add --
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'Backgrounds already encoded'
          else
            git commit -m 'assets: add 37 WebP 1280x720 q55 Event backgrounds'
            git fetch origin feature/race-chess-piece-art-20261016
            git rebase FETCH_HEAD
            git push origin HEAD:feature/race-chess-piece-art-20261016
          fi
      - name: Preserve WebP files for repeatable release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpchess-37-event-webp-q55
          path: game/assets/events/register-04/**/*.webp
          if-no-files-found: warn
          retention-days: 14
