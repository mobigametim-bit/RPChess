name: One-shot corrected Kingdom sprites import
on:
  push:
    branches:
      - feature/infinite-kingdom-map-auto-encounters-20261108
    paths:
      - .github/workflows/import-fixed-kingdom-sprites.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/infinite-kingdom-map-auto-encounters-20261108
          persist-credentials: true
      - name: Fetch exact artist PNG archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://drive.usercontent.google.com/download?id=1FXse0JG1ACuV_lcOJj1DNDyDbgmGQCS-&export=download&confirm=t' \
            --output /tmp/rpchess-fixed-sprites.zip
          echo 'efd88462efba01de2fb4b634b06c9564210ca31b98bfd048c46fdbf9d3f42618  /tmp/rpchess-fixed-sprites.zip' | sha256sum --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Trace the six corrected transparent PNGs to real SVG paths
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'vtracer==0.6.12' 'Pillow==11.3.0'
          python - <<'PY'
          import hashlib
          import io
          import pathlib
          import re
          import tempfile
          import zipfile
          from PIL import Image
          import vtracer

          archive = pathlib.Path('/tmp/rpchess-fixed-sprites.zip')
          targets = {
            'no-background (1).png': 'goblins/goblins_castle_128.svg',
            'no-background (2).png': 'fae/fae_event_128.svg',
            'no-background (3).png': 'fae/fae_skirmish_128.svg',
            'no-background (4).png': 'fae/fae_battle_128.svg',
            'no-background (5).png': 'animals/animals_castle_128.svg',
            'no-background (6).png': 'dragonborn/dragonborn_castle_128.svg',
          }
          originals = {
            'no-background (1).png':'b3a00fe609b364e2cc264cb3168fbde5b6a312a9219511b9fc26e75d4de0d7ac',
            'no-background (2).png':'62f486fac324373ca1ab92fa8d7833f29537795864c1ca8fb088e0b822b841d8',
            'no-background (3).png':'e2a593059789bf260cd4d415c7e949d4e18cd359a372dd850da0126a019eb585',
            'no-background (4).png':'9d8ccb3d014d80040d1e46d975bbd6ac9813a077a9cefbf22189f32689984cdb',
            'no-background (5).png':'c7e65d619633b898230d4d7fab5c669a6f940a88dd4d6e0ed95c77558577e436',
            'no-background (6).png':'18f4514eaabeec68508d84dac987385eb677aaf1a466584c3ea99c1bfc2ab1e6',
          }
          with zipfile.ZipFile(archive) as z:
            assert set(z.namelist()) == set(targets), 'Unexpected filenames in fixed sprite archive'
            for source, relative in targets.items():
              raw = z.read(source)
              assert hashlib.sha256(raw).hexdigest() == originals[source], source + ': checksum mismatch'
              with Image.open(io.BytesIO(raw)) as im:
                assert im.mode in ('RGBA','P'), (source,im.mode)
                image = im.convert('RGBA')
                w,h = image.size
                assert 50 <= w <= 256 and 50 <= h <= 256
                with tempfile.TemporaryDirectory() as tmp:
                  inp = pathlib.Path(tmp)/'input.png'
                  out = pathlib.Path(tmp)/'vector.svg'
                  image.save(inp)
                  vtracer.convert_image_to_svg_py(
                    str(inp),str(out),colormode='color',hierarchical='stacked',
                    mode='spline',filter_speckle=2,color_precision=6,
                    layer_difference=8,corner_threshold=60,length_threshold=4.0,
                    max_iterations=10,splice_threshold=45,path_precision=3)
                  raw_svg=out.read_text(encoding='utf-8')
              match=re.search(r'<svg\b[^>]*>([\s\S]*?)</svg>',raw_svg)
              assert match and '<path' in match.group(1), source + ': vector trace has no paths'
              # VTracer traces transparent RGB too. Explicitly mask by the
              # artist's real alpha channel so no dark background appears.
              alpha=image.getchannel('A')
              bins={64:[],128:[],192:[],255:[]}
              for y in range(h):
                x=0
                while x<w:
                  a=alpha.getpixel((x,y))
                  level=0 if a==0 else min(255,((a+63)//64)*64)
                  if level not in bins:
                    x+=1
                    continue
                  start=x
                  while x<w:
                    aa=alpha.getpixel((x,y))
                    nxt=0 if aa==0 else min(255,((aa+63)//64)*64)
                    if nxt!=level:break
                    x+=1
                  width=x-start
                  bins[level].append(f'M{start} {y}h{width}v1h-{width}z')
              mask=('<defs><mask id="corrected-alpha" maskUnits="userSpaceOnUse" '
                    f'maskContentUnits="userSpaceOnUse" x="0" y="0" width="{w}" height="{h}">')
              for level,runs in bins.items():
                if runs:
                  v=f'{level:02x}'
                  mask+=f'<path fill="#{v}{v}{v}" d="{"".join(runs)}"/>'
              mask+='</mask></defs>'
              # Preserve the full corrected drawing and a 6px safe margin.
              scale=min(116/w,116/h)
              dx=(128-w*scale)/2
              dy=(128-h*scale)/2
              svg=('<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" '
                   'viewBox="0 0 128 128" role="img" aria-label="Kingdom map artwork">'
                   f'<g transform="translate({dx:.4f} {dy:.4f}) scale({scale:.6f})">'
                   +mask+'<g mask="url(#corrected-alpha)">'+match.group(1)+'</g></g></svg>\n')
              destination=pathlib.Path('game/assets/kingdom-map')/relative
              assert destination.is_file(), 'Cannot replace missing predecessor '+str(destination)
              destination.write_text(svg,encoding='utf-8')
              print(f'{source} => {relative} ({w}x{h}, {len(svg)} SVG bytes, real paths)')
          PY
      - name: Commit only the six approved SVG replacements
        shell: bash
        run: |
          set -euo pipefail
          git add -- game/assets/kingdom-map/goblins/goblins_castle_128.svg \
            game/assets/kingdom-map/fae/fae_event_128.svg \
            game/assets/kingdom-map/fae/fae_skirmish_128.svg \
            game/assets/kingdom-map/fae/fae_battle_128.svg \
            game/assets/kingdom-map/animals/animals_castle_128.svg \
            game/assets/kingdom-map/dragonborn/dragonborn_castle_128.svg
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(assets): retrace six corrected Kingdom event sprites'
          git push origin HEAD:refs/heads/feature/infinite-kingdom-map-auto-encounters-20261108
