name: Visual QA Commander Selection

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual:
    if: ${{ github.head_ref == 'agent/approved-commander-selection-layout' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/approved-commander-selection-layout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and install Chromium
        run: |
          npm ci
          npm run build
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify approved commander composition
        run: |
          python -m http.server 4173 --directory dist >/tmp/rpchess-commander-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          mkdir -p visual-qa-commanders
          cat > commander-selection-visual-runner.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const context = await browser.newContext({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
          page.on('console', (message) => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
          page.on('response', (response) => { if (response.status() >= 400) errors.push(`http ${response.status()}: ${response.url()}`); });

          async function openCommanderSelection() {
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.click('[data-shell-action="profiles"]');
            await page.locator('[data-profile-action="start"]').first().click();
            await page.waitForSelector('.is-approved-commander-selection .rpa-commander-layout');
          }

          async function viewportShot(label, locator) {
            await locator.scrollIntoViewIfNeeded();
            await page.waitForTimeout(180);
            await page.screenshot({ path: `visual-qa-commanders/${label}.png`, fullPage: false });
          }

          async function audit(label, expectedColumns, previewMode) {
            await page.waitForTimeout(250);
            const result = await page.evaluate(() => {
              const screen = document.querySelector('.is-approved-commander-selection');
              const layout = screen?.querySelector('.rpa-commander-layout');
              const grid = screen?.querySelector('.rpa-commander-grid');
              const preview = screen?.querySelector('.rpa-launch');
              const portrait = preview?.querySelector('.rpa-launch__portrait');
              const profileButton = screen?.querySelector('[data-shell-action="profiles"]');
              const cards = [...(screen?.querySelectorAll('.rpa-commander') || [])];
              const rect = (element) => {
                const value = element?.getBoundingClientRect();
                return value ? { x: value.x, y: value.y, width: value.width, height: value.height, right: value.right, bottom: value.bottom } : null;
              };
              const cardRects = cards.map((card) => ({
                card: rect(card),
                art: rect(card.querySelector('.rpa-commander__art')),
                copy: rect(card.querySelector('.rpa-commander__copy'))
              }));
              const rows = [];
              for (const value of cardRects.map((item) => item.card.y)) {
                if (!rows.some((row) => Math.abs(row - value) <= 5)) rows.push(value);
              }
              const columns = Math.max(...rows.map((row) => cardRects.filter((item) => Math.abs(item.card.y - row) <= 5).length));
              const clipped = [...screen.querySelectorAll('h1,h2,h3,p,strong,small,span,button')]
                .filter((element) => element.scrollWidth > element.clientWidth + 3 || element.scrollHeight > element.clientHeight + 3)
                .map((element) => ({ text: element.textContent.trim().slice(0, 100), client: [element.clientWidth, element.clientHeight], scroll: [element.scrollWidth, element.scrollHeight] }));
              return {
                viewport: [innerWidth, innerHeight],
                documentWidth: document.documentElement.scrollWidth,
                layout: rect(layout),
                grid: rect(grid),
                preview: rect(preview),
                portrait: rect(portrait),
                cardRects,
                columns,
                profileLabel: profileButton?.textContent.trim() || '',
                seedFields: screen.querySelectorAll('[data-world-seed]').length,
                clipped,
                selected: screen.querySelector('[data-commander-id][aria-pressed="true"]')?.getAttribute('data-commander-id') || '',
                previewName: screen.querySelector('[data-preview-name]')?.textContent.trim() || ''
              };
            });
            fs.appendFileSync('visual-qa-commanders/report.txt', `${label}: ${JSON.stringify(result)}\n`);
            await page.screenshot({ path: `visual-qa-commanders/${label}-full.png`, fullPage: true });
            if (result.columns !== expectedColumns) throw new Error(`${label}: expected ${expectedColumns} columns, received ${result.columns}`);
            if (result.profileLabel !== 'Профили') throw new Error(`${label}: invalid profile label ${result.profileLabel}`);
            if (result.seedFields !== 0) throw new Error(`${label}: visible seed field remains`);
            if (result.documentWidth > result.viewport[0] + 3) throw new Error(`${label}: horizontal overflow ${result.documentWidth}/${result.viewport[0]}`);
            if (result.clipped.length) throw new Error(`${label}: clipped text ${JSON.stringify(result.clipped)}`);
            for (const item of result.cardRects) {
              if (item.art.x < item.card.x + 27 || item.copy.right > item.card.right - 27) throw new Error(`${label}: card content overlaps decorative frame ${JSON.stringify(item)}`);
              if (item.art.y < item.card.y + 25 || item.art.bottom > item.card.bottom - 25) throw new Error(`${label}: portrait overlaps decorative frame ${JSON.stringify(item)}`);
            }
            if (previewMode === 'side' && !(result.preview.width >= 425 && result.preview.width <= 480)) throw new Error(`${label}: preview width ${result.preview.width}`);
            if (result.portrait.x < result.preview.x + 28 || result.portrait.right > result.preview.right - 28) throw new Error(`${label}: preview portrait overlaps frame`);
            return result;
          }

          await openCommanderSelection();
          await audit('01-desktop', 2, 'side');
          await viewportShot('01-desktop-preview', page.locator('.rpa-launch'));

          await page.evaluate(() => localStorage.setItem('rpchess.approved-shell.progress.v1', JSON.stringify({
            unlockPoints: 7,
            victories: 0,
            discoveries: 7,
            milestones: {},
            lastProfileId: 'profile-1',
            lastCommanderId: 'warlord'
          })));
          await openCommanderSelection();
          const available = page.locator('[data-commander-id]:not([disabled])');
          if (await available.count() < 2) throw new Error('visual QA could not unlock a second commander');
          const before = (await page.locator('[data-preview-name]').textContent())?.trim();
          await available.nth(1).click();
          await page.waitForTimeout(120);
          const after = (await page.locator('[data-preview-name]').textContent())?.trim();
          if (!after || after === before) throw new Error(`one-click selection did not update preview: ${before}/${after}`);
          fs.appendFileSync('visual-qa-commanders/report.txt', `one-click: ${before} -> ${after}\n`);

          await page.setViewportSize({ width: 1000, height: 1000 });
          await audit('02-tablet', 2, 'stacked');
          await viewportShot('02-tablet-preview', page.locator('.rpa-launch'));

          await page.setViewportSize({ width: 390, height: 844 });
          await audit('03-mobile', 1, 'stacked');
          await viewportShot('03-mobile-second-card', page.locator('.rpa-commander').nth(1));
          await viewportShot('03-mobile-preview', page.locator('.rpa-launch'));

          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          JS
          node commander-selection-visual-runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commander-selection-visual-qa
          path: visual-qa-commanders
          retention-days: 2
