name: Export stage B source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.head_ref == 'agent/stage-b-events-ui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-b-events-ui
      - name: Archive repository source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf stage-b-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: stage-b-source
          path: stage-b-source.tar.gz
          retention-days: 1
