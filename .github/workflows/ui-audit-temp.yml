name: Temporary UI Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production dist
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture feature 3x10 UI matrix
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: ui-audit-capture.cjs
          RPCHESS_UI_AUDIT_DIR: ui-audit-feature
        run: npm run test:browser

      - name: Upload feature UI audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-feature-${{ github.event.pull_request.head.sha }}
          path: ui-audit-feature
          if-no-files-found: error
          retention-days: 1

  capture-main-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout accepted main baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Inject audit harness only
        run: |
          git fetch origin ${{ github.event.pull_request.head.sha }} --depth=1
          git show FETCH_HEAD:tests/ui-audit-capture.cjs > tests/ui-audit-capture.cjs
          git show FETCH_HEAD:scripts/run-browser-tests.cjs > scripts/run-browser-tests.cjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build accepted main dist
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture main 3x10 UI matrix
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: ui-audit-capture.cjs
          RPCHESS_UI_AUDIT_DIR: ui-audit-main
        run: npm run test:browser

      - name: Upload main UI audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-main-${{ github.event.pull_request.base.sha }}
          path: ui-audit-main
          if-no-files-found: error
          retention-days: 1
