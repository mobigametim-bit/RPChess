name: Race SVG glyphs and unlocked Arena preview

on:
  push:
    branches:
      - feature/race-glyphs-arena-unlock-20261026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpchess-race-glyphs-preview
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore transformed asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install and validate
        run: |
          npm ci --no-audit --no-fund
          npm run gate:local
      - name: Publish isolated Cloudflare Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config race-glyphs-preview/wrangler.toml
      - name: Verify published preview
        run: |
          set -euo pipefail
          base='https://rpchess-race-glyphs-preview.mobigametim.workers.dev'
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 20 "$base/" -o /tmp/simple-pieces.html &&
              grep -q 'data-simple-pieces' /tmp/simple-pieces.html &&
              curl -fsS --max-time 20 "$base/css/simplified-pieces.css" -o /tmp/simple-pieces.css &&
              grep -q 'rpchess-race-glyph' /tmp/simple-pieces.css &&\
              curl -fsS --max-time 20 "$base/js/race-glyphs.mjs" -o /tmp/race-glyphs.mjs &&\
              grep -q 'dragonkin' /tmp/race-glyphs.mjs; then
              echo "Race SVG preview: $base/?arenaPreviewAll=1"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Simplified chess glyph browser acceptance
        run: RPCHESS_BROWSER_TEST=simplified-pieces-browser.cjs npm run test:browser
