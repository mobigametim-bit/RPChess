name: Test Register 04 download

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.head_ref == 'agent/stage-b-events-ui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0
          gdown --id 1OC1EQXsTzvzWrH1qLT6yoSeXySbnJAs0 -O /tmp/ship.png
          test -s /tmp/ship.png
          file /tmp/ship.png
