name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply Event owner candidate
        run: |
          node --check scripts/audit-event-owner-fix.cjs
          node --check scripts/audit-narrow-event-browser.cjs
          node scripts/audit-event-owner-fix.cjs
      - name: Run Event owner regression
        run: |
          node --check tests/events.cjs
          node tests/events.cjs
      - name: Run canonical local gate
        run: npm run gate:local
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Narrow responsive proof to Event rail
        run: |
          cp tests/responsive-viewport-browser.cjs /tmp/responsive-viewport-browser.cjs
          node scripts/audit-narrow-event-browser.cjs
      - name: Run targeted Event browser proof
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser
      - name: Restore full responsive contract
        if: always()
        run: |
          if [ -f /tmp/responsive-viewport-browser.cjs ]; then cp /tmp/responsive-viewport-browser.cjs tests/responsive-viewport-browser.cjs; fi
      - name: Commit validated Event owner fix
        id: source_commit
        if: success()
        run: |
          git config user.name "mobigametim-bit"
          git config user.email "mobigametim@gmail.com"
          git add game/css/landscape-ui-redesign.css tests/events.cjs
          git diff --cached --check
          git commit -m "fix: restore scoped Event landscape layout"
          SOURCE_HEAD=$(git rev-parse HEAD)
          git push origin HEAD:audit/full-project-review-2026-09-08
          echo "source_head=$SOURCE_HEAD" >> "$GITHUB_OUTPUT"
      - name: Record completed Event iteration
        if: steps.source_commit.outcome == 'success'
        env:
          SOURCE_HEAD: ${{ steps.source_commit.outputs.source_head }}
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('docs/FULL_PROJECT_REVIEW_REPORT.md')
          text=p.read_text()
          source=os.environ['SOURCE_HEAD']
          text=re.sub(r"(\*\*Current remediation code head:\*\* `)[^`]+(`)",rf"\g<1>{source}\2",text,count=1)
          marker=f"### Responsive owner checkpoint — {source[:8]}"
          if marker not in text:
              lines=["",marker,"",f"- `e42b5ad834defe31e9cd7a5f4d34e147aaa8ccdd` removed the remaining runtime landscape CSS injection, moved compact-combat ownership into `landscape-ui-redesign.css`, and passed `gate:local` plus targeted `1024×768 RU` combat geometry.",f"- `{source}` restores the accepted owner-scoped `body.events-active` Event landscape contract in the static stylesheet after runtime-style removal.","- Existing `events.cjs` now prevents scoped Event choice rails from returning to two columns.","- Exact-checkout `gate:local`: **PASS**.","- Targeted Event Chromium (`1024×768 RU`, `844×390 RU`): **PASS**.","- Full responsive/all-Chromium validation continues after this checkpoint; no full-browser PASS is claimed here.","- `main`, Pages deployment policy and Cloudflare remain untouched.","","**Дальнейшие действия:**","1. Run the complete strengthened RU/EN/boundary responsive matrix on this implementation lineage.","2. If it is green, run all Chromium contracts on the same code; otherwise fix only the next evidence-backed owner defect.","3. Normalize `package-lock.json` reproducibly through npm and prove `npm ci` plus dependency security.","4. Finish evidence-backed asset inventory and keep ambiguous/planned assets.","5. Remove temporary audit helpers/workflows, then finalize `CURRENT_STATE.md` and historical/deployment documentation.",""]
              text+="\n".join(lines)
          p.write_text(text)
          PY
          git add docs/FULL_PROJECT_REVIEW_REPORT.md
          git diff --cached --check
          git commit -m "docs: checkpoint Event landscape owner fix"
          git push origin HEAD:audit/full-project-review-2026-09-08
      - name: Run full responsive contract
        if: success()
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser
      - name: Run all Chromium contracts
        if: success()
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
      - name: Record full browser PASS
        if: success()
        env:
          SOURCE_HEAD: ${{ steps.source_commit.outputs.source_head }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('docs/FULL_PROJECT_REVIEW_REPORT.md')
          text=p.read_text()
          source=os.environ['SOURCE_HEAD']
          marker=f"### Full browser verification — {source[:8]}"
          if marker not in text:
              lines=["",marker,"","- Complete strengthened responsive RU/EN/boundary contract: **PASS**.",f"- Complete Chromium browser contract set: **PASS** on implementation lineage `{source}`.","- Browser-verification-pending findings may now be closed only where this full gate covers their contract.","","**Дальнейшие действия:**","1. Normalize stale lock metadata through npm and rerun dependency-security plus `gate:local`.","2. Finish evidence-backed asset inventory/removal and rerun final local/browser gates if production files change.","3. Remove temporary audit helpers/workflows.","4. Update `CURRENT_STATE.md`, final audit statuses and historical/deployment docs.","5. Keep `main` frozen and Cloudflare manual-only until explicit owner direction.",""]
              text+="\n".join(lines)
          p.write_text(text)
          PY
          git add docs/FULL_PROJECT_REVIEW_REPORT.md
          git diff --cached --check
          git commit -m "docs: record full Chromium verification"
          git push origin HEAD:audit/full-project-review-2026-09-08
