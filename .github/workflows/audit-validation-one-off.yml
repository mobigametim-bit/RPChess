name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Align Power semantic ownership regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/player-rating.cjs')
          text = path.read_text()
          old = "  const travelSource=fs.readFileSync(path.join(game,'js/travel-choice-app.mjs'),'utf8');\n  const settleToken='globalThis.RPChessPower?.settle?.(activeRun)';\n  const clearToken='activeRun=writeRun({...activeRun,activeTravelChoice:null})';\n  assert(travelSource.includes(settleToken),'Travel lifecycle must explicitly settle Power before clearing a completed combat route');\n  assert(travelSource.indexOf(settleToken)<travelSource.indexOf(clearToken),'Power settlement must happen before activeTravelChoice cleanup');"
          new = "  const travelSource=fs.readFileSync(path.join(game,'js/travel-choice-app.mjs'),'utf8');\n  const ratingRuntimeSource=fs.readFileSync(path.join(game,'js/player-rating-runtime.mjs'),'utf8');\n  const settleToken='globalThis.RPChessPower?.settle?.(activeRun)';\n  assert(!travelSource.includes(settleToken),'Travel must not duplicate Power settlement owned by the semantic Power runtime');\n  assert(ratingRuntimeSource.includes(\"addEventListener('rpchess:combat-completed', sync)\")&&ratingRuntimeSource.includes(\"addEventListener('rpchess:puzzle-resolved', sync)\"),'Power runtime must settle rated outcomes from semantic completion events');\n  assert(ratingRuntimeSource.includes('settleCurrentRatedOutcome(run);'),'Power semantic owner must settle the current rated outcome before result rendering');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Travel-owned Power assertion block, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run targeted Power contract
        run: node tests/player-rating.cjs

      - name: Commit validated Power regression fix
        run: |
          git config user.name 'mobigametim-bit'
          git config user.email 'mobigametim@gmail.com'
          git add tests/player-rating.cjs
          git commit -m 'test: align Power semantic ownership contract'
          git push origin HEAD:audit/full-project-review-2026-09-08

      - name: Run canonical local gate
        run: npm run gate:local

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run all Chromium contracts
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
