name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply compact combat owner fix
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          js_path=Path('game/js/landscape-ui-redesign.mjs')
          js=js_path.read_text()
          js=js.replace("\nconst BOARD_EDGE_STYLE_MARKER = 'data-landscape-board-edge-style';",'',1)
          js,count=re.subn(r"\nfunction ensureBoardEdgeStyle\(\) \{[\s\S]*?\n\}\n\n(?=function ensureOrientationLock\(\))",'\n',js,count=1)
          if count!=1:
              raise SystemExit(f'expected one ensureBoardEdgeStyle block, got {count}')
          if js.count('ensureBoardEdgeStyle();')!=1:
              raise SystemExit('expected one ensureBoardEdgeStyle call')
          js=js.replace('ensureBoardEdgeStyle();\n','',1)
          for token in ['BOARD_EDGE_STYLE_MARKER','data-landscape-board-edge-style','style.textContent']:
              if token in js:
                  raise SystemExit(f'landscape runtime CSS residue remains: {token}')
          js_path.write_text(js)

          css_path=Path('game/css/landscape-ui-redesign.css')
          css=css_path.read_text()
          owner="""  /* Compact combat owns a zero-padding viewport and a physical rail/board separation. */
          html[data-landscape-ui='1'] body.compact-combat-active .classic-screen {
            padding: 0 !important;
          }
          html[data-landscape-ui='1'] body.compact-combat-active .classic-shell {
            width: 100vw !important;
            max-width: none !important;
            height: 100dvh !important;
            margin: 0 !important;
            display: grid !important;
            grid-template-columns: calc(100vw - 100dvh - 4px) 100dvh !important;
            grid-template-rows: auto minmax(0, 1fr) minmax(86px, .42fr) !important;
            column-gap: 4px !important;
            row-gap: 0 !important;
            align-items: stretch !important;
          }
          """
          if owner not in css:
              pattern=re.compile(r"(  \.classic-shell \{[\s\S]*?\n  \}\n)(?=  \.classic-topbar)")
              css,count=pattern.subn(lambda match: match.group(1)+owner,css,count=1)
              if count!=1:
                  raise SystemExit(f'expected one canonical classic-shell landscape block, got {count}')
          css_path.write_text(css)

          test_path=Path('tests/ui-redesign-final.cjs')
          test=test_path.read_text()
          declaration="  const finalCss=read('game/css/ui-redesign-final.css');\n"
          if "const landscapeUi=read('game/js/landscape-ui-redesign.mjs')" not in test:
              if declaration not in test:
                  raise SystemExit('UI regression declaration anchor missing')
              test=test.replace(declaration,declaration+"  const landscapeUi=read('game/js/landscape-ui-redesign.mjs');\n  const landscapeCss=read('game/css/landscape-ui-redesign.css');\n",1)
          anchor="  assert(!finalUi.includes('MutationObserver')&&!finalUi.includes('LIVE_OVERRIDE_CSS'),'final redesign module must not rely on global observers or live injected CSS');\n"
          assertion=(
              "  assert(!landscapeUi.includes('BOARD_EDGE_STYLE_MARKER')&&!landscapeUi.includes('data-landscape-board-edge-style')&&!landscapeUi.includes('style.textContent'), 'landscape presentation must be stylesheet-owned and must not inject runtime CSS');\n"
              "  assert(landscapeCss.includes(\"html[data-landscape-ui='1'] body.compact-combat-active .classic-screen\")&&landscapeCss.includes(\"html[data-landscape-ui='1'] body.compact-combat-active .classic-shell\")&&landscapeCss.includes('grid-template-columns: calc(100vw - 100dvh - 4px) 100dvh !important')&&landscapeCss.includes('column-gap: 4px !important'), 'compact combat owner must remove outer padding and keep a physical information-rail gap before the 100dvh board');\n"
          )
          if assertion.strip() not in test:
              if anchor not in test:
                  raise SystemExit('UI regression assertion anchor missing')
              test=test.replace(anchor,anchor+assertion,1)
          test_path.write_text(test)
          PY
      - name: Run owner regression
        run: node tests/ui-redesign-final.cjs
      - name: Run canonical local gate
        run: npm run gate:local
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Narrow responsive proof to 1024x768 RU combat
        run: |
          cp tests/responsive-viewport-browser.cjs /tmp/responsive-viewport-browser.cjs
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/responsive-viewport-browser.cjs')
          t=p.read_text()
          marker='\n(async () => {'
          pos=t.rfind(marker)
          if pos<0:
              raise SystemExit('responsive runner marker missing')
          suffix=(
              "\n(async () => {\n"
              "  const browser = await chromium.launch({ headless: true });\n"
              "  try {\n"
              "    await auditPrepAndCombat(browser, 1024, 768, 'ru');\n"
              "    console.log('Targeted 1024x768 RU combat geometry: PASS');\n"
              "  } finally { await browser.close(); }\n"
              "})().catch((error) => { console.error(error.stack || error); process.exitCode = 1; });\n"
          )
          p.write_text(t[:pos]+suffix)
          PY
      - name: Run targeted combat browser proof
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser
      - name: Restore full responsive contract
        if: always()
        run: |
          if [ -f /tmp/responsive-viewport-browser.cjs ]; then
            cp /tmp/responsive-viewport-browser.cjs tests/responsive-viewport-browser.cjs
          fi
      - name: Commit validated owner fix
        if: success()
        run: |
          git config user.name "mobigametim-bit"
          git config user.email "mobigametim@gmail.com"
          git add game/js/landscape-ui-redesign.mjs game/css/landscape-ui-redesign.css tests/ui-redesign-final.cjs
          git diff --cached --check
          git commit -m "fix: own compact combat rail geometry"
          git push origin HEAD:audit/full-project-review-2026-09-08
      - name: Run full responsive contract
        if: success()
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser
      - name: Run all Chromium contracts
        if: success()
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
