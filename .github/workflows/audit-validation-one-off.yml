name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply Event landscape owner fix
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          css_path=Path('game/css/landscape-ui-redesign.css')
          css=css_path.read_text()
          tablet_old="  .events-choices { min-height: 0 !important; grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 7px !important; }"
          tablet_new="  .events-choices { min-height: 0 !important; grid-template-columns: minmax(0, 1fr) !important; grid-auto-flow: row !important; gap: 7px !important; align-content: start !important; }"
          phone_old="  .events-choices { grid-template-columns: repeat(2,minmax(0,1fr)) !important; gap: 5px !important; align-content: start !important; }"
          phone_new="  .events-choices { grid-template-columns: minmax(0,1fr) !important; grid-auto-flow: row !important; gap: 5px !important; align-content: start !important; }"
          if css.count(tablet_old)!=1:
              raise SystemExit(f'expected one tablet two-column Event rule, got {css.count(tablet_old)}')
          if css.count(phone_old)!=1:
              raise SystemExit(f'expected one phone two-column Event rule, got {css.count(phone_old)}')
          css=css.replace(tablet_old,tablet_new,1).replace(phone_old,phone_new,1)
          tablet_choice="  .events-choice { min-height: 0 !important; padding: 10px !important; }"
          tablet_choice_new=(
              "  .events-choice,\n"
              "  .events-choice:last-child:nth-child(odd) { grid-column: auto !important; min-width: 0 !important; min-height: 0 !important; height: auto !important; padding: 10px !important; }"
          )
          if css.count(tablet_choice)!=1:
              raise SystemExit(f'expected one tablet Event choice rule, got {css.count(tablet_choice)}')
          css=css.replace(tablet_choice,tablet_choice_new,1)
          phone_choice="  .events-choice { padding: 7px !important; font-size: 9px !important; }"
          phone_choice_new="  .events-choice,\n  .events-choice:last-child:nth-child(odd) { grid-column: auto !important; min-width: 0 !important; min-height: 0 !important; height: auto !important; padding: 7px !important; font-size: 9px !important; }"
          if css.count(phone_choice)!=1:
              raise SystemExit(f'expected one phone Event choice rule, got {css.count(phone_choice)}')
          css=css.replace(phone_choice,phone_choice_new,1)
          css_path.write_text(css)

          test_path=Path('tests/events.cjs')
          test=test_path.read_text()
          declaration="  const appSource=fs.readFileSync(path.join(game,'js/events-app.mjs'),'utf8');\n"
          if "const landscapeCss=fs.readFileSync(path.join(game,'css/landscape-ui-redesign.css'),'utf8');" not in test:
              if declaration not in test:
                  raise SystemExit('Events regression declaration anchor missing')
              test=test.replace(declaration,declaration+"  const landscapeCss=fs.readFileSync(path.join(game,'css/landscape-ui-redesign.css'),'utf8');\n",1)
          anchor="  assert(!appSource.includes(\"addEventListener('rpchess:run-updated',syncRun)\"),'Events must not subscribe to broad run-updated for combat completion');\n"
          assertion=(
              "  const eventChoiceLandscapeBlocks=[...landscapeCss.matchAll(/\\.events-choices\\s*\\{([^}]*)\\}/g)].map(match=>match[1]);\n"
              "  assert(eventChoiceLandscapeBlocks.length>=2,'landscape owner must define tablet and phone Event choice rails');\n"
              "  assert(eventChoiceLandscapeBlocks.every(block=>!block.includes('repeat(2'))),'Event landscape choice rails must never return to two columns');\n"
              "  assert(eventChoiceLandscapeBlocks.filter(block=>block.includes('grid-template-columns: minmax(0')).length>=2,'tablet and phone Event landscape rails must both be one readable column');\n"
          )
          if assertion.strip() not in test:
              if anchor not in test:
                  raise SystemExit('Events regression assertion anchor missing')
              test=test.replace(anchor,anchor+assertion,1)
          test_path.write_text(test)
          PY
      - name: Run Event owner regression
        run: node tests/events.cjs
      - name: Run canonical local gate
        run: npm run gate:local
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Narrow responsive proof to Event rail
        run: |
          cp tests/responsive-viewport-browser.cjs /tmp/responsive-viewport-browser.cjs
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/responsive-viewport-browser.cjs')
          t=p.read_text()
          marker='\n(async () => {'
          pos=t.rfind(marker)
          if pos<0:
              raise SystemExit('responsive runner marker missing')
          suffix=(
              "\n(async () => {\n"
              "  const browser = await chromium.launch({ headless: true });\n"
              "  try {\n"
              "    await auditEventLayout(browser, 1024, 768, 'ru');\n"
              "    await auditEventLayout(browser, 844, 390, 'ru');\n"
              "    console.log('Targeted RU Event landscape rail geometry: PASS');\n"
              "  } finally { await browser.close(); }\n"
              "})().catch((error) => { console.error(error.stack || error); process.exitCode = 1; });\n"
          )
          p.write_text(t[:pos]+suffix)
          PY
      - name: Run targeted Event browser proof
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser
      - name: Restore full responsive contract
        if: always()
        run: |
          if [ -f /tmp/responsive-viewport-browser.cjs ]; then
            cp /tmp/responsive-viewport-browser.cjs tests/responsive-viewport-browser.cjs
          fi
      - name: Commit validated Event owner fix
        id: commit_source
        if: success()
        run: |
          git config user.name "mobigametim-bit"
          git config user.email "mobigametim@gmail.com"
          git add game/css/landscape-ui-redesign.css tests/events.cjs
          git diff --cached --check
          git commit -m "fix: restore one-column Event landscape rail"
          git push origin HEAD:audit/full-project-review-2026-09-08
          echo "source_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run full responsive contract
        id: full_responsive
        if: steps.commit_source.outcome == 'success'
        continue-on-error: true
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee /tmp/full-responsive.log
      - name: Run all Chromium contracts
        id: all_chromium
        if: steps.full_responsive.outcome == 'success'
        continue-on-error: true
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee /tmp/all-chromium.log
      - name: Record remediation checkpoint
        if: always() && steps.commit_source.outcome == 'success'
        env:
          SOURCE_HEAD: ${{ steps.commit_source.outputs.source_head }}
          RESPONSIVE_OUTCOME: ${{ steps.full_responsive.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.all_chromium.outcome }}
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('docs/FULL_PROJECT_REVIEW_REPORT.md')
          text=p.read_text()
          source=os.environ['SOURCE_HEAD']
          responsive=os.environ.get('RESPONSIVE_OUTCOME','skipped')
          chromium=os.environ.get('CHROMIUM_OUTCOME','skipped')
          text=re.sub(r"(\*\*Current remediation code head:\*\* `)[^`]+(`)",rf"\g<1>{source}\2",text,count=1)
          failure='none'
          log=Path('/tmp/full-responsive.log')
          if log.exists():
              lines=log.read_text(errors='replace').splitlines()
              hits=[line.strip() for line in lines if 'AssertionError' in line or 'Error:' in line and 'failed with exit' not in line]
              if hits: failure=hits[-1]
          marker=f"### Remediation checkpoint — {source[:8]}"
          if marker not in text:
              block=f"""

{marker}

- `e42b5ad834defe31e9cd7a5f4d34e147aaa8ccdd` removed the remaining `landscape-ui-redesign.mjs` runtime CSS injection, moved compact-combat viewport ownership into `landscape-ui-redesign.css`, and passed `gate:local` plus targeted `1024x768 RU` combat geometry.
- `{source}` restores the accepted one-column Event choice rail in the static landscape owner for tablet and phone landscape, with the existing `events.cjs` regression preventing a return to `repeat(2, ...)`.
- Targeted Event proof: `1024x768 RU` + `844x390 RU` PASS.
- Full responsive outcome after the Event fix: **{responsive.upper()}**.
- Full all-Chromium outcome: **{chromium.upper()}**.
- Latest responsive failure, if any: `{failure}`.
- No assertion was weakened; `main`, Pages deployment policy and Cloudflare remain untouched.

**Дальнейшие действия:**
1. If full responsive is not green, fix the next reported owner-geometry defect and rerun the same matrix.
2. Once responsive is green, require the complete Chromium set to pass on the same implementation lineage.
3. Normalize stale `package-lock.json` metadata through npm only, then prove `npm ci`, dependency-security and `gate:local`.
4. Finish the residual asset inventory and delete only evidence-backed orphans.
5. Remove this one-off audit workflow after validation no longer needs it.
"""
              text+=block
          p.write_text(text)
          PY
          git config user.name "mobigametim-bit"
          git config user.email "mobigametim@gmail.com"
          git add docs/FULL_PROJECT_REVIEW_REPORT.md
          git diff --cached --check
          git commit -m "docs: checkpoint Event landscape remediation"
          git push origin HEAD:audit/full-project-review-2026-09-08
      - name: Fail if browser validation is incomplete
        if: always() && steps.commit_source.outcome == 'success'
        env:
          RESPONSIVE_OUTCOME: ${{ steps.full_responsive.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.all_chromium.outcome }}
        run: |
          test "$RESPONSIVE_OUTCOME" = "success"
          test "$CHROMIUM_OUTCOME" = "success"
