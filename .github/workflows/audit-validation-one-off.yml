name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply candidate grid separation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game/css/landscape-ui-redesign.css')
          t=p.read_text()
          old="    grid-template-columns: calc(100vw - 100dvh) 100dvh !important;\n    grid-template-rows: auto minmax(0, 1fr) minmax(86px, .42fr) !important;\n    gap: 0 !important;"
          new="    grid-template-columns: calc(100vw - 100dvh - 4px) 100dvh !important;\n    grid-template-rows: auto minmax(0, 1fr) minmax(86px, .42fr) !important;\n    gap: 0 4px !important;"
          if t.count(old)!=1:
              raise SystemExit(f'expected one Classic grid contract, got {t.count(old)}')
          p.write_text(t.replace(old,new,1))
          PY

      - name: Build production dist
        run: npm run puzzles:materialize && npm run build:materialized

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Narrow test and instrument combat geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/responsive-viewport-browser.cjs')
          t=p.read_text()
          assertion="    assert(combatPanel.gap >= 4, `${label}: combat information panel must not touch the board`);"
          diagnostic=(
              "    console.log('COMBAT_DIAG', JSON.stringify(await page.evaluate(() => {\n"
              "      const shell=document.querySelector('.classic-shell');\n"
              "      const party=document.querySelector('.classic-party-panel');\n"
              "      const main=document.querySelector('.classic-main');\n"
              "      const board=document.querySelector('[data-chess-board]');\n"
              "      const rect=(node)=>{const r=node?.getBoundingClientRect();return r?{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}:null};\n"
              "      const style=(node)=>node?getComputedStyle(node):null;\n"
              "      const ss=style(shell),ps=style(party),ms=style(main),bs=style(board);\n"
              "      return {shell:rect(shell),party:rect(party),main:rect(main),board:rect(board),shellGrid:ss?.gridTemplateColumns,shellGap:ss?.gap,shellColumnGap:ss?.columnGap,partyWidth:ps?.width,partyMarginRight:ps?.marginRight,partyTransform:ps?.transform,partyPosition:ps?.position,partyGridColumn:ps?.gridColumn,mainWidth:ms?.width,mainMarginLeft:ms?.marginLeft,boardWidth:bs?.width};\n"
              "    })));\n"
              + assertion
          )
          if assertion not in t:
              raise SystemExit('combat assertion missing')
          t=t.replace(assertion,diagnostic,1)
          marker='\n(async () => {'
          pos=t.rfind(marker)
          if pos<0:
              raise SystemExit('responsive runner marker missing')
          suffix=(
              "\n(async () => {\n"
              "  const browser = await chromium.launch({ headless: true });\n"
              "  try { await auditPrepAndCombat(browser, 1024, 768, 'ru'); }\n"
              "  finally { await browser.close(); }\n"
              "})().catch((error) => { console.error(error.stack || error); process.exitCode = 1; });\n"
          )
          p.write_text(t[:pos]+suffix)
          PY

      - name: Run diagnostic Chromium contract
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser
