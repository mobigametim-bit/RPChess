name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fix Chronicle short-landscape geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game/css/landscape-ui-redesign.css')
          t=p.read_text()
          old="  .reboot-menu-screen__main { padding: clamp(10px, 2vw, 24px) !important; }"
          new="  .reboot-menu-screen__main { min-height: 0 !important; padding: clamp(10px, 2vw, 24px) !important; }"
          if t.count(old)!=1:
              raise SystemExit(f'expected one landscape menu-main rule, got {t.count(old)}')
          p.write_text(t.replace(old,new,1))
          PY

      - name: Run canonical local gate
        run: npm run gate:local

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Narrow responsive proof to 844x390 RU menu and Chronicle
        run: |
          cp tests/responsive-viewport-browser.cjs /tmp/responsive-viewport-browser.cjs
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/responsive-viewport-browser.cjs')
          t=p.read_text()
          marker='\n(async () => {'
          pos=t.rfind(marker)
          if pos<0:
              raise SystemExit('responsive runner marker missing')
          suffix=(
              "\n(async () => {\n"
              "  const browser = await chromium.launch({ headless: true });\n"
              "  try {\n"
              "    await auditViewport(browser, 844, 390, 'ru');\n"
              "    console.log('Targeted 844x390 RU menu + Chronicle geometry: PASS');\n"
              "  } finally {\n"
              "    await browser.close();\n"
              "  }\n"
              "})().catch((error) => { console.error(error.stack || error); process.exitCode = 1; });\n"
          )
          p.write_text(t[:pos]+suffix)
          PY

      - name: Run targeted Chronicle browser proof
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser

      - name: Restore full responsive contract
        if: always()
        run: cp /tmp/responsive-viewport-browser.cjs tests/responsive-viewport-browser.cjs

      - name: Commit Chronicle fix and documentation checkpoint
        run: |
          git config user.name 'mobigametim-bit'
          git config user.email 'mobigametim@gmail.com'
          git add game/css/landscape-ui-redesign.css
          git commit -m 'fix: contain Chronicle in short landscape viewport'
          CODE_SHA=$(git rev-parse HEAD)
          export CODE_SHA
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('docs/FULL_PROJECT_REVIEW_REPORT.md')
          t=p.read_text()
          sha=os.environ['CODE_SHA']
          t=re.sub(r'\*\*Current remediation code head:\*\* `[^`]+`', f'**Current remediation code head:** `{sha}`', t, count=1)
          t=t.replace('The same strengthened suite progressed to a separate `844×390` RU Chronicle vertical escape, which remains the next geometry fix.', f'The same strengthened suite then exposed a separate `844×390` RU Chronicle vertical escape. Root cause was the inherited `min-height:560px` on the menu main column inside the fixed-height landscape grid; `{sha[:8]}` resets that owner min-height to zero. A targeted 844×390 RU menu + Chronicle browser proof passed before this commit.')
          t=t.replace('Full Chromium is **not yet PASS**: run `34371249143` progressed past the fixed menu and exposed the separate `844×390` RU Chronicle overflow.', f'Full Chromium is **not yet PASS**. Run `34371249143` progressed past the fixed menu and exposed the `844×390` RU Chronicle overflow; the targeted Chronicle proof passed for `{sha[:8]}`. Full responsive/all-browser verification remains pending after this checkpoint.')
          t=t.replace('1. Fix the evidence-backed `844×390` RU Chronicle viewport escape in the Chronicle/menu owner CSS and rerun the strengthened responsive contract.', '1. Rerun the full strengthened responsive RU/EN/boundary matrix after the validated Chronicle owner fix; address only the next evidence-backed geometry failure, if any.')
          t=t.replace('1. Fix the `844×390` RU Chronicle geometry defect exposed after the validated menu fix; rerun responsive RU/EN/boundary coverage.', '1. Run the full responsive RU/EN/boundary coverage after the targeted Chronicle PASS; fix only any next evidence-backed defect.')
          p.write_text(t)
          PY
          git add docs/FULL_PROJECT_REVIEW_REPORT.md
          git commit -m 'docs: record Chronicle viewport remediation milestone'
          git push origin HEAD:audit/full-project-review-2026-09-08

      - name: Run full responsive contract
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser

      - name: Run all Chromium contracts
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
