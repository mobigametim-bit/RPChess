name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply Event candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game/css/landscape-ui-redesign.css')
          t=p.read_text()
          replacements={
            "  .events-choices { min-height: 0 !important; grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 7px !important; }":"  .events-choices { min-height: 0 !important; grid-template-columns: minmax(0, 1fr) !important; grid-auto-flow: row !important; gap: 7px !important; align-content: start !important; }",
            "  .events-choices { grid-template-columns: repeat(2,minmax(0,1fr)) !important; gap: 5px !important; align-content: start !important; }":"  .events-choices { grid-template-columns: minmax(0,1fr) !important; grid-auto-flow: row !important; gap: 5px !important; align-content: start !important; }",
            "  .events-choice { min-height: 0 !important; padding: 10px !important; }":"  .events-choice,\n  .events-choice:last-child:nth-child(odd) { grid-column: auto !important; min-width: 0 !important; min-height: 0 !important; height: auto !important; padding: 10px !important; }",
            "  .events-choice { padding: 7px !important; font-size: 9px !important; }":"  .events-choice,\n  .events-choice:last-child:nth-child(odd) { grid-column: auto !important; min-width: 0 !important; min-height: 0 !important; height: auto !important; padding: 7px !important; font-size: 9px !important; }"
          }
          for old,new in replacements.items():
              if t.count(old)!=1: raise SystemExit(f'candidate anchor drift: {old[:60]} => {t.count(old)}')
              t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Build production dist
        run: npm run puzzles:materialize && npm run build:materialized
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Instrument Event grid
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/responsive-viewport-browser.cjs')
          t=p.read_text()
          assertion="    assert.strictEqual(layout.columns, 1, `${label}: Event choices must use one readable column in the right rail`);"
          diagnostic="""    console.log('EVENT_GRID_DIAG', JSON.stringify(await page.evaluate(() => {
      const choices=document.querySelector('.events-choices');
      const items=[...document.querySelectorAll('.events-choice')];
      const cs=getComputedStyle(choices);
      const rect=(node)=>{const r=node?.getBoundingClientRect();return r?{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}:null};
      const rules=[];
      const walk=(list,href,media=[])=>{for(const rule of Array.from(list||[])){if(rule.cssRules){const condition=rule.conditionText||rule.media?.mediaText||'';walk(rule.cssRules,href,condition?[...media,condition]:media);}else if(rule.selectorText&&(rule.selectorText.includes('.events-choices')||rule.selectorText.includes('.events-choice:last-child'))){let matches=false;try{matches=choices.matches(rule.selectorText)||items.some(item=>item.matches(rule.selectorText));}catch{};if(matches)rules.push({href,selector:rule.selectorText,media,cssText:rule.style.cssText});}}};
      for(const sheet of Array.from(document.styleSheets)){try{walk(sheet.cssRules,sheet.href||'INLINE');}catch(error){rules.push({href:sheet.href||'INLINE',error:String(error)});}}
      return {choices:rect(choices),template:cs.gridTemplateColumns,autoColumns:cs.gridAutoColumns,autoFlow:cs.gridAutoFlow,display:cs.display,items:items.map((item,index)=>{const s=getComputedStyle(item);return {index,rect:rect(item),column:s.gridColumn,columnStart:s.gridColumnStart,columnEnd:s.gridColumnEnd};}),rules,stylesheets:Array.from(document.styleSheets).map(sheet=>sheet.href||'INLINE')};
    }))));
"""+assertion
          if assertion not in t: raise SystemExit('Event column assertion missing')
          t=t.replace(assertion,diagnostic,1)
          marker='\n(async () => {'
          pos=t.rfind(marker)
          if pos<0: raise SystemExit('runner marker missing')
          suffix="\n(async () => {\n  const browser=await chromium.launch({headless:true});\n  try{await auditEventLayout(browser,1024,768,'ru');}finally{await browser.close();}\n})().catch((error)=>{console.error(error.stack||error);process.exitCode=1;});\n"
          p.write_text(t[:pos]+suffix)
          PY
      - name: Run Event grid diagnostic
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser
