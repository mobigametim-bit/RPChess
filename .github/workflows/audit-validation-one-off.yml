name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Align Event hero lock regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/ui-redesign-final.cjs')
          text = path.read_text()
          old = "  assert(events.includes(\"if (!hero) return { hero:null, name, state:'missing', locked:true, label:'🔒' }\"),'missing Event hero must show only the lock in the upper strip');"
          new = "  assert(events.includes(\"if (!hero) return { hero:null, name, state:'missing', locked:true }\")&&events.includes(\"if(heroState.state==='missing')return '🔒';\"),'missing Event hero must preserve semantic missing state and render only the lock in the upper strip');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Event missing-hero assertion, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run targeted UI contract
        run: node tests/ui-redesign-final.cjs

      - name: Commit validated UI regression fix
        run: |
          git config user.name 'mobigametim-bit'
          git config user.email 'mobigametim@gmail.com'
          git add tests/ui-redesign-final.cjs
          git commit -m 'test: align Event hero lock presentation contract'
          git push origin HEAD:audit/full-project-review-2026-09-08

      - name: Run canonical local gate
        run: npm run gate:local

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run all Chromium contracts
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
