name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Align Starvation localization regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/starvation.cjs')
          text = path.read_text()
          import_anchor = "  const persistence = await import(pathToFileURL(path.join(game, 'js/run-persistence.mjs')).href);"
          if "localization/ui.mjs')).href" not in text:
              text = text.replace(import_anchor, import_anchor + "\n  const { UI_MESSAGES } = await import(pathToFileURL(path.join(game, 'localization/ui.mjs')).href);", 1)
          old = "  assert(uiSource.includes(\"'travel.costStarvation': 'Стоимость пути:\") && uiSource.includes('starvation will trigger on travel.'), 'RU/EN Travel Starvation warning copy must live in the localization registry');"
          new = "  assert(UI_MESSAGES.ru['travel.costStarvation']?.includes('сработает голод') && UI_MESSAGES.en['travel.costStarvation']?.includes('starvation will trigger on travel.'), 'RU/EN Travel Starvation warning copy must live in the localization registry');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one formatting-sensitive Starvation localization assertion, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run targeted Starvation contract
        run: node tests/starvation.cjs

      - name: Commit validated Starvation regression fix
        run: |
          git config user.name 'mobigametim-bit'
          git config user.email 'mobigametim@gmail.com'
          git add tests/starvation.cjs
          git commit -m 'test: validate Starvation localization semantically'
          git push origin HEAD:audit/full-project-review-2026-09-08

      - name: Run canonical local gate
        run: npm run gate:local

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run all Chromium contracts
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
