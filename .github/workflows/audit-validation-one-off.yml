name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Align Roster localization regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/roster.cjs')
          text = path.read_text()
          old = "for(const key of ['roster.ariaLabel','roster.filter.all','roster.journey','roster.commandPoints','roster.cardAria'])assert(app.includes(`t('${key}'`)||app.includes(`t(\\`${key}`),`Roster owner must call t() for ${key}`);"
          new = "for(const key of ['roster.ariaLabel','roster.journey','roster.commandPoints','roster.cardAria'])assert(app.includes(`t('${key}'`)||app.includes(`t(\\`${key}`),`Roster owner must call t() for ${key}`);\n  assert(app.includes('t(`roster.filter.${filter}`)'),'Roster owner must derive filter labels from the keyed localization family');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Roster direct-key assertion, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run targeted Roster contract
        run: node tests/roster.cjs

      - name: Commit validated Roster regression fix
        run: |
          git config user.name 'mobigametim-bit'
          git config user.email 'mobigametim@gmail.com'
          git add tests/roster.cjs
          git commit -m 'test: align Roster filter localization contract'
          git push origin HEAD:audit/full-project-review-2026-09-08

      - name: Report asset reachability candidates
        run: npm run assets:orphans:report

      - name: Diagnose remaining generated asset candidates
        run: |
          grep -RInE 'generated_assets/(logo_main|ui_checkbox|ui_slider_knob|ui_chip|ui_button_danger|unit_boss_king_enemy|ui_button_secondary|unit_arcane_node_enemy|ui_slider_bg|ui_divider)\.png' game scripts tests package.json || true

      - name: Run canonical local gate
        run: npm run gate:local

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run all Chromium contracts
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
