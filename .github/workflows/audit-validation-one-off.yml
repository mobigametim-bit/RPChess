name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fix menu viewport geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('game/css/ui-redesign-first-three.css')
          text = path.read_text()
          old = "  min-height:min(780px,calc(100vh - 52px));"
          new = "  min-height:min(780px,calc(100dvh - clamp(36px,5.2vw,84px)));"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale menu height contract, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run canonical local gate
        run: npm run gate:local

      - name: Commit validated menu geometry fix
        run: |
          git config user.name 'mobigametim-bit'
          git config user.email 'mobigametim@gmail.com'
          git add game/css/ui-redesign-first-three.css
          git commit -m 'fix: keep main menu within viewport'
          git push origin HEAD:audit/full-project-review-2026-09-08

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run targeted responsive contract
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: responsive-viewport-browser.cjs
        run: npm run test:browser

      - name: Run all Chromium contracts
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
