name: One-off Audit Validation

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
    paths:
      - .github/workflows/audit-validation-one-off.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Align Events v5 hero lock regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/events-v5.cjs')
          text = path.read_text()
          old = "  assert(app.includes(\"state:'missing', locked:true, label:'🔒'\")&&app.includes('choice.heroLine'),'missing hero upper strip must stay lock-only while the hero line remains present');"
          new = "  assert(app.includes(\"state:'missing', locked:true\")&&app.includes(\"if(heroState.state==='missing')return '🔒';\")&&app.includes('choice.heroLine'),'missing hero upper strip must preserve semantic missing state, render lock-only and keep the hero line present');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Events v5 hero-lock assertion, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run targeted Events v5 contract
        run: node tests/events-v5.cjs

      - name: Commit validated Events v5 regression fix
        run: |
          git config user.name 'mobigametim-bit'
          git config user.email 'mobigametim@gmail.com'
          git add tests/events-v5.cjs
          git commit -m 'test: align Events v5 hero lock contract'
          git push origin HEAD:audit/full-project-review-2026-09-08

      - name: Run canonical local gate
        run: npm run gate:local

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run all Chromium contracts
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
