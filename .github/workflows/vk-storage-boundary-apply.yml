name: Complete VK storage boundary

on:
  push:
    branches:
      - platform/vk-premoderation-implementation
    paths:
      - .github/workflows/vk-storage-boundary-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/vk-premoderation-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Route remaining production persistence through platform.storage
        shell: python
        run: |
          from pathlib import Path

          p = Path('game/js/i18n.mjs')
          s = p.read_text(encoding='utf-8')
          anchor = "import { EVENT_EN_V5_NAMES } from '../localization/events/en-v5-names.mjs';\n"
          assert anchor in s
          s = s.replace(anchor, anchor + "import { platform } from './platform.mjs';\n", 1)
          old = "function storage() { try { return globalThis.localStorage || null; } catch { return null; } }"
          assert old in s
          s = s.replace(old, "function storage() { return platform.storage.sync(); }", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('game/js/chronicle-core.mjs')
          s = p.read_text(encoding='utf-8')
          anchor = "import { playerNameForRun } from './player-identity-core.mjs';\n"
          assert anchor in s
          s = s.replace(anchor, anchor + "import { platform } from './platform.mjs';\n", 1)
          old = """function resolveStorage(storage) {\n  if (storage) return storage;\n  if (typeof localStorage !== 'undefined') return localStorage;\n  return null;\n}\n"""
          assert old in s
          s = s.replace(old, """function resolveStorage(storage) {\n  if (storage) return storage;\n  return platform.storage.sync();\n}\n""", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('game/js/player-rating.mjs')
          s = p.read_text(encoding='utf-8')
          anchor = "import { clampStars, difficultyForStars } from './encounter-difficulty.mjs';\n"
          assert anchor in s
          s = s.replace(anchor, anchor + "import { platform } from './platform.mjs';\n", 1)
          old = """function resolveStorage(storage) {\n  if (storage) return storage;\n  if (typeof localStorage !== 'undefined') return localStorage;\n  return null;\n}\n"""
          assert old in s
          s = s.replace(old, """function resolveStorage(storage) {\n  if (storage) return storage;\n  return platform.storage.sync();\n}\n""", 1)
          p.write_text(s, encoding='utf-8')
      - name: Focused persistence regression
        run: |
          npm run test:foundation
          npm run test:localization
          npm run test:identity
          npm run test:power
          npm run test:lifecycle
          npm run build
      - name: Commit validated storage boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/js/i18n.mjs game/js/chronicle-core.mjs game/js/player-rating.mjs
          git rm .github/workflows/vk-storage-boundary-apply.yml
          git commit -m "platform: route persistent state through shared storage adapter"
          git push origin HEAD:platform/vk-premoderation-implementation
