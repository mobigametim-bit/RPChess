name: QA Parchment PNG-only release
on:
  push:
    branches:
      - feature/kingdom-roster-responsive-raster-20261111
    paths:
      - '.github/workflows/parchment-raster-preview.yml'
      - 'parchment-raster-preview/**'
      - 'tests/kingdom-map-browser.cjs'
      - 'tests/travel-choice.cjs'
      - 'scripts/prepare-parchment-raster.cjs'
      - 'scripts/build.cjs'
      - 'game/js/kingdom-parchment-app.mjs'
      - 'game/js/kingdom-parchment-core.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rpchess-parchment-png-release-20261111
  cancel-in-progress: true
jobs:
  png-release-qa:
    if: github.repository == 'mobigametim-bit/RPChess' && github.ref == 'refs/heads/feature/kingdom-roster-responsive-raster-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install and verify Stockfish engine
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm pack stockfish@18.0.0 --silent --pack-destination /tmp
          mkdir -p /tmp/rpchess-stockfish-package /tmp/rpchess-stockfish-verified
          tar -xzf /tmp/stockfish-18.0.0.tgz -C /tmp/rpchess-stockfish-package
          package=/tmp/rpchess-stockfish-package/package
          for name in stockfish-18-lite-single.js stockfish-18-lite-single.wasm; do
            source=$(find "$package" -type f -name "$name" -print -quit)
            test -n "$source"
            cp "$source" "/tmp/rpchess-stockfish-verified/$name"
          done
          license=$(find "$package" -type f -iname 'Copying.txt' -print -quit)
          test -n "$license"
          cp "$license" /tmp/rpchess-stockfish-verified/COPYING.txt
      - name: Run standard production build and local gate
        env:
          RPCHESS_INCLUDE_ATLAS_LAB: '1'
          RPCHESS_STOCKFISH_ASSET_DIR: /tmp/rpchess-stockfish-verified
        run: npm run gate:local
      - name: Verify all distributions contain PNG-only parchment
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs'),path=require('node:path');
          const root='dist/assets/kingdom-parchment';
          const groups=['parchment_base_variations','forest_clusters','mountain_clusters','hills_rocks','fog_of_war_shapes','marsh_wasteland_optional','decor_minor_landmarks'];
          let png=0,svg=0;
          for(const group of groups){
            const names=fs.readdirSync(path.join(root,group));
            png+=names.filter(x=>x.endsWith('.png')).length;
            svg+=names.filter(x=>x.endsWith('.svg')).length;
            assert.equal(names.filter(x=>x.endsWith('.png')).length,16,group);
          }
          assert.equal(png,112);
          assert.equal(svg,0);
          const manifest=JSON.parse(fs.readFileSync(path.join(root,'extra-manifest.json'),'utf8'));
          assert(Object.values(manifest.groups).every(names=>names.every(x=>x.endsWith('.png'))));
          assert(!fs.readFileSync('dist/index.html','utf8').includes('rpchess-parchment-raster'));
          console.log('Standard build ships 112 PNG / 0 SVG, no format flag.');
          NODE
          mkdir -p test-results/parchment-release-qa/png
          node scripts/build-size-report.cjs dist test-results/parchment-release-qa/png/size.json
          zip -qr /tmp/rpchess-png-rc.zip dist
          stat -c%s /tmp/rpchess-png-rc.zip > test-results/parchment-release-qa/png/zip-bytes.txt
      - name: Install Chromium for real-game and pixel-parity QA
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install chromium
      - name: Test Journey and capture PNG gameplay at 55/117/220 zoom
        env:
          RPCHESS_BROWSER_TEST: kingdom-map-browser.cjs
          RPCHESS_PARCHMENT_QA_SCREENSHOT_DIR: test-results/parchment-release-qa/png
          RPCHESS_KINGDOM_SCREENSHOT_DIR: test-results/parchment-release-qa/png/regression
        run: npm run test:browser
      - name: Verify source SVG versus 112 output PNGs at three sizes
        run: |
          node tests/parchment-raster-qa.cjs
          node tests/parchment-raster-pixels.cjs
      - name: Save PNG gameplay and pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parchment-png-production-qa
          path: |
            test-results/parchment-release-qa/
            test-results/parchment-raster-qa/report.json
            test-results/parchment-raster-qa/pixel-parity.json
          retention-days: 14
          if-no-files-found: warn
      - name: Deploy independent Cloudflare PNG preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          grep -Fx 'name = "rpchess-parchment-preview"' parchment-raster-preview/wrangler.toml
          npx wrangler deploy --config parchment-raster-preview/wrangler.toml
      - name: Smoke-test live PNG preview
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const base='https://rpchess-parchment-preview.mobigametim.workers.dev';
            for(let attempt=0;attempt<12;attempt++){
              try{
                const html=await (await fetch(base+'/?raster=191',{cache:'no-store'})).text();
                assert(!html.includes('rpchess-parchment-raster'));
                const asset=await fetch(base+'/assets/kingdom-parchment/forest_clusters/01_small_grove.png',{cache:'no-store'});
                assert.equal(asset.status,200);
                assert((asset.headers.get('content-type')||'').includes('image/png'));
                assert((await asset.arrayBuffer()).byteLength>100);
                console.log('PNG-only live game preview verified');
                return;
              }catch(e){
                if(attempt===11)throw e;
                await new Promise(resolve=>setTimeout(resolve,3000));
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
