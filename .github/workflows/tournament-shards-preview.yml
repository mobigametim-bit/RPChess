name: Tournament Elo shards — isolated synthetic QA
on:
  push:
    branches: [feature/tournament-elo-honor-shards-20261118]
    paths:
      - 'game/**'
      - 'tests/**'
      - 'tournament-shards-preview/**'
      - '.github/workflows/tournament-shards-preview.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpchess-tournament-shards-qa-preview
  cancel-in-progress: true

jobs:
  qa:
    if: github.repository == 'mobigametim-bit/RPChess' && github.ref == 'refs/heads/feature/tournament-elo-honor-shards-20261118'
    name: Verify and publish synthetic Tournament shard QA
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install dependencies and SHA-verified Stockfish 18
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm pack stockfish@18.0.0 --silent --pack-destination /tmp
          mkdir -p /tmp/rpchess-stockfish-package /tmp/rpchess-stockfish-verified
          tar -xzf /tmp/stockfish-18.0.0.tgz -C /tmp/rpchess-stockfish-package
          package=/tmp/rpchess-stockfish-package/package
          for name in stockfish-18-lite-single.js stockfish-18-lite-single.wasm; do
            source=$(find "$package" -type f -name "$name" -print -quit)
            test -n "$source"
            cp "$source" "/tmp/rpchess-stockfish-verified/$name"
          done
          license=$(find "$package" -type f -iname 'Copying.txt' -print -quit)
          test -n "$license"
          cp "$license" /tmp/rpchess-stockfish-verified/COPYING.txt
      - name: Canonical Node checks and production-equivalent build
        env:
          RPCHESS_STOCKFISH_ASSET_DIR: /tmp/rpchess-stockfish-verified
        run: npm run gate:local
      - name: Install pinned Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install chromium
      - name: Regression — Tournament layouts and interactions
        env:
          RPCHESS_BROWSER_TEST: tournament-v4-browser.cjs
          RPCHESS_GATE_PREFIX: /RPChess
        run: npm run test:browser
      - name: Add synthetic test-only Tournament demo to isolated dist
        run: |
          set -euo pipefail
          cp tournament-shards-preview/demo.js dist/tournament-shards-qa-demo.js
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const file='dist/index.html';
          let html=fs.readFileSync(file,'utf8');
          assert(html.includes('<head>')&&!html.includes('tournament-shards-qa-demo.js'));
          html=html.replace('<head>','<head>\n<script src="tournament-shards-qa-demo.js"></script>');
          fs.writeFileSync(file,html);
          assert(html.includes('tournament-shards-qa-demo.js'));
          console.log('Isolated QA-only demo injection complete; source game/ untouched');
          NODE
      - name: Deploy standalone Tournament QA game (no canonical Tournament Worker deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config tournament-shards-preview/wrangler.toml
      - name: Verify deployed QA build contains new economy modules
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const root='https://rpchess-tournament-shards-qa-preview.mobigametim.workers.dev';
          (async()=>{
            for(let attempt=0;attempt<12;attempt++){
              try{
                for(const [file,token] of [
                  ['/','tournament-shards-qa-demo.js'],
                  ['/tournament-shards-qa-demo.js','RPChessTournamentShardsQADemo'],
                  ['/js/tournament-app.mjs','settleTournamentShardAward'],
                  ['/js/arena-core.mjs','creditTournamentWin']]){
                    const response=await fetch(root+file,{cache:'no-store'});
                    assert.equal(response.status,200,file);
                    assert((await response.text()).includes(token),file+' is not PR #217 candidate');
                }
                console.log('Synthetic Tournament QA LIVE:',root);
                return;
              }catch(error){
                if(attempt===11)throw error;
                await new Promise(done=>setTimeout(done,3000));
              }
            }
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Real-click Chromium QA for rated +16 Elo and +16 shards, no duplicate or live API
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const base='https://rpchess-tournament-shards-qa-preview.mobigametim.workers.dev/';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:1280,height:800}});
              const failures=[];let liveRequests=0;
              page.on('request',request=>{
                if(request.url().startsWith('https://rpchess-tournament-profile-preview.mobigametim.workers.dev'))
                  liveRequests++;
              });
              page.on('pageerror',e=>failures.push(e.message));
              await page.goto(base+'?tournament_shards_qa=1&rpchess_profile=0&rpchess_gamepush=0&rpchess_api_route=direct',
                {waitUntil:'domcontentloaded',timeout:45000});
              await page.locator('[data-tournament-shards-qa-notice]').waitFor({timeout:30000});
              await page.locator('[data-game-loading]').waitFor({state:'hidden',timeout:35000});
              await page.locator('[data-tournament-open]').click({timeout:20000});
              await page.locator('[data-tour-action="search"]').click({timeout:20000});
              await page.waitForFunction(()=>
                document.querySelector('[data-tour-shards]')?.textContent?.includes('+16'),
                null,{timeout:30000});
              const stats=await page.evaluate(async()=>{
                const core=await import('./js/arena-core.mjs');
                const rating=await import('./js/player-rating.mjs');
                const raw=JSON.parse(localStorage.getItem(core.ARENA_KEY)||'null');
                const summary=core.arenaSummary(raw);
                return {balance:summary.balance,
                  credited:raw?.events?.filter(e=>e.kind==='tournament-win').length||0,
                  power:rating.readPlayerRating().power,
                  mock:globalThis.RPChessTournamentShardsQADemo};
              });
              assert.equal(stats.balance,16);
              assert.equal(stats.credited,1);
              assert.equal(stats.power,516);
              await page.locator('[data-tour-action="again"]').click({timeout:20000});
              await page.waitForFunction(()=>
                document.querySelector('[data-tour-shards]')?.textContent?.includes('+16'),
                null,{timeout:30000});
              const after=await page.evaluate(async()=>{
                const core=await import('./js/arena-core.mjs');
                const raw=JSON.parse(localStorage.getItem(core.ARENA_KEY)||'null');
                return {balance:core.arenaSummary(raw).balance,
                  count:raw?.events?.filter(e=>e.kind==='tournament-win').length||0,
                  joins:globalThis.RPChessTournamentShardsQADemo?.queueJoins};
              });
              assert.equal(after.balance,16,'replayed result must not duplicate shards');
              assert.equal(after.count,1);
              assert(after.joins>=2,'simulated match must actually replay');
              assert.equal(liveRequests,0,'no requests to canonical Tournament API');
              assert.deepEqual(failures,[],'browser page errors');
              console.log('TOURNAMENT SHARDS QA PASS: +16 Elo/+16 Honor Shards, one event on replay, zero canonical API calls');
            }finally{await browser.close();}
          })().catch(error=>{console.error(error.stack||error);process.exitCode=1});
          NODE
      - name: Archive QA debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-shards-qa-screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
