name: Apply reserve presentation

on:
  push:
    branches:
      - ui/reserve-presentation-v2
    paths:
      - .github/workflows/apply-reserve-presentation.yml
      - scripts/apply-reserve-presentation.cjs

permissions:
  contents: write

concurrency:
  group: apply-reserve-presentation
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reserve branch
        uses: actions/checkout@v4
        with:
          ref: ui/reserve-presentation-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply strict patch
        run: node scripts/apply-reserve-presentation.cjs

      - name: Run complete test suite
        run: npm test

      - name: Build production distribution
        run: npm run build

      - name: Commit reserve presentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime/presenter-bridge.cjs game/js/vertical-slice-presenter.mjs content/scenarios/iron_marches_vertical_slice.json tests/presenter-bridge.cjs tests/reserve-presenter-browser.cjs package.json game/js/generated/iron-marches-runtime.bundle.js
          git diff --cached --stat
          git commit -m 'Present reserve deployment and order points in browser combat'
          git push origin HEAD:ui/reserve-presentation-v2
