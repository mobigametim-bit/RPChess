name: Full Project Review Runtime Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical local gate
        run: npm run gate:local

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Audit all 36 Chromium suites and collect failures
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        shell: bash
        run: |
          set +e
          failed=0
          tests=(
            reboot-foundation-browser.cjs
            chronicle-localization-browser.cjs
            localization-ui-browser.cjs
            classic-chess-browser.cjs
            mentor-training-browser.cjs
            simplified-pieces-browser.cjs
            arena-browser.cjs
            piercing-vision-browser.cjs
            fork-master-browser.cjs
            race-board-themes-browser.cjs
            king-pin-ice-browser.cjs
            responsive-viewport-browser.cjs
            portrait-key-scenes-browser.cjs
            tournament-v4-browser.cjs
            onboarding-browser.cjs
            roster-browser.cjs
            cloud-continue-browser.cjs
            skirmish-browser.cjs
            skirmish-artifact-browser.cjs
            skirmish-mobile-browser.cjs
            battle-browser.cjs
            combat-resume-browser.cjs
            caravan-browser.cjs
            caravan-reward-viewport-browser.cjs
            combat-menu-browser.cjs
            combat-side-colors-browser.cjs
            combat-aura-move-sync-browser.cjs
            battle-animation-art-browser.cjs
            travel-choice-browser.cjs
            kingdom-map-browser.cjs
            resources-browser.cjs
            settlement-browser.cjs
            starvation-browser.cjs
            events-browser.cjs
            mobile-run-summary-browser.cjs
            puzzles-browser.cjs
          )
          for test in "${tests[@]}"; do
            echo "::group::AUDIT $test"
            RPCHESS_BROWSER_TEST="$test" npm run test:browser
            code=$?
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "AUDIT_RESULT PASS $test"
            else
              echo "AUDIT_RESULT FAIL $test exit=$code"
              failed=$((failed+1))
            fi
          done
          echo "AUDIT_TOTAL_FAILURES=$failed"
          exit "$failed"