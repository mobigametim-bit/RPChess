name: Full Project Review Runtime Gate

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical local gate
        run: npm run gate:local

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run every browser contract and collect all failures
        env:
          RPCHESS_GATE_PREFIX: /RPChess
        shell: bash
        run: |
          set +e
          failed=0
          tests=(
            classic-chess-browser.cjs
            settlement-browser.cjs
            puzzles-browser.cjs
          )
          for test in "${tests[@]}"; do
            echo "::group::AUDIT $test"
            RPCHESS_BROWSER_TEST="$test" npm run test:browser
            code=$?
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "AUDIT_RESULT PASS $test"
            else
              echo "AUDIT_RESULT FAIL $test exit=$code"
              failed=$((failed+1))
            fi
          done
          echo "AUDIT_TOTAL_FAILURES=$failed"
          exit "$failed"
