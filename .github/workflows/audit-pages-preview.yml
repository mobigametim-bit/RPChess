name: Temporary Audit Pages Preview

on:
  push:
    branches:
      - audit/full-project-review-2026-09-08

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: audit-pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download prepared combined Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: prepared
          run-id: 34464454037
          github-token: ${{ github.token }}

      - name: Restore prepared site tree
        shell: bash
        run: |
          mkdir -p site
          artifact=$(find prepared -type f -name 'artifact.tar' -print -quit)
          if [ -z "$artifact" ]; then
            artifact=$(find prepared -type f -name '*.tar' -print -quit)
          fi
          test -n "$artifact"
          tar -xf "$artifact" -C site
          test -f site/index.html
          test -f site/audit-preview/index.html
          test -f site/audit-preview/vendor/stockfish/stockfish-18-lite-single.js
          test -f site/audit-preview/vendor/stockfish/stockfish-18-lite-single.wasm

      - name: Upload prepared Pages artifact into retry run
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy combined production + audit preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print audit preview URL
        run: echo "https://mobigametim-bit.github.io/RPChess/audit-preview/"
