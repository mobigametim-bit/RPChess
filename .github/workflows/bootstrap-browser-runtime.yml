name: Bootstrap browser production runtime

on:
  push:
    branches:
      - runtime/browser-production-entry
    paths:
      - .github/workflows/bootstrap-browser-runtime.yml
      - package.json
      - package-lock.json
      - scripts/build-browser-runtime.cjs
      - scripts/build.cjs
      - src/browser/**
      - src/runtime/**
      - src/content/**
      - content/**
      - game/vertical-slice.html
      - game/js/vertical-slice-app.mjs
      - tests/browser-production-runtime.cjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-browser-runtime.yml
      - package.json
      - package-lock.json
      - scripts/build-browser-runtime.cjs
      - scripts/build.cjs
      - src/browser/**
      - src/runtime/**
      - src/content/**
      - content/**
      - game/vertical-slice.html
      - game/js/vertical-slice-app.mjs
      - tests/browser-production-runtime.cjs

permissions:
  contents: write

concurrency:
  group: bootstrap-browser-production-runtime
  cancel-in-progress: true

jobs:
  bundle-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out browser runtime branch
        uses: actions/checkout@v4
        with:
          ref: runtime/browser-production-entry
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete test suite
        run: npm test

      - name: Build production distribution
        run: npm run build

      - name: Verify generated browser entry
        run: |
          test -s game/js/generated/iron-marches-runtime.bundle.js
          test -s dist/js/generated/iron-marches-runtime.bundle.js
          test -s dist/vertical-slice.html
          grep -q 'RPChessRuntime' game/js/generated/iron-marches-runtime.bundle.js
          grep -q 'createBrowserRunSelectionHost' game/js/generated/iron-marches-runtime.bundle.js

      - name: Commit lock and generated runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json game/js/generated/iron-marches-runtime.bundle.js
          if git diff --cached --quiet; then
            echo 'Browser runtime lock and bundle are already current.'
            exit 0
          fi
          git commit -m 'Generate locked production browser runtime bundle'
          git push origin HEAD:runtime/browser-production-entry
