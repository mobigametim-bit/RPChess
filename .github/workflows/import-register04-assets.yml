name: Import Register 04 remaining assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/register04-import-trigger'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: register-04-asset-import
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify one-time importer
        run: test -f scripts/import-register04-remaining.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and import with diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== Installing dependencies ==='
            python -m pip install --disable-pip-version-check pillow gdown
            echo '=== Running Register 04 importer ==='
            python scripts/import-register04-remaining.py
          } > /tmp/register04-import.log 2>&1
          status=$?
          cat /tmp/register04-import.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/register04-import.log .github/register04-import-failure.log
            git config user.name 'RPChess Asset Importer'
            git config user.email 'actions@users.noreply.github.com'
            git add .github/register04-import-failure.log
            if ! git diff --cached --quiet; then
              git commit -m 'Record Register 04 importer failure'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
            exit "$status"
          fi

      - name: Validate Register 04 resolver and assets
        run: node tests/register-04-event-assets.cjs

      - name: Build production browser distribution
        run: |
          npm ci
          npm run build

      - name: Commit imported assets and remove one-time machinery
        run: |
          rm -f .github/register04-import-failure.log scripts/import-register04-remaining.py .github/workflows/import-register04-assets.yml .github/register04-import-trigger
          git config user.name 'RPChess Asset Importer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- game/assets/events/register-04 content/manifests/register-04-events.json content/audits/register_04_event_assets.json game/js/register-04-event-assets.mjs tests/register-04-event-assets.cjs .github/register04-import-failure.log scripts/import-register04-remaining.py .github/workflows/import-register04-assets.yml .github/register04-import-trigger
          git commit -m 'Import and apply remaining Register 04 event art'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
