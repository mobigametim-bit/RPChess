name: Import Register 04 remaining assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/register04-import-trigger'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify one-time importer
        run: test -f scripts/import-register04-remaining.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check pillow gdown

      - name: Download, normalize and register remaining art
        run: python scripts/import-register04-remaining.py

      - name: Validate Register 04 resolver and assets
        run: node tests/register-04-event-assets.cjs

      - name: Build production browser distribution
        run: |
          npm ci
          npm run build

      - name: Commit imported assets safely
        run: |
          git config user.name 'RPChess Asset Importer'
          git config user.email 'actions@users.noreply.github.com'
          git add game/assets/events/register-04 content/manifests/register-04-events.json content/audits/register_04_event_assets.json game/js/register-04-event-assets.mjs tests/register-04-event-assets.cjs
          git commit -m 'Import and apply remaining Register 04 event art'
          git pull --rebase origin main
          git push origin HEAD:main
