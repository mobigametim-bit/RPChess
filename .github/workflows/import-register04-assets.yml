name: Import Register 04 remaining assets

on:
  pull_request_target:
    branches: [main]
    paths:
      - 'scripts/import-register04-remaining.py'
      - '.github/workflows/import-register04-assets.yml'

permissions:
  contents: write

concurrency:
  group: register-04-asset-import
  cancel-in-progress: true

jobs:
  import-assets:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/register04-assets'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out trusted asset branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check whether importer is still present
        id: guard
        shell: bash
        run: |
          if [[ -f scripts/import-register04-remaining.py ]]; then
            echo 'run_import=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_import=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.run_import == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        if: steps.guard.outputs.run_import == 'true'
        run: python -m pip install --disable-pip-version-check pillow gdown

      - name: Download, normalize and register remaining art
        if: steps.guard.outputs.run_import == 'true'
        run: python scripts/import-register04-remaining.py

      - name: Validate Register 04 resolver and assets
        if: steps.guard.outputs.run_import == 'true'
        run: node tests/register-04-event-assets.cjs

      - name: Commit imported assets and remove one-time importer
        if: steps.guard.outputs.run_import == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f scripts/import-register04-remaining.py .github/workflows/import-register04-assets.yml
          git config user.name 'RPChess Asset Importer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import and apply remaining Register 04 event art'
          git push origin "HEAD:${TARGET_BRANCH}"
