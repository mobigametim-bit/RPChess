name: Materialize Register 02 Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/apply-register-02-through-runtime
    paths:
      - .github/workflows/materialize-register-02-audit.yml
      - scripts/audit-register-02-assets.py
      - content/assets/register_02_assets.json

permissions:
  contents: write

concurrency:
  group: materialize-register-02-audit
  cancel-in-progress: true

jobs:
  audit-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-register-02-through-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image audit dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<12'
      - name: Build deterministic Register 02 audit report
        run: python scripts/audit-register-02-assets.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/assets/register_02_audit.json
          if git diff --cached --quiet; then
            echo 'Audit report is already current.'
            exit 0
          fi
          git commit -m 'Record Register 02 visual audit'
          git push origin HEAD:agent/apply-register-02-through-runtime
