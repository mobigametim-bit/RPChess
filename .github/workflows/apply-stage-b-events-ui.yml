name: Apply Stage B and Register 04

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stage-b-events-ui-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/stage-b-events-ui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-b-events-ui
          fetch-depth: 0
      - name: Detect completed package
        id: guard
        run: |
          if test -f src/runtime/stage-b-act.cjs && test -f game/assets/events/register-04/miners_on_strike.png; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.applied == 'false'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.applied == 'false'
        with:
          node-version: 22
          cache: npm
      - name: Download implementation package and Register 04 sources
        if: steps.guard.outputs.applied == 'false'
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0 pillow
          gdown --id 1zEdtsiHoZATW-39w7jZUNEKnZZhPES_5 -O /tmp/apply-stage-b-events-ui.py
          python -m py_compile /tmp/apply-stage-b-events-ui.py
          mkdir -p /tmp/register04
          while read -r id slug; do
            gdown --id "$id" -O "/tmp/register04/${slug}.png"
          done <<'FILES'
          1OC1EQXsTzvzWrH1qLT6yoSeXySbnJAs0 ship_of_empty_names
          16jz1qmCOS1o390iP9iAfjpomBiYDB2X3 votes_at_midnight
          1eXTK8u8Dm3YJ0vedvKNh35PCPvQOX2ZU counterfeit_hero
          1N3IJzCqSSTin1IgtcPHgW3JPNOzfkQ1C contract_three_seals
          1D012h1COkHfkcZnQFnXYQwZyVoe_CFCA last_honest_oracle
          1I4MOpK3kIyt02THGzZQItfsddGOx1cEF auction_of_a_crown
          1F50jL-fJdpeHHvM4yTW6GLXZq93fCniD unlit_altar
          1s2A4-SRLm2Pnu6V_JC80OyHEAT61EiAb choirs_equation
          1R5cLB8NkKejmQkzS2IiLbWi7_tUsOy1a broken_reliquary
          14ZV32HGA03FZNb0HbgF4FyBM3GJYub4o sleeping_observatory
          1ZjcatzAaV-wMnFeoX8hsDG9nv7P-9tci missing_star_chart
          1YZox2hqbQRXB9bPSVWNQus-UxhHM4yzc trial_blue_glass
          1kJk6ArVNQbtyaisVDhx8INbRsOzeJOn- heretics_margin
          12TwwZ7sRp-XHHEhybNR2QX0bWx1a3y8N disputed_standard
          1R7GioaxbkKspS-ADpaDX_tN7N9prd1S0 furnace_oath
          1nriSjc6sjUU8khhwFEK8yPijwuSL8L_s duel_of_masons
          1rqV5e4b_Q7yFv5ujHT4JhP7ELOIhtWGg prisoners_of_the_pass
          192VcP1DQqKIWLOBpf4Y_oBr7L11YkGJd empty_armory
          1WfeI4p1Fvhdr_2yN0VcDP_YT9GhRc6II cracked_bell
          1tR_kgsGEBgz8CvSB-hK_LhhwOBnqwBld miners_on_strike
          FILES
      - name: Apply Stage B source and event assets
        if: steps.guard.outputs.applied == 'false'
        run: REGISTER04_SOURCE=/tmp/register04 python /tmp/apply-stage-b-events-ui.py
      - name: Install dependencies
        if: steps.guard.outputs.applied == 'false'
        run: npm ci
      - name: Run full regression suite
        if: steps.guard.outputs.applied == 'false'
        run: npm test
      - name: Build production browser distribution
        if: steps.guard.outputs.applied == 'false'
        run: npm run build
      - name: Commit verified package
        if: steps.guard.outputs.applied == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            content/audits/register_04_event_assets.json \
            content/manifests/register-04-events.json \
            game/assets/events/register-04 \
            game/css/stage-b-ui.css \
            game/index.html \
            game/js/register-04-event-assets.mjs \
            game/js/vertical-slice-app.mjs \
            game/js/vertical-slice-presenter-register-02.mjs \
            game/js/vertical-slice-presenter.mjs \
            game/vertical-slice.html \
            package.json \
            scripts/build.cjs \
            src/browser/iron-marches-browser-host.cjs \
            src/campaign/graph.cjs \
            src/campaign/state.cjs \
            src/campaign/validate.cjs \
            src/content/scenario-templates.cjs \
            src/runtime/army-roster.cjs \
            src/runtime/iron-marches-mechanics.cjs \
            src/runtime/presenter-bridge.cjs \
            src/runtime/stage-b-act.cjs \
            src/runtime/vertical-slice.cjs \
            tests/approved-visual-contract.cjs \
            tests/register-04-event-assets.cjs \
            tests/stage-b-act.cjs \
            tests/stage-b-campaign.cjs \
            tests/stage-b-runtime.cjs \
            tests/stage-b-ui.cjs \
            tests/vertical-slice-comfort.cjs
          git rm .github/workflows/export-stage-b-source.yml .github/workflows/apply-stage-b-events-ui.yml
          git commit -m "Complete Stage B and import Register 04 events [stage-b]"
          git push origin HEAD:agent/stage-b-events-ui
