name: Apply pre-battle deployment

on:
  push:
    branches:
      - runtime/prebattle-deployment
    paths:
      - .github/workflows/apply-prebattle-deployment.yml
      - scripts/apply-prebattle-deployment.cjs
      - src/runtime/deployment-gate.cjs
      - tests/deployment-gate.cjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-prebattle-deployment.yml
      - scripts/apply-prebattle-deployment.cjs
      - src/runtime/deployment-gate.cjs
      - tests/deployment-gate.cjs

permissions:
  contents: write

concurrency:
  group: apply-prebattle-deployment
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: runtime/prebattle-deployment
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair one-time patch generator
        run: |
          python - <<'PY'
          from pathlib import Path
          file = Path('scripts/apply-prebattle-deployment.cjs')
          text = file.read_text(encoding='utf-8')
          replacements = {
              "    } else throw new Error(`unexpected status while seeking deployment: ${snapshot.status}`);": "    } else throw new Error('unexpected status while seeking deployment: ' + snapshot.status);",
              "  if (content.indexOf(needle, first + needle.length) >= 0) throw new Error(`${label}: ambiguous needle`);\n": ""
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one repair target, found {text.count(old)}: {old[:60]}')
              text = text.replace(old, new)
          file.write_text(text, encoding='utf-8')
          PY

      - name: Apply strict deployment patch
        run: node scripts/apply-prebattle-deployment.cjs

      - name: Use a scenario-independent persistence edit
        run: |
          python - <<'PY'
          from pathlib import Path
          file = Path('tests/deployment-runtime.cjs')
          text = file.read_text(encoding='utf-8')
          replacements = {
              "  const optional = snapshot.deployment.units.find((unit) => !unit.fixed && !unit.required);\n  assert.ok(optional);\n\n  await runtime.dispatch({ type: 'RemoveDeploymentUnit', unitId: optional.id });\n  snapshot = runtime.getSnapshot();\n  assert.strictEqual(snapshot.deployment.units.find((unit) => unit.id === optional.id).inReserve, true);": "  const movable = snapshot.deployment.units.find((unit) => !unit.fixed);\n  assert.ok(movable);\n  const occupied = new Set(snapshot.deployment.units.map((unit) => unit.square).filter(Boolean));\n  const target = snapshot.deployment.zone.find((square) => !occupied.has(square));\n  assert.ok(target);\n\n  await runtime.dispatch({ type: 'PlaceDeploymentUnit', unitId: movable.id, square: target });\n  snapshot = runtime.getSnapshot();\n  assert.strictEqual(snapshot.deployment.units.find((unit) => unit.id === movable.id).square, target);",
              "  assert.strictEqual(resumed.getSnapshot().deployment.units.find((unit) => unit.id === optional.id).inReserve, true);": "  assert.strictEqual(resumed.getSnapshot().deployment.units.find((unit) => unit.id === movable.id).square, target);",
              "  assert.ok(snapshot.scenario.reserve.some((entry) => entry.entryId === optional.id));": "  assert.ok(snapshot.scenario.pieces.some((piece) => piece.pieceId === movable.id && piece.square === target));"
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one persistence fixture target, found {text.count(old)}')
              text = text.replace(old, new)
          file.write_text(text, encoding='utf-8')
          PY

      - name: Run complete test suite
        run: npm test

      - name: Build production distribution
        run: npm run build

      - name: Commit deployment integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/runtime/deployment-gate.cjs \
            src/runtime/vertical-slice.cjs \
            src/browser/iron-marches-browser-host.cjs \
            src/runtime/presenter-bridge.cjs \
            game/js/runtime-command-client.mjs \
            game/js/vertical-slice-presenter.mjs \
            tests/deployment-gate.cjs \
            tests/deployment-runtime.cjs \
            tests/deployment-presenter-browser.cjs \
            tests/browser-production-runtime.cjs \
            package.json \
            game/js/generated/iron-marches-runtime.bundle.js
          git diff --cached --stat
          git commit -m 'Add saveable pre-battle deployment gate'
          git push origin HEAD:runtime/prebattle-deployment
