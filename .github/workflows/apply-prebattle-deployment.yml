name: Apply pre-battle deployment

on:
  push:
    branches:
      - runtime/prebattle-deployment
    paths:
      - .github/workflows/apply-prebattle-deployment.yml
      - scripts/apply-prebattle-deployment.cjs
      - src/runtime/deployment-gate.cjs
      - tests/deployment-gate.cjs

permissions:
  contents: write

concurrency:
  group: apply-prebattle-deployment
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: runtime/prebattle-deployment
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply strict deployment patch
        run: node scripts/apply-prebattle-deployment.cjs

      - name: Run complete test suite
        run: npm test

      - name: Build production distribution
        run: npm run build

      - name: Commit deployment integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/runtime/deployment-gate.cjs \
            src/runtime/vertical-slice.cjs \
            src/browser/iron-marches-browser-host.cjs \
            src/runtime/presenter-bridge.cjs \
            game/js/runtime-command-client.mjs \
            game/js/vertical-slice-presenter.mjs \
            tests/deployment-gate.cjs \
            tests/deployment-runtime.cjs \
            tests/deployment-presenter-browser.cjs \
            tests/browser-production-runtime.cjs \
            package.json \
            game/js/generated/iron-marches-runtime.bundle.js
          git diff --cached --stat
          git commit -m 'Add saveable pre-battle deployment gate'
          git push origin HEAD:runtime/prebattle-deployment
