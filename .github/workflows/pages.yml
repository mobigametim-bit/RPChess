name: Deploy RPChess to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical gate and build
        run: npm run gate:local

      - name: Check Pages artifact size
        run: |
          bytes=$(du -sb dist | cut -f1)
          mib=$((bytes / 1024 / 1024))
          echo "dist size: ${mib} MiB (${bytes} bytes)"
          test "$bytes" -lt 1000000000

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify GitHub Pages /RPChess/ subpath
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: classic-chess-browser.cjs,responsive-viewport-browser.cjs
        run: npm run test:browser

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
