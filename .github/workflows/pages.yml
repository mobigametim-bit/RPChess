name: Deploy RPChess to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'deploy: active Glory menu sync') || startsWith(github.event.head_commit.message, 'deploy: yandex gateway client') || startsWith(github.event.head_commit.message, 'deploy: tournament routing recovery') || startsWith(github.event.head_commit.message, 'deploy: vk profile conflict recovery') || startsWith(github.event.head_commit.message, 'deploy: mobile vk profile transport and localization') || startsWith(github.event.head_commit.message, 'deploy: mentor training rollout') || startsWith(github.event.head_commit.message, 'deploy: kingdom map release'))))
    # Keep Playwright 1.54 compatible with the runner OS for production deploys.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Pull the exact upstream engine version from the npm registry when
      # GitHub Releases/CDN rejects CI downloads. The build still enforces
      # the pinned JS/WASM SHA-256 and GPL license blob hashes.
      - name: Prepare verified Stockfish 18 package
        run: |
          set -euo pipefail
          npm pack stockfish@18.0.0 --silent --pack-destination /tmp
          mkdir -p /tmp/rpchess-stockfish-package /tmp/rpchess-stockfish-verified
          tar -xzf /tmp/stockfish-18.0.0.tgz -C /tmp/rpchess-stockfish-package
          package=/tmp/rpchess-stockfish-package/package
          for name in stockfish-18-lite-single.js stockfish-18-lite-single.wasm; do
            source=$(find "$package" -type f -name "$name" -print -quit)
            test -n "$source"
            cp "$source" "/tmp/rpchess-stockfish-verified/$name"
          done
          license=$(find "$package" -type f -iname 'Copying.txt' -print -quit)
          test -n "$license"
          cp "$license" /tmp/rpchess-stockfish-verified/COPYING.txt

      - name: Run canonical gate and build
        env:
          RPCHESS_STOCKFISH_ASSET_DIR: /tmp/rpchess-stockfish-verified
        run: npm run gate:local

      - name: Check Pages artifact size
        run: |
          bytes=$(du -sb dist | cut -f1)
          mib=$((bytes / 1024 / 1024))
          echo "dist size: ${mib} MiB (${bytes} bytes)"
          test "$bytes" -lt 1000000000

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install chromium

      - name: Verify GitHub Pages /RPChess/ subpath
        env:
          RPCHESS_GATE_PREFIX: /RPChess
          RPCHESS_BROWSER_TEST: tournament-v4-browser.cjs,portrait-key-scenes-browser.cjs,mobile-run-summary-browser.cjs,events-browser.cjs,puzzles-browser.cjs,battle-browser.cjs,chronicle-localization-browser.cjs,localization-ui-browser.cjs,roster-browser.cjs,classic-chess-browser.cjs,arena-browser.cjs,piercing-vision-browser.cjs,fork-master-browser.cjs,cloud-continue-browser.cjs,responsive-viewport-browser.cjs,onboarding-browser.cjs,settlement-browser.cjs,skirmish-mobile-browser.cjs,caravan-browser.cjs,caravan-reward-viewport-browser.cjs,combat-menu-browser.cjs,combat-side-colors-browser.cjs,combat-resume-browser.cjs
          RPCHESS_VK_MENU_SCREENSHOT_DIR: test-results/vk-menu
          RPCHESS_FLAG_SCREENSHOT_DIR: test-results/flag-ui
          RPCHESS_MOBILE_POLISH_SCREENSHOT_DIR: test-results/mobile-polish
          RPCHESS_PORTRAIT_SCREENSHOT_DIR: test-results/portrait-ui
        run: npm run test:browser

      - name: Upload menu and run-summary screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flag-ui-${{ github.sha }}
          path: |
            test-results/vk-menu
            test-results/flag-ui
            test-results/mobile-polish
            test-results/portrait-ui
            test-results/tournament-v4
          if-no-files-found: warn
          retention-days: 7

      # Mentor-only releases may publish Pages without redeploying profile/PvP Workers.
      # Keep public profile and BOTH PvP transports aligned with the v4 client.
      # Preserve existing secrets and Durable Objects: never re-key active games.
      # Run only for an explicitly requested production release, never a PR.
      - name: Publish compatible Profile and Tournament Workers before Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'deploy: active Glory menu sync') || startsWith(github.event.head_commit.message, 'deploy: tournament routing recovery'))))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          for cfg in profile-worker/wrangler.toml tournament-worker/wrangler-profile.toml tournament-worker/wrangler.toml; do
            npx wrangler secret list --config "$cfg" > /tmp/rpchess-worker-secrets.json
            case "$cfg" in
              profile-worker/*)
                grep -q 'VK_APP_SECRET' /tmp/rpchess-worker-secrets.json ||
                  { echo "::error::VK authentication secret missing for $cfg"; exit 1; }
                ;;
              tournament-worker/*)
                grep -q 'PVP_SESSION_SECRET' /tmp/rpchess-worker-secrets.json ||
                  { echo "::error::Existing Tournament signing secret missing for $cfg"; exit 1; }
                ;;
            esac
          done
          npx wrangler deploy --config profile-worker/wrangler.toml
          npx wrangler deploy --config tournament-worker/wrangler-profile.toml
          npx wrangler deploy --config tournament-worker/wrangler.toml
      - name: Verify live Tournament and profile API health before Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'deploy: active Glory menu sync') || startsWith(github.event.head_commit.message, 'deploy: yandex gateway client') || startsWith(github.event.head_commit.message, 'deploy: tournament routing recovery') || startsWith(github.event.head_commit.message, 'deploy: vk profile conflict recovery') || startsWith(github.event.head_commit.message, 'deploy: mobile vk profile transport and localization') || startsWith(github.event.head_commit.message, 'deploy: mentor training rollout') || startsWith(github.event.head_commit.message, 'deploy: kingdom map release'))))
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const endpoints=[
              ['https://rpchess-profile-preview.mobigametim.workers.dev/health','rpchess-profile-preview'],
              ['https://rpchess-tournament-profile-preview.mobigametim.workers.dev/health','tournament'],
              ['https://rpchess-tournament-preview.mobigametim.workers.dev/health','tournament']
            ];
            for(const [url,service]of endpoints){
              const response=await fetch(url);
              assert.equal(response.status,200,url);
              assert.equal((await response.json()).service,service,url);
            }
            // The current Pages client uses profile-backed identity; test
            // that deployment kept its server-to-server RPChess ID binding.
            const origin='https://mobigametim-bit.github.io';
            const profile='https://rpchess-profile-preview.mobigametim.workers.dev';
            const tour='https://rpchess-tournament-profile-preview.mobigametim.workers.dev';
            const guest=await fetch(profile+'/v1/session',{method:'POST',headers:{
              Origin:origin,'Content-Type':'application/json'
            },body:'{}'});
            assert.equal(guest.status,200,'Web guest profile');
            const profileSession=await guest.json();
            const joined=await fetch(tour+'/v1/session',{method:'POST',headers:{
              Origin:origin,'Content-Type':'application/json'
            },body:JSON.stringify({profileCredential:profileSession.token})});
            assert.equal(joined.status,200,'D1 profile -> Tournament identity');
            const bound=await joined.json();
            assert(bound.token,'Tournament signed session');
            console.log('Production Profile + Tournament Workers ready. RPChess ID verified.');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Configure Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'deploy: active Glory menu sync') || startsWith(github.event.head_commit.message, 'deploy: yandex gateway client') || startsWith(github.event.head_commit.message, 'deploy: tournament routing recovery') || startsWith(github.event.head_commit.message, 'deploy: vk profile conflict recovery') || startsWith(github.event.head_commit.message, 'deploy: mobile vk profile transport and localization') || startsWith(github.event.head_commit.message, 'deploy: mentor training rollout') || startsWith(github.event.head_commit.message, 'deploy: kingdom map release'))))
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'deploy: active Glory menu sync') || startsWith(github.event.head_commit.message, 'deploy: yandex gateway client') || startsWith(github.event.head_commit.message, 'deploy: tournament routing recovery') || startsWith(github.event.head_commit.message, 'deploy: vk profile conflict recovery') || startsWith(github.event.head_commit.message, 'deploy: mobile vk profile transport and localization') || startsWith(github.event.head_commit.message, 'deploy: mentor training rollout') || startsWith(github.event.head_commit.message, 'deploy: kingdom map release'))))
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'deploy: active Glory menu sync') || startsWith(github.event.head_commit.message, 'deploy: yandex gateway client') || startsWith(github.event.head_commit.message, 'deploy: tournament routing recovery') || startsWith(github.event.head_commit.message, 'deploy: vk profile conflict recovery') || startsWith(github.event.head_commit.message, 'deploy: mobile vk profile transport and localization') || startsWith(github.event.head_commit.message, 'deploy: mentor training rollout') || startsWith(github.event.head_commit.message, 'deploy: kingdom map release'))))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
