name: Kingdom Atlas v7 isolated preview
on:
  push:
    branches:
      - fix/kingdom-world-geometry-atlas-v7
    paths:
      - '.github/workflows/kingdom-atlas-v7-preview.yml'
      - 'game/**'
      - 'scripts/**'
      - 'tests/**'
      - 'kingdom-atlas-v7-preview/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rpchess-kingdom-atlas-v7-qa
  cancel-in-progress: true
jobs:
  verify-and-preview:
    if: github.repository == 'mobigametim-bit/RPChess' && github.ref == 'refs/heads/fix/kingdom-world-geometry-atlas-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare canonical Stockfish engine via npm registry
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm pack stockfish@18.0.0 --silent --pack-destination /tmp
          mkdir -p /tmp/rpchess-stockfish-package /tmp/rpchess-stockfish-verified
          tar -xzf /tmp/stockfish-18.0.0.tgz -C /tmp/rpchess-stockfish-package
          package=/tmp/rpchess-stockfish-package/package
          for name in stockfish-18-lite-single.js stockfish-18-lite-single.wasm; do
            source=$(find "$package" -type f -name "$name" -print -quit)
            test -n "$source"
            cp "$source" "/tmp/rpchess-stockfish-verified/$name"
          done
          license=$(find "$package" -type f -iname 'Copying.txt' -print -quit)
          test -n "$license"
          cp "$license" /tmp/rpchess-stockfish-verified/COPYING.txt
      - name: Full local gate and approved Atlas build
        env:
          RPCHESS_INCLUDE_ATLAS_LAB: '1'
          RPCHESS_STOCKFISH_ASSET_DIR: /tmp/rpchess-stockfish-verified
        run: npm run gate:local
      - name: Check new modules and clean editor controls
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('dist/atlas-lab.html','utf8');
          assert(html.includes('Atlas Lab v7'));
          assert(html.includes('wastelandDensity'));
          assert(html.includes('labClosestRiver'));
          assert(!html.includes("['paperContrast','Фактура бумаги'"));
          assert(!html.includes("['fogIrregularity','Неровность краёв'"));
          assert(!html.includes("['revealRadius','Стартовая разведка'"));
          assert(fs.existsSync('dist/js/kingdom-geography.mjs'));
          console.log('Atlas Lab v7 and canonical geometry bundled.');
          NODE
      - name: Browser acceptance for gameplay and map
        env:
          RPCHESS_JOURNEY_PICKER_ONLY: '1'
          RPCHESS_BROWSER_TEST: kingdom-map-browser.cjs
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install chromium
          npm run test:browser
      - name: Deploy isolated Cloudflare Atlas v7 test stand
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config kingdom-atlas-v7-preview/wrangler.toml
      - name: Verify published preview
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const base='https://rpchess-kingdom-atlas-v7-preview.mobigametim.workers.dev';
            for(const [path,needle] of [['/atlas-lab.html','Atlas Lab v7'],
              ['/js/kingdom-geography.mjs','naturalTileOccupancy'],
              ['/js/kingdom-world-core.mjs','worldGeneratorVersion']]){
              const r=await fetch(base+path,{cache:'no-store'});
              assert.equal(r.status,200,path);
              assert((await r.text()).includes(needle),path);
            }
            console.log('Isolated Atlas v7 preview published.');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
