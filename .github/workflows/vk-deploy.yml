name: Deploy RPChess to VK Hosting

on:
  workflow_dispatch:
    inputs:
      environment:
        description: VK Hosting environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read

concurrency:
  group: vk-hosting-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-vk:
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
      MINI_APPS_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run gate:vk
      - name: Require VK Hosting access token
        run: test -n "$MINI_APPS_ACCESS_TOKEN"
      - name: Deploy exact VK dev build
        run: npx --yes @vkontakte/vk-miniapps-deploy@1.0.2
