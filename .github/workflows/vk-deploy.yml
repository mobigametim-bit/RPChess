name: Deploy RPChess to VK Hosting

on:
  workflow_dispatch:
    inputs:
      environment:
        description: VK Hosting environment (dev only)
        required: false
        default: dev

permissions:
  contents: read

concurrency:
  group: vk-hosting-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-vk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
      MINI_APPS_ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run gate:vk
      - name: Require VK Hosting access token
        run: test -n "$MINI_APPS_ACCESS_TOKEN"
      - name: Deploy exact VK dev build
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            echo "VK deploy attempt ${attempt}/5"
            npx --yes @vkontakte/vk-miniapps-deploy@1.0.2
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "VK deploy succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "VK deploy failed with status ${status}; waiting before retry"
              sleep 45
            fi
          done
          exit 1
