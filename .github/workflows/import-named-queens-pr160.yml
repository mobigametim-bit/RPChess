name: Import six named queen portraits and pieces (PR 160)

on:
  push:
    branches:
      - feature/race-chess-piece-art-20261016
    paths:
      - .github/workflows/import-named-queens-pr160.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'mobigametim-bit/RPChess'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download supplied queen art and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1YX76nS6cMiQMZXuakVup3th0VGaI1A2I&export=download&confirm=t' \
            -o /tmp/named-queens.zip
          echo 'd7cc8ffcca8c1277334be6cf10e72b80571c9d50568344c7d53265bd148931c9  /tmp/named-queens.zip' | sha256sum -c -
          unzip -t /tmp/named-queens.zip
      - name: Install six queen portraits and side-specific sprites
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/named-queens.zip -d .
          for hero in abbess_celene viola_mask empress_nahla ysra_moss lady_sorn khulan_star; do
            test -s "game/assets/heroes/$hero/portrait_named.webp"
            test "$(head -c4 "game/assets/heroes/$hero/portrait_named.webp")" = 'RIFF'
            for side in white black; do
              sprite="game/assets/heroes/$hero/pieces/$side/queen.webp"
              test -s "$sprite"
              test "$(head -c4 "$sprite")" = 'RIFF'
            done
          done
      - name: Commit verified queen art to PR160 only
        shell: bash
        run: |
          set -euo pipefail
          for hero in abbess_celene viola_mask empress_nahla ysra_moss lady_sorn khulan_star; do
            git add "game/assets/heroes/$hero/portrait_named.webp" \
              "game/assets/heroes/$hero/pieces/white/queen.webp" \
              "game/assets/heroes/$hero/pieces/black/queen.webp"
          done
          git diff --cached --quiet && { echo 'Already committed'; exit 0; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'assets: import six named queens (18 optimized WebP)'
          git push origin HEAD:feature/race-chess-piece-art-20261016
