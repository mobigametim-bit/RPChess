name: Apply first mechanics package

on:
  push:
    branches:
      - agent/first-executable-hero-mechanics

permissions:
  contents: write

concurrency:
  group: apply-first-mechanics-package
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/first-executable-hero-mechanics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Stop after package was applied
        id: guard
        run: |
          if grep -q "createAbilityState(options.abilities" src/combat/battle.cjs \
            && grep -q "abilities: originalBattle.abilities" src/runtime/deployment-gate.cjs; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.guard.outputs.applied == 'false'
        run: npm ci
      - name: Apply source package
        if: steps.guard.outputs.applied == 'false'
        run: |
          node scripts/apply-first-mechanics-package.cjs
          node scripts/apply-deployment-ability-preservation.cjs
      - name: Run complete regression suite
        if: steps.guard.outputs.applied == 'false'
        run: npm test
      - name: Build production browser runtime
        if: steps.guard.outputs.applied == 'false'
        run: npm run build
      - name: Commit verified target files
        if: steps.guard.outputs.applied == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            content/audits/iron_marches_mechanics_readiness.json \
            game/js/generated/iron-marches-runtime.bundle.js \
            game/js/iron-marches-mechanics-readiness.mjs \
            game/js/vertical-slice-presenter.mjs \
            package.json \
            scripts/audit-iron-marches-mechanics.cjs \
            src/browser/iron-marches-browser-host.cjs \
            src/combat/battle.cjs \
            src/runtime/deployment-gate.cjs \
            tests/iron-marches-mechanics-readiness.cjs
          git commit -m "Implement first executable Iron Marches mechanics"
          git fetch origin agent/first-executable-hero-mechanics
          git rebase origin/agent/first-executable-hero-mechanics
          git push origin HEAD:agent/first-executable-hero-mechanics
