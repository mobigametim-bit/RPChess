name: Apply approved visual shell

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: approved-visual-shell-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/restore-approved-visual-shell' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-approved-visual-shell
          fetch-depth: 0
      - name: Detect completed visual package
        id: guard
        run: |
          if test -f content/design/approved_visual_contract.md && test -f game/js/approved-shell-data.mjs; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.applied == 'false'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.applied == 'false'
        with:
          node-version: 22
          cache: npm
      - name: Download approved visual package
        if: steps.guard.outputs.applied == 'false'
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0
          gdown --id 1KpPPrwwI2NxNrln9mLcaROOIlBbHd7tf -O /tmp/apply-approved-visual-shell.cjs
          node --check /tmp/apply-approved-visual-shell.cjs
      - name: Apply package
        if: steps.guard.outputs.applied == 'false'
        run: node /tmp/apply-approved-visual-shell.cjs
      - name: Install dependencies
        if: steps.guard.outputs.applied == 'false'
        run: npm ci
      - name: Run full regression suite
        if: steps.guard.outputs.applied == 'false'
        run: npm test
      - name: Build production browser distribution
        if: steps.guard.outputs.applied == 'false'
        run: npm run build
      - name: Commit verified visual shell
        if: steps.guard.outputs.applied == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            game/index.html \
            game/vertical-slice.html \
            game/css/approved-visual-shell.css \
            game/js/approved-shell-data.mjs \
            game/js/vertical-slice-audio.mjs \
            game/js/vertical-slice-app.mjs \
            game/js/vertical-slice-presenter.mjs \
            game/js/register-02-codex.mjs \
            game/js/vertical-slice-presenter-register-02.mjs \
            game/js/register-03-relic-codex.mjs \
            game/js/iron-marches-mechanics-readiness-enhancer.mjs \
            content/design/approved_visual_contract.md \
            scripts/build.cjs \
            tests/approved-visual-contract.cjs \
            tests/register-02-presenter-extension.cjs \
            tests/army-ui-surfaces.cjs \
            tests/register-03-relic-ui.cjs \
            tests/vertical-slice-comfort.cjs \
            package.json
          git commit -m "Restore approved prototype visual shell [approved-shell]"
          git push origin HEAD:agent/restore-approved-visual-shell
