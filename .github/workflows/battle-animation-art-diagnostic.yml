name: RPChess Battle Moving Art Diagnostic

on:
  push:
    branches:
      - perf/piece-asset-runtime-budget

permissions:
  contents: read

jobs:
  verify-moving-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run canonical local gate
        run: npm run gate:local
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run targeted Battle moving-art regression
        timeout-minutes: 10
        run: RPCHESS_BROWSER_TEST=battle-animation-art-browser.cjs npm run test:browser
