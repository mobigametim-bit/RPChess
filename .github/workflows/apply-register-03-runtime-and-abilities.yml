name: Apply Register 03 runtime and abilities

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/register-03-relics-and-remaining-abilities' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/register-03-relics-and-remaining-abilities
          fetch-depth: 0
      - name: Detect completed package
        id: guard
        run: |
          if test -f tests/remaining-iron-marches-abilities.cjs && grep -q "schemaVersion: 5" src/combat/battle.cjs; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.applied == 'false'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.guard.outputs.applied == 'false'
        run: npm ci
      - name: Apply runtime and UI package
        if: steps.guard.outputs.applied == 'false'
        run: node scripts/apply-register-03-runtime-and-ui.cjs
      - name: Run complete regression suite
        if: steps.guard.outputs.applied == 'false'
        run: npm test
      - name: Build production browser runtime
        if: steps.guard.outputs.applied == 'false'
        run: npm run build
      - name: Commit verified package
        if: steps.guard.outputs.applied == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            content/audits/iron_marches_mechanics_readiness.json \
            game/js/generated/iron-marches-runtime.bundle.js \
            game/js/register-02-codex.mjs \
            game/js/vertical-slice-presenter-register-02.mjs \
            game/js/vertical-slice-presenter.mjs \
            package.json \
            src/combat/battle.cjs \
            src/combat/reserve.cjs \
            src/combat/statuses.cjs \
            src/combat/ward-protection.cjs \
            src/core/chess/rules.cjs \
            src/runtime/deployment-gate.cjs \
            tests/register-03-relic-assets.cjs \
            tests/remaining-iron-marches-abilities.cjs
          git commit -m "Apply Register 03 art and remaining abilities [register03-runtime]"
          git push origin HEAD:agent/register-03-relics-and-remaining-abilities
