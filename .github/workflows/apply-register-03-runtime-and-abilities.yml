name: Apply Register 03 runtime and abilities

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/register-03-relics-and-remaining-abilities' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/register-03-relics-and-remaining-abilities
          fetch-depth: 0
      - name: Detect completed package
        id: guard
        run: |
          if test -f tests/remaining-iron-marches-abilities.cjs && grep -q "schemaVersion: 5" src/combat/battle.cjs; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.applied == 'false'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.guard.outputs.applied == 'false'
        run: npm ci
      - name: Apply runtime package
        if: steps.guard.outputs.applied == 'false'
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('scripts/apply-register-03-runtime-and-ui.cjs')
          source = target.read_text(encoding='utf-8')
          source = source.replace('`${record.filename} must be RGBA`', "record.filename + ' must be RGBA'")
          source = source.replace('`${abilityId}:${ownerId}`', "abilityId + ':' + ownerId")
          source = source.replace('`missing legal ${abilityId}`', "'missing legal ' + abilityId")
          source = source.replace('patchRelicUi();', '')
          source = source.replace("'4k3/8/8/8/8/8/3P4/R3K3 w - - 0 1', { a1: 'aldric', d2: 'ally'", "'4k3/8/8/8/8/8/2RP4/4K3 w - - 0 1', { c2: 'aldric', d2: 'ally'")
          source = source.replace("'4k3/8/8/8/3r4/8/3P4/4K3 w - - 0 1', { d2: 'offering', d4: 'enemy', e1: 'wk', e8: 'bk' }, { offering: { side: 'w' }, enemy: { side: 'b' }, wk: { side: 'w' }, bk: { side: 'b' } }, [entry('declare_sacrifice', 'offering'", "'4k3/8/8/8/3r4/8/3P4/R3K3 w - - 0 1', { a1: 'oath', d2: 'offering', d4: 'enemy', e1: 'wk', e8: 'bk' }, { oath: { side: 'w' }, offering: { side: 'w' }, enemy: { side: 'b' }, wk: { side: 'w' }, bk: { side: 'b' } }, [entry('declare_sacrifice', 'oath'")
          source = source.replace("const use = command(state, 'ability.oath_fallen', (payload) => payload.targetId === 'offering' || payload.targetId);", "const use = command(state, 'ability.oath_fallen', (payload) => payload.targetId === 'offering');")
          target.write_text(source, encoding='utf-8')
          PY
          node --check scripts/apply-register-03-runtime-and-ui.cjs
          node scripts/apply-register-03-runtime-and-ui.cjs
          python - <<'PY'
          import json
          from pathlib import Path

          status_test = Path('tests/status-system.cjs')
          status_source = status_test.read_text(encoding='utf-8')
          status_source = status_source.replace("['bound', 'cursed', 'marked', 'provoked', 'silenced', 'ward']", "['bound', 'cursed', 'evasion', 'guarded', 'marked', 'offered', 'provoked', 'silenced', 'ward']")
          status_test.write_text(status_source, encoding='utf-8')

          evidence = {
            'ability.interpose': ('src/combat/abilities.cjs', ['interpose', 'guarded']),
            'ability.chain_formation': ('src/combat/abilities.cjs', ['chain_formation', 'FormationAdvanced']),
            'ability.forge_line': ('src/combat/abilities.cjs', ['forge_line', 'BoardTopologyChanged']),
            'ability.previewed_charge': ('src/combat/abilities.cjs', ['previewed_charge', 'PreviewedChargeCompleted']),
            'ability.hostage_tactic': ('src/combat/abilities.cjs', ['hostage_tactic', "'bound'"]),
            'ability.gate_command': ('src/combat/abilities.cjs', ['gate_command', 'BoardTopologyChanged']),
            'effect.visible_evasion_after_non_capture': ('src/combat/iron-marches-hooks.cjs', ['evasion_after_non_capture', "'evasion'"]),
            'effect.conditional_early_promotion': ('src/combat/abilities.cjs', ['early_promotion', 'PawnPromoted']),
            'effect.order_after_voluntary_sacrifice': ('src/combat/iron-marches-hooks.cjs', ['VoluntarySacrificeResolved', 'voluntary_sacrifice'])
          }
          audit_path = Path('content/audits/iron_marches_mechanics_readiness.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          for record in [*audit['abilities'], *audit['relicEffects']]:
              if record['id'] not in evidence:
                  continue
              source_path, tokens = evidence[record['id']]
              record['evidence'] = [
                  {'path': source_path, 'tokens': tokens},
                  {'path': 'tests/remaining-iron-marches-abilities.cjs', 'tokens': [record['id']]}
              ]
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Run complete regression suite
        if: steps.guard.outputs.applied == 'false'
        run: npm test
      - name: Build production browser runtime
        if: steps.guard.outputs.applied == 'false'
        run: npm run build
      - name: Commit verified package
        if: steps.guard.outputs.applied == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            content/audits/iron_marches_mechanics_readiness.json \
            game/js/generated/iron-marches-runtime.bundle.js \
            game/js/vertical-slice-presenter.mjs \
            package.json \
            src/combat/battle.cjs \
            src/combat/reserve.cjs \
            src/combat/statuses.cjs \
            src/combat/ward-protection.cjs \
            src/core/chess/rules.cjs \
            src/runtime/deployment-gate.cjs \
            tests/status-system.cjs \
            tests/register-03-relic-assets.cjs \
            tests/remaining-iron-marches-abilities.cjs
          git commit -m "Implement remaining Iron Marches abilities [register03-runtime]"
          git push origin HEAD:agent/register-03-relics-and-remaining-abilities
