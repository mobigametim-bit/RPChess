name: One-time Kingdom map PNG import
on:
  push:
    branches: [feature/infinite-kingdom-map-auto-encounters-20261108]
    paths:
      - 'game/assets/kingdom-map/kingdom-assets-import.zip'
      - '.github/workflows/kingdom-assets-import-once.yml'
permissions:
  contents: write
concurrency:
  group: kingdom-assets-import-once
  cancel-in-progress: false
jobs:
  unpack-verified-assets:
    if: github.repository == 'mobigametim-bit/RPChess' && github.ref == 'refs/heads/feature/infinite-kingdom-map-auto-encounters-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and import exactly 85 separate PNG files
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, pathlib, struct, zipfile
          archive=pathlib.Path('game/assets/kingdom-map/kingdom-assets-import.zip')
          expected_sha='30d062e3ee9c5a02aa9794d9f7cb4091356e5160d2ee65a1465d4dea48d46afe'
          assert archive.exists(), 'missing approved Kingdom source archive'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected_sha, 'ZIP SHA256 mismatch'
          races=['humans','elves','orcs','undead','dark_elves','dwarves','demons','angels','dragonborn','beastfolk','constructs','animals','fae','goblins']
          kinds=['battle','caravan','castle','event','settlement','skirmish']
          expected={f'{race}/{race}_{kind}_128.png' for race in races for kind in kinds}
          expected.add('puzzle/puzzle_128.png')
          root=pathlib.Path('game/assets/kingdom-map')
          prefix='RPChess_Infinite_Kingdom_85_assets_128px_fixed/assets/'
          with zipfile.ZipFile(archive) as z:
            entries=[i for i in z.infolist() if i.filename.endswith('.png')]
            found=set()
            for info in entries:
              assert info.filename.startswith(prefix), 'unexpected archive root'
              relative=info.filename[len(prefix):]
              assert relative in expected and relative not in found, f'unexpected or duplicate {relative}'
              found.add(relative)
              png=z.read(info)
              assert png[:8]==b'\x89PNG\r\n\x1a\n', f'not PNG: {relative}'
              width,height,depth,color,comp,fil,interlace=struct.unpack('>IIBBBBB',png[16:29])
              assert (width,height,depth,color,comp,fil,interlace)==(128,128,8,6,0,0,0), f'bad sprite {relative}'
              target=root/relative
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(png)
          assert found==expected and len(found)==85, f'asset register drift: {len(found)}'
          archive.unlink()
          print(f'Kingdom PNG import PASS: {len(found)} files')
          PY
      - name: Commit unpacked PNGs to feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- game/assets/kingdom-map
          git commit -m 'assets(kingdom): materialize 85 reviewed PNG sprites from checksum-verified ZIP'
          git push origin HEAD:refs/heads/feature/infinite-kingdom-map-auto-encounters-20261108
