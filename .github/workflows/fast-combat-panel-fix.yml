name: Fast combat panel fix verification

on:
  push:
    branches:
      - fix/combat-panel-vk-pages-fast-2026-09-11

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/combat-panel-vk-pages-fast-2026-09-11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply owner-rule fix and permanent width assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          polish = Path('game/css/chess-ai-polish.css')
          text = polish.read_text(encoding='utf-8')
          old = """    width:calc(100% - 18px)!important;\n    max-width:calc(100% - 18px)!important;"""
          new = """    width:min(\n      calc(100vw - 100dvh - 4px),\n      max(220px, calc(48vw - 48dvh - 2px))\n    )!important;\n    max-width:none!important;"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one owner width rule, found {text.count(old)}')
          polish.write_text(text.replace(old, new, 1), encoding='utf-8')

          side = Path('game/css/combat-side-colors.css')
          text = side.read_text(encoding='utf-8')
          marker = "\n/* Shared compact-combat spacing: preserve the fixed board and turn unused left-rail width into air. */\n"
          if marker not in text:
              raise SystemExit('Expected stale compact-combat spacing block')
          side.write_text(text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')

          test = Path('tests/responsive-viewport-browser.cjs')
          text = test.read_text(encoding='utf-8')
          old_geom = """      return {\n        movesInsideParty:Boolean(party&&moves&&moves.parentElement===party),\n        movesInShell:Boolean(shell&&moves&&moves.parentElement===shell),\n        gap:p&&b?b.left-p.right:0\n      };"""
          new_geom = """      const m=moves?.getBoundingClientRect();\n      return {\n        movesInsideParty:Boolean(party&&moves&&moves.parentElement===party),\n        movesInShell:Boolean(shell&&moves&&moves.parentElement===shell),\n        partyWidth:p?.width||0,\n        movesWidth:m?.width||0,\n        gap:p&&b?b.left-p.right:0\n      };"""
          if text.count(old_geom) != 1:
              raise SystemExit('Skirmish geometry block mismatch')
          text = text.replace(old_geom, new_geom, 1)

          old_assert = """    assert.strictEqual(combatPanel.movesInsideParty, false, `${label}: run combat Journal must not be reparented into the Party panel`);\n    assert.strictEqual(combatPanel.movesInShell, true, `${label}: run combat Journal must remain in its stable classic-shell owner slot`);\n    assert(combatPanel.gap >= 4, `${label}: combat information panel must not touch the board`);"""
          new_assert = """    const expectedCombatPanelWidth = Math.min(width - height - 4, Math.max(220, .48 * width - .48 * height - 2));\n    assert.strictEqual(combatPanel.movesInsideParty, false, `${label}: run combat Journal must not be reparented into the Party panel`);\n    assert.strictEqual(combatPanel.movesInShell, true, `${label}: run combat Journal must remain in its stable classic-shell owner slot`);\n    assert(Math.abs(combatPanel.partyWidth - expectedCombatPanelWidth) <= 2, `${label}: Skirmish Party frame width ${combatPanel.partyWidth}px must match ${expectedCombatPanelWidth}px`);\n    assert(Math.abs(combatPanel.movesWidth - expectedCombatPanelWidth) <= 2, `${label}: Skirmish Journal frame width ${combatPanel.movesWidth}px must match ${expectedCombatPanelWidth}px`);\n    assert(combatPanel.gap >= 4, `${label}: combat information panel must not touch the board`);"""
          if text.count(old_assert) != 1:
              raise SystemExit('Skirmish assertion block mismatch')
          text = text.replace(old_assert, new_assert, 1)

          battle_anchor = """    await page.locator('[data-battle-start]').click();\n    await page.locator('[data-classic-screen]:not([hidden])').waitFor();\n    await page.evaluate(() => globalThis.RPChessBattle.finishBattle({ over:true, type:'stalemate', winner:null }));"""
          battle_replacement = """    await page.locator('[data-battle-start]').click();\n    await page.locator('[data-classic-screen]:not([hidden])').waitFor();\n    const battleCombatPanel = await page.evaluate(() => {\n      const party=document.querySelector('.classic-party-panel')?.getBoundingClientRect();\n      const moves=document.querySelector('.classic-panel--moves')?.getBoundingClientRect();\n      const board=document.querySelector('[data-chess-board]')?.getBoundingClientRect();\n      return { partyWidth:party?.width||0, movesWidth:moves?.width||0, gap:party&&board?board.left-party.right:0 };\n    });\n    assert(Math.abs(battleCombatPanel.partyWidth - expectedCombatPanelWidth) <= 2, `${label}: Battle Party frame width ${battleCombatPanel.partyWidth}px must match ${expectedCombatPanelWidth}px`);\n    assert(Math.abs(battleCombatPanel.movesWidth - expectedCombatPanelWidth) <= 2, `${label}: Battle Journal frame width ${battleCombatPanel.movesWidth}px must match ${expectedCombatPanelWidth}px`);\n    assert(battleCombatPanel.gap >= 4, `${label}: Battle information panel must not touch the board`);\n    await page.evaluate(() => globalThis.RPChessBattle.finishBattle({ over:true, type:'stalemate', winner:null }));"""
          if text.count(battle_anchor) != 1:
              raise SystemExit('Battle combat anchor mismatch')
          test.write_text(text.replace(battle_anchor, battle_replacement, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused static regressions and canonical build
        run: |
          npm run test:ui
          npm run test:skirmish
          npm run test:battle
          npm run build

      - name: Add ephemeral focused browser proof
        shell: bash
        run: |
          cat > tests/combat-panel-width-fast-browser.cjs <<'NODE'
          const assert = require('assert');
          const { chromium } = require('playwright');
          const { startNewRun } = require('./browser-test-helpers.cjs');
          const url = process.env.RPCHESS_ACCEPTANCE_URL || 'http://127.0.0.1:4173';

          async function fresh(page) {
            await page.goto(url, { waitUntil:'networkidle' });
            await page.evaluate(() => localStorage.clear());
            await page.reload({ waitUntil:'networkidle' });
            await page.locator('[data-reboot-foundation]:not([hidden])').waitFor();
            await startNewRun(page, { playerName:'Panel Width Gate' });
          }
          async function widths(page) {
            return page.evaluate(() => {
              const p=document.querySelector('.classic-party-panel')?.getBoundingClientRect();
              const m=document.querySelector('.classic-panel--moves')?.getBoundingClientRect();
              const b=document.querySelector('[data-chess-board]')?.getBoundingClientRect();
              return { party:p?.width||0, moves:m?.width||0, gap:p&&b?b.left-p.right:0, board:b?{left:b.left,right:b.right,width:b.width,height:b.height}:null };
            });
          }
          async function runViewport(browser, width, height) {
            const page=await browser.newPage({viewport:{width,height}});
            try {
              await fresh(page);
              const expected=Math.min(width-height-4, Math.max(220,.48*width-.48*height-2));
              await page.evaluate(() => dispatchEvent(new CustomEvent('rpchess:skirmish-open')));
              await page.locator('[data-skirmish-screen]:not([hidden])').waitFor();
              await page.locator('[data-skirmish-start]').click();
              await page.locator('[data-classic-screen]:not([hidden])').waitFor();
              let g=await widths(page);
              assert(Math.abs(g.party-expected)<=2, `${width}x${height} Skirmish party ${g.party} != ${expected}`);
              assert(Math.abs(g.moves-expected)<=2, `${width}x${height} Skirmish journal ${g.moves} != ${expected}`);
              assert(g.gap>=4, `${width}x${height} Skirmish gap ${g.gap}`);
              await page.evaluate(() => globalThis.RPChessSkirmish.finishBattle({over:true,type:'stalemate',winner:null}));
              await page.locator('[data-skirmish-aftermath]:not([hidden])').waitFor();
              await page.evaluate(() => dispatchEvent(new CustomEvent('rpchess:battle-open')));
              await page.locator('[data-battle-screen]:not([hidden])').waitFor();
              await page.locator('[data-battle-start]').click();
              await page.locator('[data-classic-screen]:not([hidden])').waitFor();
              g=await widths(page);
              assert(Math.abs(g.party-expected)<=2, `${width}x${height} Battle party ${g.party} != ${expected}`);
              assert(Math.abs(g.moves-expected)<=2, `${width}x${height} Battle journal ${g.moves} != ${expected}`);
              assert(g.gap>=4, `${width}x${height} Battle gap ${g.gap}`);
              console.log(`combat-panel ${width}x${height}: expected=${expected.toFixed(1)}, party=${g.party.toFixed(1)}, journal=${g.moves.toFixed(1)}, gap=${g.gap.toFixed(1)} PASS`);
            } finally { await page.close(); }
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for (const dims of [[1897,789],[1366,768],[844,390]]) await runViewport(browser,...dims);
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run focused real-browser width proof
        env:
          RPCHESS_BROWSER_TEST: combat-panel-width-fast-browser.cjs
        run: npm run test:browser

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f tests/combat-panel-width-fast-browser.cjs
          rm -f .github/workflows/fast-combat-panel-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/css/chess-ai-polish.css game/css/combat-side-colors.css tests/responsive-viewport-browser.cjs .github/workflows/fast-combat-panel-fix.yml
          git commit -m "fix: enforce narrow Battle and Skirmish combat frames [skip ci]"
          git push origin HEAD:fix/combat-panel-vk-pages-fast-2026-09-11
