name: Apply automatic music catalog migration

on:
  push:
    branches:
      - audio/auto-music-catalog-2026-09-13
    paths:
      - .github/workflows/auto-music-catalog-pass.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/auto-music-catalog-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply migration
        run: python scripts/_tmp_music_catalog_migration.py
      - name: Full local gate with no background music
        run: npm run gate:local
      - name: Verify zero-music production candidate
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import fs from 'node:fs'; import path from 'node:path'; const sourceFiles=fs.readdirSync('game/music').filter(n=>/\\.(?:mp3|ogg|wav)$/i.test(n)); assert.deepEqual(sourceFiles,[]); const catalog=fs.readFileSync('dist/js/music-catalog.mjs','utf8'); assert.match(catalog,/Object\\.freeze\\(\\[\\]\\)/); for(const name of ['echoes_iron_throne_01.mp3','echoes_iron_throne_02.mp3','echoes_iron_throne_03.mp3','echoes_iron_throne_04.mp3']) assert.equal(fs.existsSync(path.join('dist/music',name)),false); console.log('Zero-music production candidate: PASS');"
      - name: Prove automatic folder discovery
        run: |
          printf 'test' > game/music/__catalog_probe__.mp3
          npm run build >/tmp/rp-build.log
          grep -q "music/__catalog_probe__.mp3" dist/js/music-catalog.mjs
          test -f dist/music/__catalog_probe__.mp3
          rm game/music/__catalog_probe__.mp3
          echo "Automatic music discovery: PASS"
      - name: Commit validated migration
        run: |
          rm .github/workflows/auto-music-catalog-pass.yml
          rm scripts/_tmp_music_catalog_migration.py
          rm -rf dist .runtime-asset-cache || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "audio: generate playlist from cleared music folder"
          git push origin HEAD:audio/auto-music-catalog-2026-09-13
