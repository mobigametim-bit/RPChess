name: Inspect VK external Pages configuration

on:
  push:
    branches:
      - vk/external-pages-inspect-2026-09-11

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
    steps:
      - name: Inspect VK app and testing groups safely
        shell: bash
        run: |
          if [ -z "$MINI_APPS_ACCESS_TOKEN" ]; then
            echo "::error::MINI_APPS_ACCESS_TOKEN is not configured"
            exit 1
          fi

          call_vk() {
            local method="$1"
            shift
            curl --fail --silent --show-error --get \
              --data-urlencode "access_token=${MINI_APPS_ACCESS_TOKEN}" \
              --data-urlencode "v=5.199" \
              "$@" \
              "https://api.vk.ru/method/${method}"
          }

          APP_RESPONSE=$(call_vk apps.get \
            --data-urlencode "app_ids=54754579" \
            --data-urlencode "extended=1")
          GROUP_RESPONSE=$(call_vk apps.getTestingGroups \
            --data-urlencode "app_id=54754579")

          APP_RESPONSE="$APP_RESPONSE" GROUP_RESPONSE="$GROUP_RESPONSE" node <<'NODE'
          function safe(value) {
            if (Array.isArray(value)) return value.map(safe);
            if (!value || typeof value !== 'object') return value;
            const out = {};
            for (const [k,v] of Object.entries(value)) {
              if (/token|secret|key/i.test(k)) continue;
              out[k] = safe(v);
            }
            return out;
          }
          for (const [name, raw] of [['apps.get', process.env.APP_RESPONSE], ['apps.getTestingGroups', process.env.GROUP_RESPONSE]]) {
            const payload = JSON.parse(raw || '{}');
            if (payload.error) {
              console.log(`${name} ERROR ${payload.error.error_code}: ${payload.error.error_msg}`);
              continue;
            }
            console.log(`${name} RESPONSE ${JSON.stringify(safe(payload.response))}`);
          }
          NODE
