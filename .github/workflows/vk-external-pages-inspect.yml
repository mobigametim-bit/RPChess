name: Inspect GitHub Pages headers for VK

on:
  push:
    branches:
      - vk/external-pages-inspect-2026-09-11

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect response headers and framing policy
        shell: bash
        run: |
          echo '=== HEADERS ==='
          curl --silent --show-error --location --head https://mobigametim-bit.github.io/RPChess/ | sed -n '1,80p'
          echo '=== SECURITY-RELEVANT ==='
          curl --silent --show-error --location --head https://mobigametim-bit.github.io/RPChess/ | grep -Ei '^(HTTP/|content-security-policy:|x-frame-options:|cross-origin|access-control|content-type:|location:)' || true
          echo '=== BODY STATUS ==='
          curl --silent --show-error --location --output /tmp/rpchess.html --write-out 'code=%{http_code} type=%{content_type} bytes=%{size_download}\n' https://mobigametim-bit.github.io/RPChess/
          head -c 200 /tmp/rpchess.html | tr '\n' ' '; echo
