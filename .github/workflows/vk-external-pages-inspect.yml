name: Inspect VK GitHub Pages test group

on:
  push:
    branches:
      - vk/external-pages-inspect-2026-09-11

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
    steps:
      - name: Read test group
        shell: bash
        run: |
          BODY=$(curl --silent --show-error --get \
            --data-urlencode "access_token=${MINI_APPS_ACCESS_TOKEN}" \
            --data-urlencode "v=5.199" \
            --data-urlencode "app_id=54754579" \
            "https://api.vk.ru/method/apps.getTestingGroups")
          BODY="$BODY" node <<'NODE'
          const p=JSON.parse(process.env.BODY||'{}');
          if(p.error){console.error(`VK ERROR ${p.error.error_code}: ${p.error.error_msg}`);process.exit(2)}
          console.log(`GROUPS ${JSON.stringify(p.response)}`);
          NODE
