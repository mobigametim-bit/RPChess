name: Diagnose VK Pages testing-group API

on:
  push:
    branches:
      - vk/external-pages-inspect-2026-09-11

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
      PAGES_URL: https://mobigametim-bit.github.io/RPChess/
    steps:
      - name: Call testing-group API without exposing token
        shell: bash
        run: |
          RESPONSE_FILE=$(mktemp)
          HTTP=$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' --request POST \
            --data-urlencode "access_token=${MINI_APPS_ACCESS_TOKEN}" \
            --data-urlencode "v=5.199" \
            --data-urlencode "webview=${PAGES_URL}" \
            --data-urlencode "name=GitHub Pages manual check" \
            --data-urlencode "platforms=web,mobile,mvk" \
            "https://api.vk.ru/method/apps.updateMetaForTestingGroup")
          echo "HTTP $HTTP"
          BODY=$(cat "$RESPONSE_FILE")
          BODY="$BODY" node <<'NODE'
          const raw=process.env.BODY||'';
          try {
            const p=JSON.parse(raw);
            if (p.error) console.log(`VK ERROR ${p.error.error_code}: ${p.error.error_msg}`);
            else console.log(`VK RESPONSE ${JSON.stringify(p.response)}`);
          } catch { console.log(`NONJSON ${raw.slice(0,500)}`); }
          NODE
