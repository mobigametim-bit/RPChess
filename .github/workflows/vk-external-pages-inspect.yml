name: Configure VK GitHub Pages test group

on:
  push:
    branches:
      - vk/external-pages-inspect-2026-09-11

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
      PAGES_URL: https://mobigametim-bit.github.io/RPChess/
    steps:
      - name: Create external Pages testing group when absent
        shell: bash
        run: |
          if [ -z "$MINI_APPS_ACCESS_TOKEN" ]; then
            echo "::error::MINI_APPS_ACCESS_TOKEN is not configured"
            exit 1
          fi

          GROUPS=$(curl --fail --silent --show-error --get \
            --data-urlencode "access_token=${MINI_APPS_ACCESS_TOKEN}" \
            --data-urlencode "v=5.199" \
            --data-urlencode "app_id=54754579" \
            "https://api.vk.ru/method/apps.getTestingGroups")

          COUNT=$(GROUPS="$GROUPS" node -e "const p=JSON.parse(process.env.GROUPS||'{}'); if(p.error){console.error(p.error.error_code+': '+p.error.error_msg);process.exit(2)}; process.stdout.write(String(Array.isArray(p.response)?p.response.length:0))")
          if [ "$COUNT" != "0" ]; then
            echo "Existing VK testing groups found; refusing to overwrite them."
            GROUPS="$GROUPS" node -e "const p=JSON.parse(process.env.GROUPS||'{}'); console.log(JSON.stringify(p.response))"
            exit 0
          fi

          CREATED=$(curl --fail --silent --show-error --request POST \
            --data-urlencode "access_token=${MINI_APPS_ACCESS_TOKEN}" \
            --data-urlencode "v=5.199" \
            --data-urlencode "webview=${PAGES_URL}" \
            --data-urlencode "name=GitHub Pages manual check" \
            --data-urlencode "platforms=web,mobile,mvk" \
            "https://api.vk.ru/method/apps.updateMetaForTestingGroup")

          CREATED="$CREATED" node <<'NODE'
          const p=JSON.parse(process.env.CREATED||'{}');
          if(p.error){console.error(`CREATE ERROR ${p.error.error_code}: ${p.error.error_msg}`);process.exit(2)}
          console.log(`CREATED ${JSON.stringify(p.response)}`);
          NODE

          AFTER=$(curl --fail --silent --show-error --get \
            --data-urlencode "access_token=${MINI_APPS_ACCESS_TOKEN}" \
            --data-urlencode "v=5.199" \
            --data-urlencode "app_id=54754579" \
            "https://api.vk.ru/method/apps.getTestingGroups")
          AFTER="$AFTER" node -e "const p=JSON.parse(process.env.AFTER||'{}'); if(p.error){console.error(p.error.error_code+': '+p.error.error_msg);process.exit(2)}; console.log('GROUPS '+JSON.stringify(p.response))"
