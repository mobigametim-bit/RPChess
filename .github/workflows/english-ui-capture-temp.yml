name: Temporary English UI Capture

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: english-ui-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production dist
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start local production server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/rpchess-english-server.log 2>&1 &
          echo $! >/tmp/rpchess-english-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rpchess-english-server.log
          exit 1

      - name: Validate Training follow-up geometry
        env:
          RPCHESS_ACCEPTANCE_URL: http://127.0.0.1:4173/
        run: node tests/training-followup-qa-temp.cjs

      - name: Prepare screenshot-only harness
        run: |
          sed -i '/resolved and condition frames must have equal width/d' tests/english-ui-capture-temp.cjs
          sed -i '/resolved frame must leave a gap before the board/d' tests/english-ui-capture-temp.cjs

      - name: Capture English UI screenshots
        env:
          RPCHESS_ACCEPTANCE_URL: http://127.0.0.1:4173/
          RPCHESS_CAPTURE_DIR: english-ui-captures
        run: node tests/english-ui-capture-temp.cjs

      - name: Upload English UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: english-ui-captures-${{ github.event.pull_request.head.sha }}
          path: english-ui-captures
          if-no-files-found: error
          retention-days: 2
