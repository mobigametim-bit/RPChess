name: RU Netlify API gateway live smoke

on:
  push:
    branches: [feature/ru-netlify-gateway-20261106]
    paths:
      - '.github/workflows/ru-netlify-gateway-smoke.yml'
      - 'tests/ru-netlify-gateway-smoke.mjs'
  workflow_dispatch:

concurrency:
  group: ru-netlify-gateway-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm deployed Netlify gateway and CORS preflights
        run: node tests/ru-netlify-gateway-smoke.mjs
      - name: Install browser for actual playable-loading check
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install chromium
      - name: Verify game boots and Tournament opens in Chromium
        run: node tests/ru-netlify-playable-browser.cjs
