name: Deploy Tournament PvP Staging API

on:
  push:
    branches:
      - feature/tournament-pvp-mvp-20261022
    paths:
      - tournament-worker/**
      - tests/tournament-live-smoke.mjs
      - tests/tournament-rated-local.mjs
      - .github/workflows/tournament-api-staging-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    if: github.repository == 'mobigametim-bit/RPChess' && github.ref == 'refs/heads/feature/tournament-pvp-mvp-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require staging credentials and independent session signing key
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION: ${{ secrets.PVP_SESSION_SECRET }}
        run: |
          test -n "$TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$SESSION" || { echo "::error::PVP_SESSION_SECRET is missing"; exit 1; }
          [ "$(printf '%s' "$SESSION" | wc -c)" -ge 40 ] || { echo "::error::PVP_SESSION_SECRET must be at least 40 characters"; exit 1; }
      - name: Local verified-VK rating regression (disposable secrets, isolated SQLite)
        run: |
          set -euo pipefail
          npx wrangler dev --local --config tournament-worker/wrangler.toml --ip 127.0.0.1 --port 8789 \
            --var PVP_SESSION_SECRET:rpchess-local-session-secret-for-ci-only-12345678901234567890 \
            --var VK_APP_SECRET:rpchess-local-vk-secret-for-ci-only-do-not-deploy \
            > /tmp/tournament-rated-local.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8789/health > /dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then cat /tmp/tournament-rated-local.log; exit 1; fi
            sleep 1
          done
          node tests/tournament-rated-local.mjs || { tail -150 /tmp/tournament-rated-local.log; exit 1; }
      - name: Install and verify
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy --config tournament-worker/wrangler.toml --dry-run
      - name: Deploy new Tournament Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config tournament-worker/wrangler.toml
      - name: Set Tournament signing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION: ${{ secrets.PVP_SESSION_SECRET }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          printf '%s' "$SESSION" | npx wrangler secret put PVP_SESSION_SECRET --config tournament-worker/wrangler.toml
      - name: Real two-player PvP smoke (no currency issued)
        env:
          RPCHESS_TOURNAMENT_API: https://rpchess-tournament-preview.mobigametim.workers.dev
        run: node tests/tournament-live-smoke.mjs
      - name: Final note
        run: echo "Tournament staging Worker deployed and exercised; existing leaderboard is untouched."
