name: Import PR160 remaining race piece assets

on:
  push:
    branches:
      - feature/race-chess-piece-art-20261016
    paths:
      - imports/pr160/piece-archive.part*
      - scripts/import-pr160-races.py
      - .github/workflows/import-pr160-races.yml

permissions:
  contents: write

concurrency:
  group: import-pr160-race-piece-assets
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.repository == 'mobigametim-bit/RPChess' &&
      github.event.head_commit.message != 'assets: import all remaining color-specific race piece PNGs (PR160)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR160 acceptance branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and verify all 108 PNGs
        run: python3 scripts/import-pr160-races.py
      - name: Commit 108 sprites and discard temporary transport parts
        run: |
          set -euo pipefail
          git add game/assets/races
          git rm -q imports/pr160/piece-archive.part*
          test "$(find game/assets/races -path '*/pieces/board/*/*.png' -type f | wc -l)" -eq 168
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'assets: import all remaining color-specific race piece PNGs (PR160)'
          git push origin HEAD:feature/race-chess-piece-art-20261016
