name: Fix Stage B visual QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-stage-b-visual-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ github.head_ref == 'agent/stage-b-events-ui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-b-events-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply visual corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          assets = Path('game/js/register-01-assets.mjs')
          source = assets.read_text(encoding='utf-8')
          source = source.replace("    legalMove: `${ASSET_ROOT}/vfx/legal_move.png`,\n    captureMove: `${ASSET_ROOT}/vfx/capture_move.png`,", "    legalMove: null,\n    captureMove: null,")
          assets.write_text(source, encoding='utf-8')

          presenter = Path('game/js/vertical-slice-presenter.mjs')
          source = presenter.read_text(encoding='utf-8')
          source = source.replace("      CORE_ASSETS.vfx.captureMove\n    ];", "      CORE_ASSETS.vfx.captureMove\n    ].filter(Boolean);")
          source = source.replace("          const marker = this.assetCache.get(capture ? CORE_ASSETS.vfx.captureMove : CORE_ASSETS.vfx.legalMove);\n          if (marker?.status === 'ready')", "          const markerSource = capture ? CORE_ASSETS.vfx.captureMove : CORE_ASSETS.vfx.legalMove;\n          const marker = markerSource ? this.assetCache.get(markerSource) : null;\n          if (marker?.status === 'ready')")
          presenter.write_text(source, encoding='utf-8')

          css_path = Path('game/css/stage-b-ui.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* stage-b-visual-qa-polish-v2 */'
          if marker not in css:
              css += r'''

          /* stage-b-visual-qa-polish-v2 */
          .rpa-chronicle-card__copy{align-self:stretch!important;margin:9px 0!important;padding:14px 20px!important;border:1px solid #526987!important;border-radius:10px!important;background:linear-gradient(135deg,#101f34f5,#081422f5)!important;box-shadow:inset 0 0 24px #0006!important;color:#f7edda!important}
          .rpa-chronicle-card__copy strong{color:#fff4cf!important;text-shadow:0 2px 5px #000!important}.rpa-chronicle-card__copy small{color:#f1c95d!important}.rpa-chronicle-card__copy>span:last-child{color:#d4deeb!important}
          .rpa-chronicle-card__action{min-width:112px!important;margin:0 18px!important;padding:11px 16px!important;border:10px solid transparent!important;border-image:url('../generated_assets/ui_button_primary.png') 26 fill stretch!important;color:#fff6d4!important;text-align:center!important;text-shadow:0 2px 4px #000!important}
          .rpvs__layout--battle{height:calc(100dvh - 108px)!important;max-height:calc(100dvh - 108px)!important;min-height:620px!important;overflow:hidden!important}
          .rpvs__layout--battle>aside.rpvs__panel{height:100%!important;max-height:100%!important;min-height:0!important;overflow:hidden!important}
          .rpvs__battle-sidebar-scroll{height:auto!important;max-height:calc(100dvh - 205px)!important;overflow-y:auto!important;overflow-x:hidden!important}
          .rpvs__battle-sidebar-scroll .rpvs__sidebar-section{margin:0 0 10px!important;padding:11px!important;border:1px solid #526987!important;border-radius:10px!important;background:linear-gradient(145deg,#101e31f5,#08131ff5)!important;color:#f4ead7!important;box-shadow:inset 0 0 18px #0005!important}
          .rpvs__battle-sidebar-scroll .rpvs__sidebar-section :where(h3,p,strong,small,span){color:inherit!important;text-shadow:none!important}
          .rp02-hero-panel{grid-template-columns:76px minmax(0,1fr)!important;grid-auto-rows:auto!important;align-items:start!important}.rp02-hero-panel__portrait{grid-column:1!important;grid-row:1 / span 4!important}.rp02-hero-panel__body{display:contents!important}
          .rp02-hero-panel__body>.rp02-eyebrow,.rp02-hero-panel__body>h3,.rp02-hero-panel__body>p{grid-column:2!important;min-width:0!important}.rp02-hero-panel__body>h3{margin-top:0!important}.rp02-hero-panel__body>p{margin:.2em 0 .55em!important}
          .rp02-hero-loadout{grid-column:1/-1!important;width:100%!important;margin-top:4px!important}.rp02-mechanic-card,.rp02-relic-slot{grid-template-columns:58px minmax(0,1fr)!important;min-height:82px!important;width:100%!important;max-width:100%!important}
          @media(max-width:900px){.rpvs__layout--battle{height:auto!important;max-height:none!important;overflow:visible!important}.rpvs__layout--battle>aside.rpvs__panel{height:auto!important;max-height:72vh!important}.rpvs__battle-sidebar-scroll{max-height:calc(72vh - 90px)!important}}
          @media(max-width:620px){.rpa-chronicle-card__copy{margin:0 9px 9px!important}.rpa-chronicle-card__action{margin:0 10px 12px!important}}
          '''
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/stage-b-ui.cjs')
          test = test_path.read_text(encoding='utf-8')
          if "const register01 = read('game/js/register-01-assets.mjs');" not in test:
              test = test.replace("  const presenter = read('game/js/vertical-slice-presenter.mjs');", "  const presenter = read('game/js/vertical-slice-presenter.mjs');\n  const register01 = read('game/js/register-01-assets.mjs');")
              test = test.replace("  assert(presenter.includes('animateBattleChanges(previous, snapshot)'));", "  assert(presenter.includes('animateBattleChanges(previous, snapshot)'));\n  assert.strictEqual(register01.includes('legal_move.png'), false);\n  assert.strictEqual(register01.includes('capture_move.png'), false);\n  assert(presenter.includes('].filter(Boolean)'));\n  assert(presenter.includes('markerSource ? this.assetCache.get(markerSource) : null'));\n  assert(css.includes('stage-b-visual-qa-polish-v2'));\n  assert(css.includes('max-height:calc(100dvh - 205px)'));\n  assert(css.includes('.rp02-hero-panel__body{display:contents!important}'));")
              test_path.write_text(test, encoding='utf-8')
          PY
          node --check game/js/register-01-assets.mjs
          node --check game/js/vertical-slice-presenter.mjs
          npm ci
          npm test
          npm run build
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/js/register-01-assets.mjs game/js/vertical-slice-presenter.mjs game/css/stage-b-ui.css tests/stage-b-ui.cjs
          git rm .github/workflows/fix-stage-b-visual-qa.yml
          git commit -m "Polish Stage B after browser visual QA [stage-b-visual-v2]"
          git push origin HEAD:agent/stage-b-events-ui
