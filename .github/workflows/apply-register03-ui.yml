name: Apply Register 03 relic UI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/register-03-relics-and-remaining-abilities' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/register-03-relics-and-remaining-abilities
          fetch-depth: 0
      - name: Detect completed UI package
        id: guard
        run: |
          if test -f tests/register-03-relic-ui.cjs && grep -q "relicChipMarkup(hero.relicIds" game/js/vertical-slice-presenter-register-02.mjs; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.applied == 'false'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.guard.outputs.applied == 'false'
        run: npm ci
      - name: Apply UI integration
        if: steps.guard.outputs.applied == 'false'
        run: node scripts/apply-register03-ui.cjs
      - name: Run complete regression suite
        if: steps.guard.outputs.applied == 'false'
        run: npm test
      - name: Build production distribution
        if: steps.guard.outputs.applied == 'false'
        run: npm run build
      - name: Commit verified UI package
        if: steps.guard.outputs.applied == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            game/js/register-02-codex.mjs \
            game/js/vertical-slice-presenter-register-02.mjs \
            game/vertical-slice.html \
            package.json \
            tests/register-03-relic-ui.cjs
          git commit -m "Apply Register 03 relic art across runtime UI [register03-ui]"
          git push origin HEAD:agent/register-03-relics-and-remaining-abilities
