name: Agent event implementation CI

on:
  push:
    branches:
      - agent/implement-iron-marches-events

permissions:
  contents: read

concurrency:
  group: agent-event-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate production content
        run: npm run content:validate
      - name: Run repository tests
        run: npm test
      - name: Build production distribution
        run: npm run build
