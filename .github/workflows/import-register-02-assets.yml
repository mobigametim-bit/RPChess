name: Import Register 02 Assets

on:
  workflow_dispatch:
  push:
    branches:
      - agent/import-register-02-assets
    paths:
      - .github/workflows/import-register-02-assets.yml
      - scripts/normalize-register-02-assets.py

permissions:
  contents: write

concurrency:
  group: import-register-02-production-assets
  cancel-in-progress: true

jobs:
  download-fragments:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        include:
          - { name: aldric_wall, id: '1NFWEuR3wgunJ3z5FwJJcMyQdUHDBFfKW', count: 3 }
          - { name: mara_chain, id: '1xPNsbevCGwvW_rpVfz0vOXuUZnV06DGM', count: 3 }
          - { name: brother_orell, id: '1JZR_pCAPmvMMRr4l2UGv0BuiyvQR4ro7', count: 3 }
          - { name: vael_hammer, id: '1rmUHL2UOfh1-L3FQ0kZone6YjU0HQTy0', count: 3 }
          - { name: lady_sorn, id: '12V4w7qNkWF1jHvezSjJINxMbCCplyDlh', count: 3 }
          - { name: tomas_gate, id: '1atpxCOK7AaQgC2d-58EpYi7w54rBT-jA', count: 3 }
          - { name: seraph_lyra, id: '1LCOiy4qp1yaSt5t_frDvy4FKo9T3fTFu', count: 3 }
          - { name: ivar_lens, id: '1BhtSWBJO2-5gBVJueCvqt9dka5LC_rmO', count: 3 }
          - { name: nemea_quill, id: '1MxTtHFEbURVlPD2w4CpZZP8s6yUfxFqw', count: 3 }
          - { name: orion_step, id: '1V1SZlLkqZ8qgHzydglM2Z3FGxSfx8AD1', count: 3 }
          - { name: abbess_celene, id: '1TI26Ju1Hd6MDxC3CVEe4g4Ujp8Y-iAro', count: 3 }
          - { name: deacon_mirel, id: '122eSF_xO6tzdoyaR83w5-JWBVD2-KkhK', count: 3 }
          - { name: cassian_coin, id: '1ynXsI1tb7vfAk-sMoOoFpnuLMvpGNhvB', count: 3 }
          - { name: viola_mask, id: '1PikOQZl2FMf8TDEnRwRnHP7z7bz-9mL5', count: 3 }
          - { name: renzo_bridge, id: '1RxkkcH5BruchXOvGxUqDGoqbxtKvlQnU', count: 3 }
          - { name: tessa_gull, id: '1Qmsyg2joJtDTN6krlYWIYJUt67PIcY4v', count: 3 }
          - { name: old_marin, id: '1hN1QLvTb3tq_a_GRcp9OBCD4SzceBaLj', count: 3 }
          - { name: elio_silk, id: '1Qj_6zKaVlxqInogKNPVTME3LfVgNXTXb', count: 3 }
          - { name: briar_sister, id: '1syv8TTnM09AV_piCUHdJzfM4O48wPq8n', count: 3 }
          - { name: roan_stag, id: '121qWGN77Qe1XC0MvIuHq_biOBaJu9t_8', count: 3 }
          - { name: maeve_root, id: '1LcdkVT3X_0crk5a1XBg_MNR9Klhd3CI6', count: 3 }
          - { name: puck_ember, id: '1nx9DV4mygzx22Gtw0goq51s6jqPcgiC_', count: 3 }
          - { name: lord_aylen, id: '1iizKQAEsG62Dxfkw70L-DRwghmWSSqRF', count: 3 }
          - { name: ysra_moss, id: '11PaWDE0pqpX3PVeEk4gM-ebcVJMIhRRu', count: 3 }
          - { name: kael_cinder, id: '1mNvtFrvPUcDbCZ9IrtPwQSlxdLjfwq2V', count: 3 }
          - { name: velka_urn, id: '1-nwh_2gsguhWp9Jp69twzIySM6os2mOy', count: 3 }
          - { name: rath_banner, id: '1cXRfnG_xh7Yn6PECJM6q7h93b3FBjEUh', count: 3 }
          - { name: suri_ash, id: '1iQD8g8vnNzqC2Y8lD5Xi1Dy2aWTfdGpc', count: 3 }
          - { name: empress_nahla, id: '1J4rLjRUtSZK8KPzctVVHLfCyv7F5c3aw', count: 3 }
          - { name: daro_last, id: '1sMWoJozxt0nptF5di34sK4IKoGMNQSmj', count: 3 }
          - { name: temur_wind, id: '1TaMJass-qR6KWeUDM_axk_j5n1ACEVwO', count: 3 }
          - { name: altana_bow, id: '1ZmtjHD5qKf-OOsyPQgU5Opkopr5pKJv9', count: 3 }
          - { name: batu_cliff, id: '11jHIJbfG8b-qaXsbBtVl03hHXbKy3GE3', count: 3 }
          - { name: saran_dawn, id: '1LEFAKd5-kcrr6FQgJYypXwhMj6UDM199', count: 3 }
          - { name: khulan_star, id: '1DjGtGOz2NW1fcnfzT-nCDayciyMp7stc', count: 3 }
          - { name: ergen_cloud, id: '1SUPXy2-pHEMIsVoL84J5Q2A9VqOJ3KET', count: 3 }
          - { name: politics, id: '1sGm-weFOdGUFUXeejAVvahIenHyWoSNF', count: 18 }
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install folder downloader
        run: python -m pip install --disable-pip-version-check 'gdown>=5.2,<6'

      - name: Download one Register 02 folder
        env:
          ASSET_FOLDER: ${{ matrix.name }}
          ASSET_FOLDER_ID: ${{ matrix.id }}
          EXPECTED_COUNT: ${{ matrix.count }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import gdown

          name = os.environ['ASSET_FOLDER']
          folder_id = os.environ['ASSET_FOLDER_ID']
          expected = int(os.environ['EXPECTED_COUNT'])
          root = Path('.asset-import/fragments') / name
          root.mkdir(parents=True, exist_ok=True)
          files = gdown.download_folder(
              url=f'https://drive.google.com/drive/folders/{folder_id}',
              output=str(root),
              quiet=False,
              use_cookies=False,
              remaining_ok=False,
          ) or []
          downloaded = []
          for raw in files:
              source = Path(raw)
              if not source.is_file():
                  continue
              destination = root / source.name
              if source.resolve() != destination.resolve():
                  if destination.exists():
                      raise RuntimeError(f'duplicate source filename in {name}: {destination.name}')
                  shutil.move(str(source), str(destination))
              downloaded.append(destination)
          for directory in sorted(root.rglob('*'), reverse=True):
              if directory.is_dir() and directory != root:
                  try:
                      directory.rmdir()
                  except OSError:
                      pass
          actual = len([item for item in root.iterdir() if item.is_file()])
          if actual != expected:
              raise RuntimeError(f'{name}: expected {expected} files, downloaded {actual}; gdown returned {len(downloaded)}')
          print(f'{name}: downloaded and verified {actual} files')
          PY

      - name: Upload folder fragment
        uses: actions/upload-artifact@v4
        with:
          name: register-02-${{ matrix.name }}
          path: .asset-import/fragments
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  normalize-and-commit:
    if: github.actor != 'github-actions[bot]'
    needs: download-fragments
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-register-02-assets
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install normalizer dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<12'

      - name: Download all folder fragments
        uses: actions/download-artifact@v4
        with:
          pattern: register-02-*
          path: .asset-import/register_02_download
          merge-multiple: true

      - name: Verify merged source set
        run: |
          count=$(find .asset-import/register_02_download -type f | wc -l)
          folders=$(find .asset-import/register_02_download -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "Merged source files: ${count}"
          echo "Merged source folders: ${folders}"
          test "$count" -eq 126
          test "$folders" -eq 37

      - name: Normalize and validate canonical assets
        run: python scripts/normalize-register-02-assets.py --source-root .asset-import/register_02_download

      - name: Verify complete canonical asset set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('content/assets/register_02_assets.json').read_text(encoding='utf-8'))
          assert manifest['assetCount'] == 126, manifest['assetCount']
          assert manifest['heroCount'] == 36, manifest['heroCount']
          assert manifest['politicalCharacterCount'] == 18, manifest['politicalCharacterCount']
          assert not manifest['unmappedSourceImages'], manifest['unmappedSourceImages']
          missing = [asset['repositoryPath'] for asset in manifest['assets'] if not Path(asset['repositoryPath']).is_file()]
          assert not missing, missing
          assert len(list(Path('game/assets/heroes').glob('*/*.png'))) == 108
          assert len(list(Path('game/assets/politics').glob('*.png'))) == 18
          print(f"Verified {manifest['assetCount']} canonical files, {manifest['totalBytes']} bytes")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source and tests
        run: |
          npm run verify
          npm test
          npm run build

      - name: Commit normalized Register 02 assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/assets/heroes game/assets/politics
          git add content/assets/register_02_assets.json
          git add register/REGISTER_02_HEROES_AND_POLITICS.md
          git add game/js/generated/iron-marches-runtime.bundle.js || true
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Import and normalize all Register 02 assets'
          git push origin HEAD:agent/import-register-02-assets
