name: Night localization foundation exact-head

on:
  push:
    branches: [night/verification]

permissions:
  contents: read

jobs:
  localization-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aa8fc2c88c03d3d75633b44ec77572885b86fc08
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run focused localization and inherited source checks
        run: |
          npm run test:localization
          node tests/reboot-foundation.cjs
          node tests/code-health-runtime.cjs
      - name: Build exact production tree
        run: npm run build
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run existing Foundation and viewport browser regressions
        timeout-minutes: 20
        env:
          RPCHESS_BROWSER_TEST: reboot-foundation-browser.cjs,responsive-viewport-browser.cjs
        run: npm run test:browser
