name: Verify and deploy isolated Tournament v4 review

on:
  push:
    branches: [feature/tournament-ui-v4-20261105]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tournament-v4-review
  cancel-in-progress: true

jobs:
  review:
    if: github.repository == 'mobigametim-bit/RPChess' && github.ref == 'refs/heads/feature/tournament-ui-v4-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore optimized graphics cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Run established core regression and package
        run: |
          npm ci --no-audit --no-fund
          npm run gate:local
      - name: Local two-profile Tournament contract (no live secrets)
        run: |
          set -euo pipefail
          npx wrangler dev --local --config tournament-worker/wrangler-profile-local.toml --ip 127.0.0.1 --port 8789 \
            --var ALLOW_LOCAL_PROFILE_API:1 \
            --var RPCHESS_PROFILE_API:http://127.0.0.1:8788 \
            --var PVP_SESSION_SECRET:rpchess-local-session-secret-for-ci-only-12345678901234567890 \
            --var VK_APP_SECRET:rpchess-local-vk-secret-for-ci-only-do-not-deploy \
            > /tmp/rpchess-tournament-v4-local.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8789/health >/dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then tail -70 /tmp/rpchess-tournament-v4-local.log; exit 1; fi
            sleep 1
          done
          node tests/tournament-profile-link-local.mjs || {
            tail -80 /tmp/rpchess-tournament-v4-local.log
            exit 1
          }
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Tournament v4 six-viewport visual acceptance
        env:
          RPCHESS_BROWSER_TEST: tournament-v4-browser.cjs
        run: npm run test:browser
      - name: Upload v4 layouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-v4-screenshots
          path: test-results/tournament-v4
          if-no-files-found: warn
          retention-days: 7
      - name: Require isolated Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION: ${{ secrets.PVP_SESSION_SECRET }}
          VK: ${{ secrets.VK_APP_SECRET }}
        run: |
          test -n "$TOKEN" && test -n "$ACCOUNT" && test -n "$SESSION" && test -n "$VK" || {
            echo "::error::Existing Cloudflare and VK secret names are required for an isolated preview"
            exit 1
          }
      - name: Deploy isolated v4 profile Worker (same D1, separate service)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VK: ${{ secrets.VK_APP_SECRET }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config profile-worker/wrangler-v4.toml
          printf '%s' "$VK" | npx wrangler secret put VK_APP_SECRET --config profile-worker/wrangler-v4.toml
      - name: Deploy isolated v4 Tournament Worker and private DO
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION: ${{ secrets.PVP_SESSION_SECRET }}
          VK: ${{ secrets.VK_APP_SECRET }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config tournament-worker/wrangler-v4.toml
          printf '%s' "$SESSION" | npx wrangler secret put PVP_SESSION_SECRET --config tournament-worker/wrangler-v4.toml
          printf '%s' "$VK" | npx wrangler secret put VK_APP_SECRET --config tournament-worker/wrangler-v4.toml
      - name: Publish static v4 review game only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config tournament-v4-preview/wrangler.toml
          echo 'Review: https://rpchess-tournament-v4-preview.mobigametim.workers.dev/?rpchess_profile=1' >> "$GITHUB_STEP_SUMMARY"
      - name: Public preview health check
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const host='https://rpchess-tournament-v4-preview.mobigametim.workers.dev';
            for(const [api,expected] of [
              ['https://rpchess-profile-v4-preview.mobigametim.workers.dev/health','rpchess-profile-preview'],
              ['https://rpchess-tournament-v4-api-preview.mobigametim.workers.dev/health','tournament']
            ]){
              const r=await fetch(api);
              assert.equal(r.status,200);
              assert.equal((await r.json()).service,expected);
            }
            const page=await fetch(host+'/?rpchess_profile=1');
            assert.equal(page.status,200);
            assert((await page.text()).includes('tournament-v4.css'),'v4 HTML must be deployed');
            const css=await fetch(host+'/css/tournament-v4.css');
            assert.equal(css.status,200);
            assert((await css.text()).includes('tournament-profile-card'));
            console.log('TOURNAMENT V4 PREVIEW READY:',host+'/?rpchess_profile=1');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
