name: VK Direct Deploy

on:
  push:
    branches:
      - build/vk-manual-check-2026-09-11

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VK_APP_ID: ${{ vars.VK_APP_ID }}
      MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
      MINI_APPS_ENVIRONMENT: production
      CI_URLS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve VK app id safely
        shell: bash
        run: |
          if [ -z "$MINI_APPS_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret MINI_APPS_ACCESS_TOKEN is not configured"
            exit 1
          fi

          if [ -n "$VK_APP_ID" ]; then
            echo "VK app id is configured via repository variable."
            exit 0
          fi

          RESPONSE=$(curl --fail --silent --show-error --get \
            --data-urlencode "access_token=${MINI_APPS_ACCESS_TOKEN}" \
            --data-urlencode "v=5.199" \
            "https://api.vk.com/method/apps.get")

          APP_ID=$(VK_RESPONSE="$RESPONSE" node <<'NODE'
          const payload = JSON.parse(process.env.VK_RESPONSE || '{}');
          if (payload.error) {
            console.error(`VK API error ${payload.error.error_code || 'unknown'}: ${payload.error.error_msg || 'unknown'}`);
            process.exit(2);
          }
          const r = payload.response;
          const items = Array.isArray(r) ? r : (r && Array.isArray(r.items) ? r.items : []);
          if (items.length !== 1 || !items[0] || !items[0].id) {
            console.error(`VK API app discovery returned ${items.length} apps; cannot select safely.`);
            process.exit(3);
          }
          process.stdout.write(String(items[0].id));
          NODE
          )

          echo "VK_APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "Resolved VK app id: $APP_ID"

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused combat regressions
        run: npm run test:ui && npm run test:skirmish && npm run test:battle

      - name: Build production dist
        run: npm run build

      - name: Prepare compact VK manual-check bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { optimizePngBuffer } = require('./scripts/piece-asset-runtime.cjs');
          const { optimizePortraitAssets } = require('./scripts/portrait-asset-runtime.cjs');

          const root = path.resolve('dist');
          const eventsRoot = path.join(root, 'assets/events');
          let eventCount = 0;
          let before = 0;
          let after = 0;

          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.toLowerCase().endsWith('.png')) {
                const source = fs.readFileSync(full);
                const optimized = optimizePngBuffer(source, 448);
                const output = optimized.buffer.length < source.length ? optimized.buffer : source;
                fs.writeFileSync(full, output);
                eventCount += 1;
                before += source.length;
                after += output.length;
              }
            }
          }

          walk(eventsRoot);
          const portraits = optimizePortraitAssets(root, {
            write: true,
            maxSide: 320,
            maxBytes: 1536 * 1024,
            maxTotalBytes: 30 * 1024 * 1024,
            expectedCount: 37
          });
          fs.rmSync(path.join(root, 'music'), { recursive: true, force: true });
          console.log(`VK compact events: ${eventCount}, ${before} -> ${after} bytes`);
          console.log(`VK compact portraits: ${portraits.beforeBytes} -> ${portraits.afterBytes} bytes`);
          console.log('VK manual-check bundle omits background music only; combat/UI code is unchanged.');
          NODE

          rm -f build.zip
          (cd dist && zip -qr ../build.zip .)
          BUNDLE_BYTES=$(stat -c%s build.zip)
          echo "VK bundle size: ${BUNDLE_BYTES} bytes"
          if [ "$BUNDLE_BYTES" -ge 50000000 ]; then
            echo "::error::VK manual-check bundle is still >= 50 MB"
            exit 1
          fi

      - name: Create VK hosting config
        shell: bash
        run: |
          cat > vk-hosting-config.json <<EOF
          {
            "static_path": "dist",
            "bundleFile": "./build.zip",
            "app_id": ${VK_APP_ID},
            "noprompt": true,
            "update_prod": true,
            "update_dev": false,
            "endpoints": {
              "mobile": "index.html",
              "mvk": "index.html",
              "web": "index.html"
            }
          }
          EOF

      - name: Deploy to VK Hosting
        run: npx --yes @vkontakte/vk-miniapps-deploy@1.0.2
