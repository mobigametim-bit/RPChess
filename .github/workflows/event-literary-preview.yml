name: Event literary outcomes — isolated QA preview
on:
  push:
    branches:
      - feature/event-literary-outcomes-integration-2026-11
    paths:
      - '.github/workflows/event-literary-preview.yml'
      - 'event-literary-preview/**'
      - 'game/**'
      - 'tests/events*'
      - 'scripts/verify-source.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rpchess-event-literary-preview-20261113
  cancel-in-progress: true
jobs:
  verify-build-publish:
    if: github.repository == 'mobigametim-bit/RPChess' && github.ref == 'refs/heads/feature/event-literary-outcomes-integration-2026-11'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install and prepare SHA-verified Stockfish
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm pack stockfish@18.0.0 --silent --pack-destination /tmp
          mkdir -p /tmp/rpchess-stockfish-package /tmp/rpchess-stockfish-verified
          tar -xzf /tmp/stockfish-18.0.0.tgz -C /tmp/rpchess-stockfish-package
          package=/tmp/rpchess-stockfish-package/package
          for name in stockfish-18-lite-single.js stockfish-18-lite-single.wasm; do
            source=$(find "$package" -type f -name "$name" -print -quit)
            test -n "$source"
            cp "$source" "/tmp/rpchess-stockfish-verified/$name"
          done
          license=$(find "$package" -type f -iname 'Copying.txt' -print -quit)
          test -n "$license"
          cp "$license" /tmp/rpchess-stockfish-verified/COPYING.txt
      - name: Source verification and Event regressions
        run: |
          set -euo pipefail
          npm run verify
          npm run test:code-health
          node tests/events.cjs
          node tests/events-v5.cjs
          node tests/events-visual.cjs
          node tests/event-combat-race.cjs
      - name: Build production-equivalent playable game
        env:
          RPCHESS_STOCKFISH_ASSET_DIR: /tmp/rpchess-stockfish-verified
        run: npm run build
      - name: Verify build includes complete literary catalog and centered modal
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const lookup=fs.readFileSync('dist/js/event-literary-outcome.mjs','utf8');
          const app=fs.readFileSync('dist/js/events-app.mjs','utf8');
          const css=fs.readFileSync('dist/css/events.css','utf8');
          assert(lookup.includes('LITERARY_OUTCOMES'));
          assert(app.includes('data-events-literary'));
          assert(css.includes('events-outcome-literary'));
          for(let i=1;i<=8;i++){
            const path='dist/js/events/literary-outcomes-'+String(i).padStart(2,'0')+'.mjs';
            assert(fs.existsSync(path),path);
          }
          console.log('Event editorial preview: compiled text and centered modal included.');
          NODE
      - name: Publish isolated Event literary preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          grep -Fx 'name = "rpchess-event-literary-preview"' event-literary-preview/wrangler.toml
          npx wrangler deploy --config event-literary-preview/wrangler.toml
      - name: Smoke-test actual published preview
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base='https://rpchess-event-literary-preview.mobigametim.workers.dev';
          (async()=>{
            for(let attempt=0;attempt<15;attempt++){
              try{
                for(const [path,token] of [
                  ['/','data-reboot-foundation'],
                  ['/js/events-app.mjs','data-events-literary'],
                  ['/js/event-literary-outcome.mjs','LITERARY_OUTCOMES'],
                  ['/js/events/literary-outcomes-01.mjs','E037.3'],
                  ['/js/events/literary-outcomes-02.mjs','E084.2'],
                  ['/css/events.css','events-outcome-literary']
                ]){
                  const response=await fetch(base+path,{cache:'no-store'});
                  assert.equal(response.status,200,path);
                  assert((await response.text()).includes(token),path+' missing integrated Event text/UI');
                }
                console.log('Isolated playable Event QA preview LIVE: '+base+'/');
                return;
              }catch(error){
                if(attempt===14)throw error;
                await new Promise(resolve=>setTimeout(resolve,3000));
              }
            }
          })().catch(err=>{console.error(err);process.exitCode=1;});
          NODE
