name: Full RPChess VK browser review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-vk-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/generated_assets/**', 'game/assets/**', 'scripts/*asset-runtime*.cjs', 'scripts/runtime-asset-cache.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical and VK build gates
        run: |
          npm run gate:local
          npm run gate:vk

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Build deterministic VK mock candidate
        run: node scripts/build-vk.cjs --mock

      - name: Run all existing Chromium contracts against dist-vk
        run: node scripts/run-vk-browser-tests-full.cjs
