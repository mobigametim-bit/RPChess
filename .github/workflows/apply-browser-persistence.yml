name: Apply browser profile persistence

on:
  push:
    branches:
      - save/browser-profile-persistence
    paths:
      - .github/workflows/apply-browser-persistence.yml
      - scripts/apply-browser-persistence.cjs

permissions:
  contents: write

concurrency:
  group: apply-browser-profile-persistence
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out persistence branch
        uses: actions/checkout@v4
        with:
          ref: save/browser-profile-persistence
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply strict patch
        run: node scripts/apply-browser-persistence.cjs

      - name: Run complete test suite
        run: npm test

      - name: Build production distribution
        run: npm run build

      - name: Commit persistence layer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/browser/profile-persistence.cjs src/browser/iron-marches-browser-host.cjs game/js/vertical-slice-app.mjs tests/browser-profile-persistence.cjs package.json game/js/generated/iron-marches-runtime.bundle.js
          git diff --cached --stat
          git commit -m 'Persist and restore browser vertical slice profiles'
          git push origin HEAD:save/browser-profile-persistence
