name: Import six named knight portraits and pieces (PR 160)

on:
  push:
    branches:
      - feature/race-chess-piece-art-20261016
    paths:
      - .github/workflows/import-named-knights-pr160.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'mobigametim-bit/RPChess'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download reviewed user art package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1y5ZhKR5O7VjeSH9BZsC0lKtOMcuGaMKM&export=download&confirm=t' \
            -o /tmp/named-knights.zip
          echo '8874706888c4daf6671addb23ee7484bafdc01023abcda87f108def6a52c560a  /tmp/named-knights.zip' | sha256sum -c -
          unzip -t /tmp/named-knights.zip
      - name: Install checked WebP art in runtime paths
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/named-knights.zip -d .
          for hero in vael_hammer orion_step roan_stag suri_ash temur_wind tessa_gull; do
            test -s "game/assets/heroes/$hero/portrait_named.webp"
            for side in white black; do
              test -s "game/assets/heroes/$hero/pieces/$side/knight.webp"
              test "$(head -c4 "game/assets/heroes/$hero/pieces/$side/knight.webp")" = 'RIFF'
            done
          done
          echo "Named knight WebPs: $(find game/assets/heroes -path '*/pieces/*/knight.webp' | wc -l)"
      - name: Commit art to PR branch (not main)
        shell: bash
        run: |
          set -euo pipefail
          for hero in vael_hammer orion_step roan_stag suri_ash temur_wind tessa_gull; do
            git add "game/assets/heroes/$hero/portrait_named.webp" "game/assets/heroes/$hero/pieces/white/knight.webp" "game/assets/heroes/$hero/pieces/black/knight.webp"
          done
          git diff --cached --quiet && { echo 'All assets already committed'; exit 0; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'assets: import 6 named knights (18 optimized WebP)'
          git push origin HEAD:feature/race-chess-piece-art-20261016
