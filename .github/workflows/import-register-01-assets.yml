name: Import Register 01 production assets

on:
  push:
    branches:
      - assets/register-01-production
    paths:
      - .github/workflows/import-register-01-assets.yml
      - scripts/import-register-01-assets.py
      - scripts/normalize-register-01-assets.py

permissions:
  contents: write

concurrency:
  group: import-register-01-production-assets
  cancel-in-progress: true

jobs:
  download-fragments:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        include:
          - { name: ash_regent, id: '1TYD8hZlgGloKrP8ZnecYSalLUQOctrVo', count: 4 }
          - { name: ashen_dominion, id: '1ZoSBPkQ6GNYU8RqoMgX3Cx38QrNpF5S8', count: 9 }
          - { name: cavalry, id: '1pKhVWw9mCeVpJSSQ9Ez_n8SPU-MtiOLz', count: 6 }
          - { name: fortress, id: '1DSmdi8uMt_-VqJW7yVtUfxmxZkN_TcoF', count: 6 }
          - { name: fox_prince, id: '1TSsxj8W2U7X6OKNAgukhEb4dRY7eANHp', count: 4 }
          - { name: free_cities, id: '1L3bS7v-bGYrBFUqn-rt0bvdXUfCS15-O', count: 9 }
          - { name: gambit, id: '1s4D_uYYQvC0ENmikrlsaCKwNDacDgHje', count: 6 }
          - { name: iron_marches, id: '1j9vaejrtScnMeWBDhnZzzaumfcke4Ujj', count: 9 }
          - { name: luminous_synod, id: '1raZS2xvR7EAnCN9bCzSJd-GIgAao5deD', count: 9 }
          - { name: mirror_conclave, id: '1dAOxh0saHTEtAclN5oXBV_cd8_1X3zSU', count: 7 }
          - { name: nameless_heir, id: '1kXJ6OygSf8ZJrnhKxPlDEjvQER3b17R9', count: 4 }
          - { name: neutral, id: '1e8t3NJovIcTzgZVeUcSQTuTn2DM8VMR0', count: 4 }
          - { name: oathkeeper, id: '1QEgTdz60fZVmxyLHwrYOoT8Jj3J3v7mm', count: 4 }
          - { name: pawn_ascension, id: '1MfXroWth9sQCHAz2pXcO9JWJUcGXvNGH', count: 6 }
          - { name: pilgrim, id: '1gcsmFip4eppleZarbXi7C1o1D-VPdl7d', count: 4 }
          - { name: royal_court, id: '1Aa_VAS1fjuSwvBJePJd761aOX6gBfosU', count: 6 }
          - { name: sacred_diagonals, id: '1AAWR5B-vfkB5JAihubza4qr3HDQvBx1g', count: 6 }
          - { name: sky_khanate, id: '1_NmwSVEMU_NwukilP5nfGDt3fphvavrW', count: 9 }
          - { name: stone_crown, id: '1Xgbi0kJQECzgugpciQJUPO0bFSr51oGq', count: 4 }
          - { name: thorn_covenant, id: '1bw_whKIJ9uOLXlCGe6ahoIsqfuYny55C', count: 9 }
          - { name: ui, id: '1Q_kP4enREibMYa7W2h3MWIrY0hxsz7QI', count: 1 }
          - { name: verdant_exiles, id: '1ymANEvC9wYPJo2RP7FyRcTUWuXZrS9Hb', count: 7 }
          - { name: vfx, id: '1mJWplLVWWmGFD0pyCm-xxCSJwSKHV57O', count: 4 }
          - { name: wanderer_queen, id: '1IOZaDC9OOQUFd8W_n9x2CzPAfdy1ULD5', count: 4 }
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install folder downloader
        run: python -m pip install --disable-pip-version-check 'gdown>=5.2,<6'

      - name: Download one Register 01 folder
        env:
          ASSET_FOLDER: ${{ matrix.name }}
          ASSET_FOLDER_ID: ${{ matrix.id }}
          EXPECTED_COUNT: ${{ matrix.count }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import gdown

          name = os.environ['ASSET_FOLDER']
          folder_id = os.environ['ASSET_FOLDER_ID']
          expected = int(os.environ['EXPECTED_COUNT'])
          root = Path('.asset-import/fragments') / name
          root.mkdir(parents=True, exist_ok=True)
          files = gdown.download_folder(
              url=f'https://drive.google.com/drive/folders/{folder_id}',
              output=str(root),
              quiet=False,
              use_cookies=False,
              remaining_ok=False,
          ) or []
          downloaded = []
          for raw in files:
              source = Path(raw)
              if not source.is_file():
                  continue
              destination = root / source.name
              if source.resolve() != destination.resolve():
                  if destination.exists():
                      raise RuntimeError(f'duplicate source filename in {name}: {destination.name}')
                  shutil.move(str(source), str(destination))
              downloaded.append(destination)
          for directory in sorted(root.rglob('*'), reverse=True):
              if directory.is_dir() and directory != root:
                  try:
                      directory.rmdir()
                  except OSError:
                      pass
          actual = len([item for item in root.iterdir() if item.is_file()])
          if actual != expected:
              raise RuntimeError(f'{name}: expected {expected} files, downloaded {actual}; gdown returned {len(downloaded)}')
          print(f'{name}: downloaded and verified {actual} files')
          PY

      - name: Upload folder fragment
        uses: actions/upload-artifact@v4
        with:
          name: register-01-${{ matrix.name }}
          path: .asset-import/fragments
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  normalize-and-commit:
    if: github.actor != 'github-actions[bot]'
    needs: download-fragments
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: assets/register-01-production
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install normalizer dependencies
        run: python -m pip install --disable-pip-version-check 'gdown>=5.2,<6' 'Pillow>=11,<12'

      - name: Download all folder fragments
        uses: actions/download-artifact@v4
        with:
          pattern: register-01-*
          path: .asset-import/register_01_download
          merge-multiple: true

      - name: Verify merged source set
        run: |
          count=$(find .asset-import/register_01_download -type f | wc -l)
          echo "Merged source files: ${count}"
          test "$count" -eq 141
          test "$(find .asset-import/register_01_download -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 24

      - name: Normalize and validate canonical assets
        run: python scripts/normalize-register-01-assets.py --source-root .asset-import/register_01_download

      - name: Verify complete canonical asset set
        run: |
          test -f content/assets/register_01_assets.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('content/assets/register_01_assets.json').read_text(encoding='utf-8'))
          assert manifest['assetCount'] == 141, manifest['assetCount']
          assert not manifest['unmappedSourceImages'], manifest['unmappedSourceImages']
          missing = [asset['repositoryPath'] for asset in manifest['assets'] if not Path(asset['repositoryPath']).is_file()]
          assert not missing, missing
          print(f"Verified {manifest['assetCount']} canonical files, {manifest['totalBytes']} bytes")
          PY

      - name: Commit normalized binary assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/assets content/assets/register_01_assets.json content/board-themes.json register/REGISTER_01_FOUNDATIONS.md
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'Register 01 assets are already normalized on this branch.'
            exit 0
          fi
          git commit -m 'Import and normalize all 141 Register 01 assets'
          git push origin HEAD:assets/register-01-production
