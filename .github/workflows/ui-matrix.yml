name: RPChess responsive UI matrix

on:
  workflow_dispatch:
  push:
    branches:
      - feature/localisation-completion
    paths:
      - .github/workflows/ui-matrix.yml
      - game/index.html
      - game/css/language.css
      - scripts/build.cjs
      - scripts/capture-ui-matrix.cjs
      - tests/reboot-foundation.cjs

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore runtime asset cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/rpchess-runtime-assets-v1
          key: rpchess-runtime-assets-v1-${{ runner.os }}-${{ hashFiles('game/assets/**/*.png', 'game/generated_assets/*.png', 'scripts/*asset*.cjs', 'scripts/runtime-assets-build.cjs') }}
          restore-keys: |
            rpchess-runtime-assets-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run source, localization and production build gate
        run: npm run gate:local
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Capture responsive UI and PDF
        timeout-minutes: 20
        run: node scripts/capture-ui-matrix.cjs
      - name: Upload UI matrix
        uses: actions/upload-artifact@v4
        with:
          name: rpchess-ui-responsive-matrix
          path: artifacts/ui-matrix
          if-no-files-found: error
          retention-days: 7
