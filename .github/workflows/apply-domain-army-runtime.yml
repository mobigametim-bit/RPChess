name: Apply Domain Army Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - agent/domain-army-runtime-migration

permissions:
  contents: write

concurrency:
  group: apply-domain-army-runtime
  cancel-in-progress: true

jobs:
  apply-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/domain-army-runtime-migration
      - name: Record workflow start
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .automation
          printf 'started\n' > .automation/domain-army-workflow.txt
          git add .automation/domain-army-workflow.txt
          git commit -m 'Record domain army workflow start' || true
          git push origin HEAD:agent/domain-army-runtime-migration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply domain army patches
        run: node scripts/apply-domain-army-runtime.cjs
      - name: Register new tests
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const anchor = 'node tests/browser-production-runtime.cjs';
          const addition = 'node tests/domain-army-runtime.cjs && node tests/army-projection-matrix.cjs && ' + anchor;
          if (!packageJson.scripts.test.includes('tests/domain-army-runtime.cjs')) {
            if (!packageJson.scripts.test.includes(anchor)) throw new Error('package test anchor missing');
            packageJson.scripts.test = packageJson.scripts.test.replace(anchor, addition);
          }
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE
      - name: Rebuild production browser runtime
        run: npm run build:browser
      - name: Commit implementation before validation
        run: |
          git add src/runtime/vertical-slice.cjs src/runtime/army-roster.cjs src/browser/profile-persistence.cjs src/browser/iron-marches-browser-host.cjs game/js/generated/iron-marches-runtime.bundle.js package.json
          if git diff --cached --quiet; then
            echo 'Domain army runtime is already applied.'
          else
            git commit -m 'Move selected army into domain runtime'
            git push origin HEAD:agent/domain-army-runtime-migration
          fi
      - name: Verify normalized source
        run: npm run verify
      - name: Run complete test suite
        run: npm test
      - name: Build distribution
        run: npm run build
