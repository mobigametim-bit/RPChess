name: King Pin Ice Gate

on:
  push:
    branches:
      - feature/king-pin-ice

permissions:
  contents: read

jobs:
  pin-ice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run pin ice unit tests
        run: |
          node tests/pin-ice-asset-runtime.cjs
          node tests/king-pin-ice.cjs
      - name: Profile pin ice runtime assets
        run: node scripts/pin-ice-asset-runtime.cjs --root game --max-side 384
      - name: Build production dist
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run real Chromium pin ice acceptance
        env:
          RPCHESS_BROWSER_TEST: king-pin-ice-browser.cjs
        run: npm run test:browser
