name: Refresh VK publication plan and verify candidate foundation

on:
  push:
    branches:
      - platform/vk-premoderation-implementation
    paths:
      - .github/workflows/vk-plan-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/vk-premoderation-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refresh current VK architecture in source-of-truth plan
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/platforms/VK_GAMES_PUBLICATION_PLAN.md')
          s = p.read_text(encoding='utf-8')
          marker = '## Обозначения\n'
          assert marker in s
          rest = s[s.index(marker):]
          prefix = '''# RPChess → VK Games: пошаговый план публикации

> **ТЕКУЩИЙ ЭТАП ПРОЕКТА — PRE-MODERATION VK GAMES (ACTIVE, 2026-09-13).**
> Этот документ остаётся source of truth, но блок ниже заменяет устаревшие предположения версии 2026-09-10 о VK Hosting.

**Версия плана:** 2026-09-13  
**Проект:** RPChess  
**VK App ID:** `54754579`  
**Текущий URL игры:** `https://mobigametim-bit.github.io/RPChess/`  
**Цель:** первая публикация RPChess во VK Games без форка игровой логики и без расхождения с Web-версией.

## CURRENT ARCHITECTURE OVERRIDE — 2026-09-13

Фактически проверенная схема первой VK-версии:

```text
main
  → canonical npm run build / dist
  → GitHub Pages
  → https://mobigametim-bit.github.io/RPChess/
  → VK iframe / WebView (app 54754579)
```

Уже подтверждено вручную внутри VK Web:

- приложение открывается с GitHub Pages;
- ранний `VKWebAppInit` снимает загрузочный экран VK;
- Battle/Skirmish работают с исправленной compact landscape геометрией;
- игровая логика не требует отдельной VK-копии.

Поэтому пункты ниже про обязательные `dist-vk/`, `vk-hosting-config.json`, загрузку большого пакета в VK Hosting и отдельный VK Hosting production deploy считаются **SUPERSEDED** для текущего релизного пути. Они сохраняются как исторический/резервный вариант и снова становятся актуальны только если осознанно меняем hosting strategy.

Текущие технические приоритеты перед модерацией:

1. единый Web/VK platform boundary и ранний init;
2. lifecycle: pause/resume при скрытии/возврате;
3. persistence через `platform.storage` с localStorage backend в v1;
4. license/provenance audit;
5. exact-candidate gate + ручной VK smoke;
6. фактические данные карточки/поддержки и продуктовые решения владельца.

Cloud save, реклама, покупки, leaderboard и social API не считаются автоматически обязательными: включаем только выбранный release scope и то, что фактически требует/поддерживает текущий кабинет VK для нашего проекта.

См. также:

- `docs/platforms/VK_MODERATION_CHECKLIST.md`;
- `docs/platforms/VK_LICENSE_AUDIT_2026-09-13.md`.

---

'''
          p.write_text(prefix + rest, encoding='utf-8')
      - name: Deterministic platform runtime smoke
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          class MemoryStorage {
            constructor(){ this.map = new Map(); }
            get length(){ return this.map.size; }
            key(index){ return [...this.map.keys()][index] ?? null; }
            getItem(key){ return this.map.has(key) ? this.map.get(key) : null; }
            setItem(key,value){ this.map.set(String(key),String(value)); }
            removeItem(key){ this.map.delete(String(key)); }
          }
          const storage = new MemoryStorage();
          const doc = new EventTarget();
          doc.hidden = false;
          doc.visibilityState = 'visible';
          doc.referrer = '';
          const windowBus = new EventTarget();
          globalThis.localStorage = storage;
          globalThis.document = doc;
          globalThis.location = { search:'?vk_app_id=54754579' };
          globalThis.addEventListener = windowBus.addEventListener.bind(windowBus);
          globalThis.removeEventListener = windowBus.removeEventListener.bind(windowBus);
          let initCalls = 0;
          globalThis.AndroidBridge = { VKWebAppInit(){ initCalls += 1; } };
          const { platform } = await import(`./game/js/platform.mjs?smoke=${Date.now()}`);
          assert.equal(platform.kind, 'vk');
          assert.equal(platform.init(), true);
          assert.equal(initCalls, 1);
          platform.init();
          assert.equal(initCalls, 1, 'VK init must be idempotent');
          platform.storage.setItem('smoke', 'ok');
          assert.equal(platform.storage.getItem('smoke'), 'ok');
          const states = [];
          const unsubscribe = platform.lifecycle.subscribe((state) => states.push(state));
          assert.equal(states.at(-1).active, true);
          windowBus.dispatchEvent(new Event('pagehide'));
          assert.equal(states.at(-1).active, false);
          windowBus.dispatchEvent(new Event('pageshow'));
          assert.equal(states.at(-1).active, true);
          unsubscribe();
          console.log('VK/Web platform runtime smoke: PASS');
          NODE
      - name: Full local pre-moderation gate
        run: npm run gate:local
      - name: Commit refreshed plan after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/platforms/VK_GAMES_PUBLICATION_PLAN.md
          git rm .github/workflows/vk-plan-refresh.yml
          git commit -m "docs: align VK publication plan with Pages architecture"
          git push origin HEAD:platform/vk-premoderation-implementation
