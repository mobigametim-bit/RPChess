name: Import Register 03 relic assets

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.head_ref == 'agent/register-03-relics-and-remaining-abilities' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/register-03-relics-and-remaining-abilities
          fetch-depth: 0
      - name: Detect completed import
        id: guard
        run: |
          if test -f content/audits/register_03_relic_assets.json && test -f game/assets/relics/echo_shield.png; then
            echo "imported=true" >> "$GITHUB_OUTPUT"
          else
            echo "imported=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.imported == 'false'
        with:
          python-version: '3.12'
      - name: Install importer dependencies
        if: steps.guard.outputs.imported == 'false'
        run: python -m pip install --disable-pip-version-check gdown==5.2.0 pillow==11.3.0
      - name: Import, normalize and audit assets
        if: steps.guard.outputs.imported == 'false'
        run: python scripts/import-register-03-from-drive.py
      - name: Commit imported assets
        if: steps.guard.outputs.imported == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/relics game/js/register-03-relic-assets.mjs content/manifests/register-03-relics.json content/audits/register_03_relic_assets.json
          git commit -m "Import Register 03 relic assets [register03-imported]"
          git push origin HEAD:agent/register-03-relics-and-remaining-abilities
